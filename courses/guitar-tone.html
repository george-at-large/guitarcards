  $('#mvol').oninput = (e) => { S.vol = +e.target.value; save(); if (ctx) setP(AU.master.gain, S.vol); };
  $('#mtrim').oninput = (e) => { S.trim = +e.target.value; save(); if (ctx && AU.micOn) setP(AU.micBus.gain, S.trim); };
}

const qz = (id) => `<div data-q="${id}"></div>`;
const call = (kind, title, html) => `<div class="callout ${kind}"><b>${title}</b>${html}</div>`;
const pct = (v) => Math.round(v * 100) + '%';
const knob10 = (v) => (v * 10).toFixed(1);
</script>

<script>

const CLEAN = { amp: { on: true, model: 'fender', gain: 0.22, master: 0.3 }, cab: { on: true, type: '2x12' } };

CH.push({
  id: 'map', title: 'What “tone” actually is', short: 'What tone is', mins: 3,
  body: () => `
  <p class="lede">Tone is everything about a note <i>except which note it is</i>. Two guitars playing the same A sit on the same fundamental (110 Hz); what differs is the recipe of overtones above it, how that recipe changes over the life of the note, how it reacts to your hands, and the space around it.</p>
  <p>Every knob on every guitar, pedal and amp moves one or more of four dimensions. Learn to hear those four and you can reason about gear you have never seen.</p>
  <div class="grid2">
    <div class="card"><b>1 · Spectrum</b><br>Where the energy sits: lows, low-mids, mids, presence, air. Pickups, tone knobs, tone stacks, cabinets and EQ all reshape it. They <i>filter</i>.</div>
    <div class="card"><b>2 · Saturation</b><br>How many new harmonics are created and how hard peaks are squashed. Drive, fuzz and amp gain <i>add</i> frequencies that weren't in the input.</div>
    <div class="card"><b>3 · Envelope &amp; dynamics</b><br>Attack, sustain and decay, and how much your picking strength changes the sound. Compressors, gain and sag live here.</div>
    <div class="card"><b>4 · Space &amp; motion</b><br>Reverb, delay and modulation: copies of the signal shifted in time or pitch. They place the sound in a room and make it move.</div>
  </div>
  <h2>The chain is three kinds of processor</h2>
  <p>Strip away the brand names and every stage is one of three things:</p>
  <ul>
    <li><b>Linear filters</b>: pickups, tone knobs, the amp's tone stack, the speaker cabinet, EQ. They turn frequencies up or down but never invent new ones. Two filters in a row give the same result in either order.</li>
    <li><b>Nonlinear stages</b>: anything that distorts or compresses. They <i>create</i> harmonics, and what comes out depends on how loud the input is. Order matters because of these.</li>
    <li><b>Time-based effects</b>: delay, reverb, chorus, flanger, phaser. They mix the signal with copies of itself shifted in time.</li>
  </ul>
  ${call('phys', 'The physics in one line', 'A plucked string vibrates at its fundamental and at whole-number multiples of it (2×, 3×, 4×…) all at once. Those are the <b>harmonics</b>. Their relative levels set the waveform\'s shape and your sense of timbre. On the spectrum display they show up as evenly spaced spikes.')}
  ${demo('chain')}
  ${call('big', 'How to read the display', 'Left: the <b>waveform</b>, air pressure over a few milliseconds. Right: the <b>spectrum</b>, energy per frequency on a log axis, so each octave gets the same width, like a piano keyboard. A tall, bright, spiky spectrum that reaches past 5 kHz reads as bright or harsh. Energy piled up under 300 Hz reads as warm or muddy.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {

          { name: '+ pickup (DI)', set: { 'guitar.pickup': 'bridge', 'amp.on': false, 'cab.on': false, 'reverb.on': false } },
          { name: '+ amp, no cab', set: { 'guitar.pickup': 'bridge', 'amp.on': true, 'amp.model': 'marshall', 'amp.gain': 0.55, 'cab.on': false, 'reverb.on': false } },
          { name: '+ cabinet', set: { 'guitar.pickup': 'bridge', 'amp.on': true, 'amp.model': 'marshall', 'amp.gain': 0.55, 'cab.on': true, 'cab.type': '4x12', 'reverb.on': false } },
          { name: '+ room', set: { 'guitar.pickup': 'bridge', 'amp.on': true, 'amp.model': 'marshall', 'amp.gain': 0.55, 'cab.on': true, 'cab.type': '4x12', 'reverb.on': true, 'reverb.type': 'room', 'reverb.mix': 0.3 } },
        ] },
      ],
      listen: 'the jump from <i>amp, no cab</i> (a fizzy, angry-bee buzz up past 5 kHz) to <i>+ cabinet</i>, where that fizz is gone. The speaker cabinet is the biggest filter in the whole chain. The bare string is dull because no pickup is emphasising anything yet.',
    },
  },
  qs: {
    q1: { q: 'A Strat and a Les Paul both play A at 110 Hz. What mainly makes them sound different?', opts: ['Their fundamental frequency is slightly different', 'The relative levels of the harmonics above 110 Hz, and how those change over time', 'One produces harmonics and the other does not', 'Only the loudness'], a: 1, why: 'Pitch is set by the fundamental, and both are at 110 Hz. Timbre is the harmonic recipe and its envelope. Pickup position and type, scale length and construction all reshape that recipe.' },
    q2: { q: 'Which stage creates frequencies that were not in its input?', opts: ['A graphic EQ', 'A speaker cabinet', 'An overdrive pedal', 'A reverb'], a: 2, why: 'Distortion is nonlinear, so it generates new harmonics and intermodulation products. EQ and cabinets are linear filters. Reverb adds delayed copies but no new frequencies.' },

CH.push({
  id: 'hands', title: 'Hands, pick and strings', short: 'Hands & strings', mins: 3,
  body: () => `
  <p class="lede">The first tone control is the excitation: where, how hard and with what you strike the string. Everything downstream can only reshape what your hands put in.</p>
  <h2>Where you pick is a filter</h2>
  <p>When you pluck at a point, the string can't have a vibration mode with a still point (a node) there. Picking at <b>1/n</b> of the string's length cancels the n-th harmonic and its multiples. Over the 12th fret (½) every even harmonic disappears, giving a hollow, flute-like sound. Near the bridge (1/10 or less) the cancellations sit high up, so most harmonics survive: thin, bright and snappy.</p>
  <h2>What you pick with is a filter</h2>
  <p>A thin, stiff, pointed pick leaves the string almost instantly, a short impulse with lots of high harmonics. A thumb or fingertip is wide and soft, so the release is slow and the highs never get going (think of Wes Montgomery's thumb). Picking <b>harder</b> makes the note louder <i>and</i> brighter, because a faster release excites more high harmonics.</p>
  <h2>Strings age</h2>
  <p>Fresh strings are uniform, so their upper harmonics sustain and stay in tune with each other: shimmer. Dirt and corrosion add uneven mass and damping, so highs die within a second and the note goes dull and slightly out of tune with itself. Heavier gauges carry more output and a stronger fundamental (not modelled here).</p>
  ${demo('pluck')}
  ${call('inter', 'Interaction: hands × gain', 'Your dynamics only become <i>timbre</i> when something nonlinear sits downstream. Into a clean amp, harder means louder and a bit brighter. Into an amp at the edge of breakup, harder means dirtier, so the picking hand becomes a gain knob. High gain and heavy compression flatten this: everything comes out the same size.')}
  ${demo('touch')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    pluck: {
      title: 'The picking hand', phrases: ['lick', 'arp', 'chords'], scope: 'spec', cfg: CLEAN, plot: (cv, D) => {
        const beta = (D.state['guitar.pluck'] ?? 110) / 648, hard = D.state['guitar.hard'] ?? 0.6;
        const { w, h, dpr } = fitCanvas(cv), g = cv.getContext('2d'); g.clearRect(0, 0, w, h);
        g.fillStyle = 'rgba(255,255,255,0.35)'; g.font = `${10 * dpr}px system-ui`; g.fillText(`Harmonics 1–24 of an open string, picked ${Math.round(beta * 648)} mm from the bridge (1/${(1 / beta).toFixed(1)} of its length)`, 6 * dpr, 13 * dpr);
        const N = 24, bw = w / N;
        for (let k = 1; k <= N; k++) { const a = Math.abs(Math.sin(k * Math.PI * beta)) / Math.pow(k, 1.4 - hard * 0.9); const y = clamp(1 + Math.log10(a + 1e-4) / 2.5, 0, 1); g.fillStyle = a < 0.08 ? '#f87171' : '#ffb547'; g.fillRect((k - 1) * bw + 2 * dpr, h - y * (h - 22 * dpr), bw - 4 * dpr, y * (h - 22 * dpr)); }
      },
      controls: [
        { k: 'guitar.pluck', label: 'Pick position (mm from bridge)', min: 25, max: 324, step: 1, v: 110, fmt: (v) => v + ' mm', hint: '324 mm is over the 12th fret' },
        { k: 'guitar.hard', label: 'Pick: soft thumb → hard thin pick', min: 0, max: 1, v: 0.6 },
        { k: 'guitar.dyn', label: 'Picking strength', min: 0.2, max: 1, v: 0.85 },
        { k: 'guitar.strings', label: 'Strings', type: 'seg', opts: [['fresh', 'Fresh'], ['dead', '6 months old']] },
        { k: 'guitar.pickup', label: 'Pickup', type: 'seg', v: 'neck', opts: [['neck', 'Neck'], ['mid', 'Middle'], ['bridge', 'Bridge']] },
      ],
      listen: 'slide the pick position to 324 mm and back to 30 mm. The red bars on the graph are harmonics your pick position cancels. Then try “thumb” at full strength against a hard pick at half strength: the soft pick at full strength is louder but still darker.',
    },
    touch: {
      title: 'Touch-sensitive amp: the same crescendo, two amps', phrases: ['dyn', 'lick'], scope: 'wave',
      cfg: { amp: { on: true, model: 'marshall', gain: 0.32, master: 0.5, sag: 0.5 }, cab: { type: '4x12' }, guitar: { pickup: 'bridge' } },
      controls: [
        { type: 'ab', label: 'Amp', opts: [{ name: 'Clean, lots of headroom', set: { 'amp.model': 'fender', 'amp.gain': 0.15, 'amp.master': 0.25 } }, { name: 'Edge of breakup', set: { 'amp.model': 'marshall', 'amp.gain': 0.5, 'amp.master': 0.55 } }, { name: 'High gain', set: { 'amp.model': 'modern', 'amp.gain': 0.75, 'amp.master': 0.4 } }], v: 1 },
      ],
      listen: 'on <i>Edge of breakup</i>, the first soft strums are clean and the last ones growl. On <i>High gain</i> even the softest strum is fully distorted and the dynamics have flattened.',
    },
  },
  qs: {
    q1: { q: 'You pick exactly over the 12th fret, the midpoint of the string. Which harmonics vanish?', opts: ['The fundamental', 'All the odd harmonics', 'All the even harmonics (2nd, 4th, 6th…)', 'Only harmonics above 5 kHz'], a: 2, why: 'Every even-numbered mode has a node at the midpoint, so a pluck there can\'t excite it. What remains is odd harmonics only: hollow, flute-like, close to a square wave.' },
    q2: { q: 'Why does an edge-of-breakup amp feel “touch sensitive” when a high-gain amp doesn\'t?', opts: ['High-gain amps ignore the guitar\'s volume', 'Near breakup, small changes in input level move the signal between the linear and clipping parts of the curve; at high gain everything is already clipped', 'Breakup amps have a special sensor', 'High-gain amps have no tone stack'], a: 1, why: 'Touch sensitivity is your input level crossing the clipping threshold. When the gain is so high that even soft notes clip, picking strength barely changes the timbre.' },
  },
});

CH.push({
  id: 'pickups', title: 'Pickups, knobs and the cable', short: 'Pickups', mins: 4,
  body: () => `
  <p class="lede">A pickup shapes tone in two independent ways. <b>Where</b> it sits is a geometric comb filter, the same physics as pick position. <b>What</b> it is, an inductor wired to capacitance, makes a resonant low-pass filter.</p>
  <h2>Position: the comb</h2>
  <p>A pickup senses the string's motion at one spot. The <b>bridge pickup</b> (about 4 cm from the saddle) sits where the string barely moves for low modes, so the fundamental is weak relative to the upper harmonics: thin, cutting, “bite”. The <b>neck pickup</b> (about 16 cm, roughly ¼ of the open string) hears a strong fundamental and notches the 4th harmonic: round, vocal, fat. Fretting higher shortens the string, so the same pickup sits at a larger <i>fraction</i> of it and the comb moves.</p>
  <p>Strat positions 2 and 4 run two pickups in parallel. Their combs interfere and scoop the low-mids, giving the hollow, glassy “quack”. Wire one pickup <b>out of phase</b> and everything both pickups hear alike, mostly the lows, cancels. What's left is thin and nasal, a sound associated with late-60s British blues.</p>
  <h2>Type: the resonance</h2>
  <p>A coil of wire is an inductor (L, measured in henries). With the cable's and pickup's capacitance (C) it forms a resonant low-pass at <code>f = 1 / (2π√LC)</code>, with a peak just below the cutoff. The peak frequency and height are a large part of a pickup's character:</p>
  <div class="tablewrap"><table><tr><th>Type</th><th>Inductance</th><th>Resonant peak (with a 3 m cable)</th><th>Character</th></tr>
  <tr><td>Single coil</td><td>≈ 2.5 H</td><td>≈ 4.5–5 kHz, tall</td><td>Glassy, sparkly, articulate, hums</td></tr>
  <tr><td>P-90</td><td>≈ 4 H</td><td>≈ 3.5 kHz</td><td>Gritty, punchy mids, hums</td></tr>
  <tr><td>Humbucker</td><td>≈ 4–5 H (two coils in series)</td><td>≈ 2.5–3.5 kHz, broader</td><td>Thick, warm, loud, hum-cancelling. Its two coils sense two points, which smears the highs</td></tr></table></div>
  <p>Hotter pickups also put out more voltage, so they push every later gain stage harder.</p>
  ${demo('sel')}
  <h2>The knobs and the cable are filters too</h2>
  <p><b>Tone knob:</b> a capacitor (22–47 nF) to ground through a variable resistor. Rolling it back first flattens the resonant peak, then pulls the resonance down to around 700 Hz with a honky bump. Neck humbucker, tone on 0, loud amp: that's the classic <i>woman tone</i>.</p>
  <p><b>Volume knob:</b> turning it down adds resistance in series with the cable's capacitance, which makes a low-pass, so the sound gets darker as well as quieter. A <i>treble-bleed</i> capacitor across the pot fixes this. <b>Cable:</b> about 100 pF per metre. A 6 m cable pulls a single coil's peak down by roughly a kilohertz. A buffer (in many pedals) isolates the pickup from the cable, one reason “true bypass vs buffered” is a real debate.</p>
  ${demo('knobs')}
  ${call('inter', 'Interactions', '<b>Pickup output × amp gain:</b> swap a single coil for a humbucker and the amp distorts more with the same settings. <b>Volume knob × overdrive:</b> the guitar\'s volume is your remote gain control. Roll back to clean up, but expect it to darken unless you have treble bleed. <b>Tone knob × gain:</b> distortion amplifies whatever is left, so a rolled-off tone into high gain gives a smooth, violin-like lead.')}
  ${call('listen', 'Using your own guitar?', 'With 🎸 on, your real pickups replace the simulated ones and the pickup controls here only affect the built-in guitar. Try the real thing: roll your volume back into the crunch preset below.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    sel: {
      title: 'Pickup selector lab', phrases: ['chords', 'lick', 'arp'], scope: 'spec', cfg: CLEAN,
      plot: (cv, D) => {
        const g = Object.assign({}, DEF.guitar, rig ? rig.cfg.guitar : {}), st = D.state;
        for (const k of ['guitar.pickup', 'guitar.type', 'guitar.phase']) if (st[k] !== undefined) g[k.split('.')[1]] = st[k];
        const taps = selectorTaps(g), e = pickupElectrics(g), f0 = 110, Ls = 648;
        const comb = (f) => { let re = 0, im = 0; for (const [d, w] of taps) { const tau = (d / Ls) / f0; re += w * (1 - Math.cos(2 * Math.PI * f * tau)); im += w * Math.sin(2 * Math.PI * f * tau); } return 20 * Math.log10(Math.hypot(re, im) + 1e-4) + 6; };
        const res = (f) => { const x = f / e.f; return 20 * Math.log10(e.gain / Math.sqrt(Math.pow(1 - x * x, 2) + Math.pow(x / e.Q, 2))); };
        plotResp(cv, [comb, res], { range: 48, top: 18, lo: 40, hi: 16000 });
        const c = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1); c.font = `${10 * dpr}px system-ui`; c.fillStyle = '#ffb547'; c.fillText('position comb (open A string)', 60 * dpr, 13 * dpr); c.fillStyle = '#4cc9f0'; c.fillText(`electrical resonance ≈ ${(e.f / 1000).toFixed(1)} kHz`, 60 * dpr, 26 * dpr);
      },
      controls: [
        { k: 'guitar.pickup', label: 'Selector', type: 'seg', v: 'bridge', opts: [['neck', 'Neck'], ['nm', 'N+M'], ['mid', 'Mid'], ['mb', 'M+B'], ['bridge', 'Bridge'], ['nb', 'N+B']] },
        { k: 'guitar.type', label: 'Pickup type', type: 'seg', v: 'sc', opts: [['sc', 'Single coil'], ['p90', 'P-90'], ['hb', 'Humbucker']] },
        { k: 'guitar.phase', label: 'Second pickup (two-pickup positions only)', type: 'seg', v: 'in', opts: [['in', 'In phase'], ['out', 'Out of phase']] },
      ],
      listen: 'Neck → Bridge on single coils: the fundamental drops away and the attack sharpens. Then N+M and M+B: the in-between “quack” is a scooped, glassy sound neither pickup makes alone. Then N+B with out-of-phase: thin and nasal, because the shared lows cancel. Finally switch type to Humbucker on the bridge: louder, thicker, peak moved down.',
    },
    knobs: {
      title: 'Tone, volume and cable into a crunchy amp', phrases: ['lick', 'chords', 'lead'], scope: 'spec',
      cfg: { amp: { on: true, model: 'marshall', gain: 0.6, master: 0.5 }, cab: { type: '4x12' }, guitar: { type: 'hb', pickup: 'neck' } },
      plot: (cv, D) => { const g = Object.assign({}, DEF.guitar, { type: 'hb' }); for (const [k, v] of Object.entries(D.state)) if (k.startsWith('guitar.')) g[k.slice(7)] = v; const e = pickupElectrics(g); plotResp(cv, (f) => { const x = f / e.f; let d = 20 * Math.log10(e.gain / Math.sqrt(Math.pow(1 - x * x, 2) + Math.pow(x / e.Q, 2))); d += -10 * Math.log10(1 + Math.pow(f / e.volF, 2)); return d; }, { range: 48, top: 18, lo: 40, hi: 16000 }); },
      controls: [
        { k: 'guitar.type', label: 'Pickup', type: 'seg', v: 'hb', opts: [['sc', 'Single coil'], ['hb', 'Humbucker']] },
        { k: 'guitar.pickup', label: 'Position', type: 'seg', v: 'neck', opts: [['neck', 'Neck'], ['bridge', 'Bridge']] },
        { k: 'guitar.tone', label: 'Tone knob', min: 0, max: 1, v: 1, fmt: knob10 },
        { k: 'guitar.vol', label: 'Volume knob', min: 0.2, max: 1, v: 1, fmt: knob10 },
        { k: 'guitar.cable', label: 'Cable length', min: 1, max: 9, step: 0.5, v: 3, fmt: (v) => v + ' m' },
        { k: 'guitar.bleed', label: 'Treble-bleed cap', type: 'toggle', v: false },
      ],
      listen: 'roll the volume to 6 or 7: the amp cleans up and darkens. Turn on treble bleed and repeat: still cleaner, no longer dark. Then tone to 0 on the neck humbucker for the <i>woman tone</i>: a smooth honk around 700 Hz with the fizz gone.',
    },
  },
  qs: {
    q1: { q: 'Which pickup hears the weakest fundamental relative to its upper harmonics, and why?', opts: ['Neck, because it is closest to the fretboard', 'Bridge, because the string barely moves near its fixed end for the low modes', 'Middle, because of hum', 'They all hear the same, only the electronics differ'], a: 1, why: 'Near a fixed end, low modes have tiny amplitude while high modes still move. So the bridge pickup gets proportionally more harmonics: thin and bright.' },
    q2: { q: 'You roll your guitar volume from 10 to 6 into a crunchy amp. What happens, and why?', opts: ['Only quieter', 'Cleaner (less input into the clipping stages) and darker (pot resistance plus cable capacitance make a low-pass)', 'Brighter and dirtier', 'Nothing until 3'], a: 1, why: 'Less voltage means less clipping downstream. The pot\'s series resistance and the cable capacitance form a low-pass filter, which a treble-bleed cap compensates for.' },
  },
});

CH.push({
  id: 'comp', title: 'Compression: shaping the envelope', short: 'Compression', mins: 3,
  body: () => `
  <p class="lede">A compressor is an automatic volume knob. When the signal goes above the <b>threshold</b>, it turns the signal down by the <b>ratio</b>. Then <b>makeup gain</b> brings everything back up, so the quiet tail of each note ends up louder: sustain.</p>
  <ul>
    <li><b>Ratio</b> 4:1 means 4 dB over the threshold comes out as 1 dB over. Above about 10:1 it's limiting.</li>
    <li><b>Attack</b> is how quickly it clamps down. <i>Slow</i> (20–40 ms) lets the pick click through first: snap and “spank”, chicken-picking. <i>Fast</i> (under 2 ms) flattens the transient: smooth, but flat.</li>
    <li><b>Release</b> is how quickly it lets go. Too fast and you hear the level pump. Slow gives a steady, glued sound.</li>
    <li><b>Blend</b> mixes the dry signal back in (parallel compression): the natural attack plus the compressed sustain.</li>
  </ul>
  ${demo('comp')}
  ${call('inter', 'Interactions', '<b>Compressor → drive:</b> the drive gets a steadier input, so it clips more evenly and sustains longer, but your picking dynamics go away. <b>Drive → compressor:</b> distortion already compresses heavily, so a compressor afterwards mostly evens out levels. <b>Distortion is a compressor.</b> Clipping caps the peaks, which is why high-gain notes sustain with no pedal at all.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    comp: {
      title: 'Compressor', phrases: ['arp', 'lick', 'chords'], scope: 'wave', cfg: Object.assign({ comp: { on: true }, guitar: { pickup: 'mb' } }, CLEAN),
      controls: [
        { k: 'comp.on', label: 'Compressor on', type: 'toggle', v: true },
        { type: 'meter', label: 'Gain reduction', read: () => -rig.blocks.comp.node.reduction, max: 20, fmt: (v) => '−' + v.toFixed(1) + ' dB' },
        { k: 'comp.thr', label: 'Threshold', min: -60, max: 0, step: 1, v: -36, fmt: (v) => v + ' dB' },
        { k: 'comp.ratio', label: 'Ratio', min: 1, max: 20, step: 0.5, v: 6, fmt: (v) => v + ':1' },
        { k: 'comp.att', label: 'Attack', min: 0.5, max: 80, step: 0.5, v: 25, fmt: (v) => v + ' ms' },
        { k: 'comp.rel', label: 'Release', min: 20, max: 1000, step: 5, v: 220, fmt: (v) => v + ' ms' },
        { k: 'comp.makeup', label: 'Makeup gain', min: 0, max: 24, step: 0.5, v: 12, fmt: (v) => '+' + v + ' dB' },
        { k: 'comp.blend', label: 'Blend (dry ← → wet)', min: 0, max: 1, v: 1, fmt: pct },
      ],
      listen: 'on the arpeggio, toggle the compressor and watch the waveform: the tails swell and every note ends up the same height. Set attack to 0.5 ms, then 40 ms, and listen for the pick click coming back. Release at 20 ms with ratio 20:1 shows you pumping.',
    },
  },
  qs: {
    q1: { q: 'You want the pick\'s snap to cut through while the notes ring longer. Which settings?', opts: ['Very fast attack, high ratio', 'Slower attack (≈20–30 ms), moderate ratio, makeup gain', 'Threshold at 0 dB', 'Fast release only'], a: 1, why: 'A slow attack lets the transient through before the gain drops. The compression then holds down the body of the note, and makeup gain raises the decaying tail.' },
    q2: { q: 'Why do high-gain sounds sustain even without a compressor?', opts: ['Thicker strings', 'Clipping caps the peaks, so as the string decays the output level stays nearly constant until the input falls below the clipping threshold', 'The tone stack adds sustain', 'Reverb'], a: 1, why: 'A saturated stage outputs about the same level whatever the input level, which is extreme compression. The note only dies when the input drops below where clipping starts.' },
  },
});

CH.push({
  id: 'clip', title: 'Gain and clipping physics', short: 'Clipping physics', mins: 4,
  body: () => `
  <p class="lede">Every overdrive, distortion, fuzz and cranked amp is a <b>transfer curve</b>: output as a function of input. A straight diagonal line is clean. Any bend in it is distortion. The shape of the bend decides which harmonics come out.</p>
  <ul>
    <li><b>Soft clipping</b> (tubes, diodes in an op-amp's feedback loop): the curve rounds off gradually. Mostly low-order harmonics, smooth compression, “warm”.</li>
    <li><b>Hard clipping</b> (diodes to ground, transistors at their limits): a sharp corner and flat tops. Strong high-order harmonics, buzzy and aggressive.</li>
    <li><b>Symmetric</b> curves (the same above and below zero) produce <b>odd harmonics only</b> (3rd, 5th, 7th): square-ish, hollow, reedy.</li>
    <li><b>Asymmetric</b> curves add <b>even harmonics</b> (2nd, 4th). The 2nd is an octave up and the 4th two octaves up, so they thicken without clashing. Single-ended tube stages and germanium fuzz are asymmetric.</li>
  </ul>
  ${demo('lab')}
  <h2>Intermodulation: why power chords love distortion</h2>
  <p>Put two notes through a nonlinearity and you get more than their harmonics. You also get <b>sum and difference tones</b> (f₁+f₂, f₁−f₂, 2f₁−f₂…). For a perfect fifth (ratio 3:2), every product lands on the harmonic series of a note an octave below the root, so the chord just gets bigger. For a major third (≈5:4, and 14 cents off in equal temperament), the products crowd the low end, beat against each other, and blur. A full six-string chord makes dozens of clashing products: mush. That's why heavy styles live on root–fifth power chords and jazz voicings stay clean.</p>
  ${demo('im')}
  ${call('inter', 'Interaction: gain × bass × chord complexity', 'Low frequencies hold most of a guitar\'s energy. Clip them and the clipping is driven by the bass, so the whole sound starts to flub and fart, and the intermodulation turns the low end to mud. That’s why good high-gain designs <b>cut bass before the clipping</b> and add it back afterwards (the next two chapters). More gain also means less dynamic range, more noise and more sustain, all at once.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    lab: {
      title: 'Harmonic lab: a pure sine through a clipper', custom: true, scope: 'spec',
      intro: 'A pure sine has one spike. Raise the drive and watch new harmonics appear at exact multiples (the dashed markers are numbered).',
      plot: (cv, D) => { const st = D.lab; plotCurve(cv, (u) => LAB.shape(st.type, u * st.drive * 1.2) * LAB.norm(st), { label: `${st.type} · drive ${st.drive.toFixed(1)}×` }); },
      controls: [
        { type: 'seg', label: 'Curve', v: 'soft', opts: [['soft', 'Soft symmetric'], ['hard', 'Hard symmetric'], ['asym', 'Soft asymmetric'], ['none', 'Clean']], on: (v, D) => { D.lab.type = v; LAB.update(D); } },
        { type: 'range', label: 'Drive', min: 0.2, max: 30, step: 0.1, v: 1, fmt: (v) => v.toFixed(1) + '×', on: (v, D) => { D.lab.drive = v; LAB.update(D); } },
        { type: 'seg', label: 'Input', v: 'one', opts: [['one', 'One note'], ['fifth', '+ perfect 5th'], ['fourth', '+ perfect 4th'], ['third', '+ major 3rd'], ['tritone', '+ tritone']], on: (v, D) => { D.lab.iv = v; LAB.update(D); } },
      ],
      mount: (D) => { D.lab = { type: 'soft', drive: 1, iv: 'one' }; },
      start: (D) => LAB.start(D), stop: (D) => LAB.stopIt(D),
      marks: (g, W, h, dpr) => { const f0 = LAB.f0; g.font = `${9 * dpr}px system-ui`; for (let k = 1; k <= 14; k++) { const f = f0 * k; if (f > FMAX) break; const x = fx(f, W); g.strokeStyle = 'rgba(76,201,240,0.35)'; g.setLineDash([3 * dpr, 3 * dpr]); g.beginPath(); g.moveTo(x, 14 * dpr); g.lineTo(x, h); g.stroke(); g.setLineDash([]); g.fillStyle = k % 2 ? '#4cc9f0' : '#34d399'; g.fillText(k, x - 3 * dpr, 11 * dpr); } },
      listen: 'Soft symmetric at high drive shows only odd numbers (blue): hollow, square-ish. Asymmetric brings in the green even ones and sounds fatter. Then set drive around 10 and switch the input between <i>+ perfect 5th</i> and <i>+ major 3rd</i>. The fifth stays a clean, bigger chord; the third grows low growls and beating.',
    },
    im: {
      title: 'Same distortion, three chords', phrases: ['power', 'third', 'major'], scope: 'spec',
      cfg: { drive: { on: true, type: 'rat', gain: 0.6, tone: 0.45, level: 0.5 }, amp: { on: true, model: 'marshall', gain: 0.25, master: 0.4 }, cab: { type: '4x12' }, guitar: { type: 'hb', pickup: 'bridge' } },
      controls: [
        { k: 'drive.on', label: 'Distortion on', type: 'toggle', v: true },
        { k: 'drive.gain', label: 'Distortion gain', min: 0, max: 1, v: 0.6, fmt: knob10 },
      ],
      listen: 'Power chord, then the full major barre, at the same gain. The barre turns to a dense roar where you can\'t pick out the notes. Turn the gain down until the barre is clear again: that\'s your gain budget for full chords.',
    },
  },
  qs: {
    q1: { q: 'A perfectly symmetric clipper fed a pure sine produces which harmonics?', opts: ['Only even harmonics', 'Only odd harmonics', 'All harmonics equally', 'No harmonics, only compression'], a: 1, why: 'A curve with f(−x) = −f(x) keeps the waveform\'s half-wave symmetry, and such waveforms contain only odd harmonics. Asymmetry is what lets even harmonics in.' },
    q2: { q: 'Why does a root-and-fifth power chord stay clear under heavy distortion when a major triad turns to mush?', opts: ['Power chords are louder', 'Intermodulation products of a 3:2 ratio fall on one harmonic series; a third\'s products beat and crowd the low end', 'Distortion removes thirds', 'Major chords have no fundamental'], a: 1, why: 'Sum and difference tones from 3:2 are all multiples of half the root frequency, so they reinforce one implied bass note. With 5:4 (worse still in equal temperament), and more so in six-note chords, the products clash and beat.' },
  },
});

// sine-through-clipper engine for the harmonic lab
const LAB = {
  f0: 196,
  shape(t, v) { if (t === 'none') return v; if (t === 'hard') return CURVES.hard(v) / 0.9; if (t === 'asym') return CURVES.germ(v); return Math.tanh(v); },
  norm(st) { return st.type === 'none' ? 1 / Math.max(1, st.drive) : 1; },
  ratio: { one: 0, fifth: 7, fourth: 5, third: 4, tritone: 6 },
  start(D) {
    audio();
    const st = D.lab, sh = ctx.createWaveShaper(); sh.oversample = '4x';
    const pre = gn(1), dc = bq('highpass', 25, 0.7), out = gn(0);
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = gn(0);
    o1.frequency.value = LAB.f0; o1.connect(pre); o2.connect(g2).connect(pre);
    chainNodes(pre, sh, dc, out); out.connect(AU.testBus);
    o1.start(); o2.start();
    D.labNodes = { sh, pre, out, o2, g2, o1 };
    LAB.update(D);
    setP(out.gain, 0.32, 0.05);
  },
  update(D) {
    D.redraw && D.redraw();
    const N = D.labNodes; if (!N) return;
    const st = D.lab, semi = LAB.ratio[st.iv];
    N.o2.frequency.value = LAB.f0 * Math.pow(2, semi / 12);
    setP(N.g2.gain, st.iv === 'one' ? 0 : 1);
    const amp = st.iv === 'one' ? 1 : 0.55;
    N.sh.curve = mkCurve((v) => LAB.shape(st.type, v), 10);
    setP(N.pre.gain, st.drive * amp * 1.2 / 10);
    setP(N.out.gain, st.type === 'none' ? 0.32 / Math.max(1, st.drive * amp * 1.2) : 0.32);
  },
  stopIt(D) {
    const N = D.labNodes; if (!N) return; D.labNodes = null;
    setP(N.out.gain, 0, 0.05); setTimeout(() => { try { N.o1.stop(); N.o2.stop(); N.out.disconnect(); } catch (e) { /* */ } }, 120);
  },
};
</script>

<script>
/* ===================== Chapters 6–10 ===================== */
const CRUNCH = { amp: { on: true, model: 'marshall', gain: 0.3, master: 0.45 }, cab: { on: true, type: '4x12' } };

CH.push({
  id: 'drives', title: 'The drive family', short: 'Drive pedals', mins: 4,
  body: () => `
  <p class="lede">Overdrive, distortion and fuzz aren’t three separate things. Each one is a clipper with filters around it, and the filters matter as much as the clipping: <i>what</i> reaches the clipper, and what is done to the result.</p>
  <div class="tablewrap"><table>
  <tr><th>Circuit</th><th>Clipping</th><th>The filter trick</th><th>Sound</th></tr>
  <tr><td><b>Clean boost</b></td><td>Barely any</td><td>None. It just pushes the amp harder.</td><td>The amp’s own breakup, only more of it</td></tr>
  <tr><td><b>Tube Screamer</b></td><td>Soft, symmetric (diodes in the op-amp feedback)</td><td>Only frequencies above ≈720 Hz get gain. The lows pass clean.</td><td>Mid hump, smooth, tight low end</td></tr>
  <tr><td><b>Klon-style</b></td><td>Germanium, slightly asymmetric</td><td>A clean path is blended with the dirty one, and the blend shifts as gain rises</td><td>“Transparent”: your guitar plus hair</td></tr>
  <tr><td><b>Rat</b></td><td>Hard (silicon diodes to ground), huge gain</td><td>A sweepable low-pass “filter” knob</td><td>Raspy, aggressive, can go to fuzz</td></tr>
  <tr><td><b>Big Muff</b></td><td>Two cascaded clipping stages</td><td>The tone knob blends a low-pass and a high-pass, which scoops ≈1 kHz</td><td>Violin sustain, huge, scooped “wall”</td></tr>
  <tr><td><b>Fuzz Face</b></td><td>Asymmetric, transistor saturation, gated when starved</td><td>No tone knob. Very low input impedance, so it reacts to the guitar.</td><td>Woolly, then glassy clean as you roll back the guitar’s volume</td></tr></table></div>
  ${demo('pedal')}
  ${call('warn', 'Louder always sounds better', 'Your ear hears louder as fuller and brighter, because hearing is more sensitive to bass and treble at higher levels (equal-loudness contours). When you compare pedals or settings, match their levels first. The demos here roughly compensate, and the Level knob is there to fine-tune.')}
  <h2>The Tube Screamer trick</h2>
  <p>Metal players put a Tube Screamer in front of an already high-gain amp, with the pedal’s drive near zero and its level up. It adds little distortion. What it does is <b>filter</b>: it cuts lows before the amp’s clipping stages and pushes the mids, so palm mutes go from flubby to tight and percussive. Clipping is driven by the strongest frequencies, so take the bass away before the clipper and add it back after (the amp’s tone stack, the cab’s thump).</p>
  ${demo('tight')}
  <h2>Fuzz and the volume knob</h2>
  ${demo('fuzz')}
  ${call('inter', 'Interactions', '<b>Pickup output × pedal gain:</b> a humbucker can push a pedal into clipping at settings where a single coil stays clean. <b>Pedal tone × amp EQ:</b> the pedal shapes what gets distorted, the amp shapes what you hear. <b>Gain stacking:</b> two moderate drives in series sound smoother than one at full gain, because each stage clips a little and you get a gentler overall curve.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    pedal: {
      title: 'Pedalboard: one drive at a time', phrases: ['lick', 'chords', 'power', 'lead'], scope: 'both', cfg: Object.assign({ drive: { on: true } }, CRUNCH, { amp: { on: true, model: 'fender', gain: 0.3, master: 0.4 } }),
      plot: (cv, D) => { const t = D.state['drive.type'] || 'ts', T = DRIVES[t], d = T.gain(D.state['drive.gain'] ?? 0.5), bias = D.state['drive.bias'] || 0; plotCurve(cv, (u) => CURVES[T.curve](u * d * 0.4, bias) + (T.clean(D.state['drive.gain'] ?? 0.5) * u * 0.4), { label: `${T.name}: transfer curve for a typical pick` }); },
      controls: [
        { k: 'drive.type', label: 'Pedal', type: 'seg', v: 'ts', opts: [['boost', 'Boost'], ['ts', 'TS'], ['klon', 'Klon'], ['rat', 'Rat'], ['muff', 'Muff'], ['fuzz', 'Fuzz Face']] },
        { k: 'drive.on', label: 'Pedal on', type: 'toggle', v: true },
        { k: 'drive.gain', label: 'Gain / drive', v: 0.5, fmt: knob10 },
        { k: 'drive.tone', label: 'Tone / filter', v: 0.5, fmt: knob10 },
        { k: 'drive.level', label: 'Level', v: 0.5, fmt: knob10 },
        { k: 'drive.bias', label: 'Fuzz bias (starve)', v: 0, fmt: knob10, show: (s) => s['drive.type'] === 'fuzz' },
      ],
      listen: 'TS against Rat at the same gain: the TS is thinner in the low end (that 720 Hz high-pass) and smoother; the Rat is wider and buzzier. Then Muff on chords: huge, but listen to the mids sag. In a band it would vanish behind the bass and vocals.',
    },
    tight: {
      title: 'Tube Screamer as a tightener for a high-gain amp', phrases: ['chug', 'power'], scope: 'spec',
      cfg: { amp: { on: true, model: 'modern', gain: 0.62, master: 0.45, bass: 0.6, depth: 0.5 }, cab: { type: '4x12' }, guitar: { type: 'hb', pickup: 'bridge' }, drive: { on: false, type: 'ts', gain: 0.05, tone: 0.55, level: 0.75 } },
      controls: [
        { type: 'ab', label: 'Front end', opts: [{ name: 'Amp alone', set: { 'drive.on': false } }, { name: 'TS, drive 0, level high', set: { 'drive.on': true, 'drive.type': 'ts', 'drive.gain': 0.05, 'drive.level': 0.75 } }, { name: 'Clean boost instead', set: { 'drive.on': true, 'drive.type': 'boost', 'drive.gain': 0.6, 'drive.level': 0.5 } }] },
        { k: 'amp.gain', label: 'Amp gain', v: 0.62, fmt: knob10 },
      ],
      listen: 'on the chug, <i>Amp alone</i> sounds loose and boomy on the palm mutes. With the TS the mutes tighten and the low end stops smearing. The clean boost adds gain across the whole band, bass included, so it gets more saturated but not tighter.',
    },
    fuzz: {
      title: 'Fuzz Face: guitar volume as the gain knob', phrases: ['lick', 'chords', 'lead'], scope: 'wave',
      cfg: { drive: { on: true, type: 'fuzz', gain: 0.75, tone: 0.5, level: 0.5, bias: 0 }, amp: { on: true, model: 'fender', gain: 0.35, master: 0.5 }, cab: { type: '2x12' }, guitar: { pickup: 'neck' } },
      controls: [
        { k: 'guitar.vol', label: 'Guitar volume', min: 0.2, max: 1, v: 1, fmt: knob10 },
        { k: 'drive.bias', label: 'Bias: healthy → starved', v: 0, fmt: knob10 },
        { k: 'drive.gain', label: 'Fuzz', v: 0.75, fmt: knob10 },
      ],
      listen: 'roll the guitar volume to about 5: the fuzz turns into a glassy, slightly hairy clean, all without touching the pedal. Then push the bias up: notes sputter and gate as they decay, the “dying battery” sound. (A real Fuzz Face cleans up even more than this model, because its low input impedance loads the pickups.)',
    },
  },
  qs: {
    q1: { q: 'Why does a Tube Screamer with drive at 0 and level high tighten a high-gain amp?', opts: ['It adds lots of distortion', 'It cuts lows and boosts mids before the amp’s clipping stages, so less bass drives the clipping', 'It compresses the output', 'It lowers the amp’s volume'], a: 1, why: 'Clipping is dominated by the strongest frequencies, and on a guitar that’s the bass. Removing bass before the clipper keeps palm mutes tight. The amp and cab put the low end back afterwards, cleanly.' },
    q2: { q: 'What makes a Klon-style pedal sound “transparent”?', opts: ['It has no clipping', 'A clean path is blended with the clipped path, so your dry tone stays in the mix', 'It uses tubes', 'It has a high-pass at 720 Hz'], a: 1, why: 'The summed clean signal keeps the attack, low end and pickup character, while the clipped path adds harmonics and compression.' },
  },
});

CH.push({
  id: 'amp', title: 'The amplifier', short: 'The amp', mins: 4,
  body: () => `
  <p class="lede">A guitar amp is two distortion boxes with a filter between them. The <b>preamp</b> (gain stages) feeds a passive <b>tone stack</b>, which feeds the <b>power amp</b> (master volume, power tubes, output transformer), which drives the speaker.</p>
  <h2>Preamp gain vs power-amp distortion</h2>
  <p><b>Preamp distortion</b> comes from small triode stages, often several in a row. It’s tight, fizzy and very saturated, and it’s the modern high-gain sound. <b>Power-amp distortion</b> comes from turning up the master until the output tubes clip. It’s looser and bigger, with more compression and “bloom”. The supply voltage also droops under load (<b>sag</b>), so chords swell after the attack. Old amps with no master volume only got there at stage volume, which is why “cranked” has its own sound.</p>
  <p>Most amps are <b>push-pull</b>: a pair of tubes each handle half the wave, which cancels even harmonics, so the result is mostly odd-order and punchy. A cathode-biased <b>class-A-style</b> amp like an AC30 compresses differently and keeps more even harmonics: the “chime”.</p>
  <h2>The tone stack is not a graphic EQ</h2>
  <p>The Fender/Marshall stack is a passive network of three capacitors and four resistors, the bass, mid and treble pots among them. It can only <b>cut</b>, and the knobs <b>interact</b>: the treble pot sets how much signal reaches the bass and mid controls, and the mid pot shifts the whole curve up and down. With everything at 5, a Fender has a deep scoop around 400–800 Hz. The curve below is computed from the real circuit equations and updates as you turn the knobs.</p>
  ${demo('amp')}
  ${call('phys', 'Presence and depth', 'Both work in the power amp’s negative-feedback loop. <b>Presence</b> reduces feedback at high frequencies, so it lifts about 3–5 kHz <i>after</i> the distortion: edge and cut without more fizz from the preamp. <b>Depth/resonance</b> does the same around 100 Hz: the thump of a closed 4×12.')}
  ${demo('prepost')}
  ${call('inter', 'Interactions', '<b>Where EQ sits relative to distortion</b> is the big one. EQ before clipping changes <i>what</i> distorts: more mids into the clipper gives a more mid-saturated, vocal tone. EQ after clipping changes the <i>colour</i> of the distortion. The tone stack sits between preamp and power amp, so with the master up its settings also change how the power tubes clip. <b>Gain × treble:</b> high gain amplifies the top end’s fizz, so you usually lower treble and presence as gain goes up. <b>Sag × attack:</b> more sag means a softer attack and more swell.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    amp: {
      title: 'Amp head', phrases: ['chords', 'lick', 'chug', 'lead'], scope: 'spec', cfg: { amp: { on: true }, cab: { type: '2x12' }, guitar: { pickup: 'bridge' } },
      plot: (cv, D) => { const p = Object.assign({}, DEF.amp); for (const [k, v] of Object.entries(D.state)) if (k.startsWith('amp.')) p[k.slice(4)] = v; const s = rig ? rig.blocks.amp.stackResp(p) : toneStackS('fender', p.bass, p.mid, p.treble); plotResp(cv, (f) => sMagDb(s, f), { range: 36, top: 6, lo: 30, hi: 16000 }); const c = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1); c.fillStyle = '#ffb547'; c.font = `${10 * dpr}px system-ui`; c.fillText(`tone stack (${AMPS[p.model].stack === 'fender' ? 'Fender' : 'Marshall'} values)${AMPS[p.model].mid != null ? ', no mid knob on this amp' : ''}`, 60 * dpr, 13 * dpr); },
      controls: [
        { k: 'amp.model', label: 'Amp', type: 'seg', v: 'fender', opts: [['fender', 'US clean'], ['vox', 'UK chime'], ['marshall', 'UK crunch'], ['modern', 'Modern high gain']] },
        { k: 'amp.gain', label: 'Gain (preamp)', v: 0.3, fmt: knob10 },
        { k: 'amp.master', label: 'Master (power amp)', v: 0.35, fmt: knob10 },
        { k: 'amp.bass', label: 'Bass', v: 0.5, fmt: knob10 },
        { k: 'amp.mid', label: 'Middle', v: 0.5, fmt: knob10, show: (s) => (s['amp.model'] || 'fender') !== 'vox' },
        { k: 'amp.treble', label: 'Treble', v: 0.6, fmt: knob10 },
        { k: 'amp.presence', label: 'Presence', v: 0.5, fmt: knob10 },
        { k: 'amp.depth', label: 'Depth / resonance', v: 0.25, fmt: knob10 },
        { k: 'amp.sag', label: 'Sag', v: 0.3, fmt: knob10 },
        { k: 'amp.level', label: 'Output level', v: 0.6, fmt: knob10 },
      ],
      listen: 'on <i>US clean</i>, set treble to 0 and move the middle knob: the whole curve moves, not one band. Then treble to 10 and do it again; the mid knob behaves differently. On <i>Modern high gain</i>, turn presence to 10 and then treble to 10: presence adds cut, treble adds fizz.',
    },
    prepost: {
      title: 'Same loudness, different distortion', phrases: ['chords', 'power', 'lick'], scope: 'wave', cfg: { amp: { on: true, model: 'marshall', sag: 0.7 }, cab: { type: '4x12' }, guitar: { type: 'hb' } },
      controls: [
        { type: 'ab', label: 'Where the distortion happens', opts: [{ name: 'Preamp: gain 8, master 2', set: { 'amp.gain': 0.8, 'amp.master': 0.2 } }, { name: 'Power amp: gain 2, master 9', set: { 'amp.gain': 0.2, 'amp.master': 0.92 } }] },
        { k: 'amp.sag', label: 'Sag', v: 0.7, fmt: knob10 },
      ],
      listen: 'the preamp version is tighter and fizzier, with a hard, even wall. The power-amp version is looser and more open: chords keep their separation, the attack is softer and the notes bloom, more so with sag up.',
    },
  },
  qs: {
    q1: { q: 'A Fender amp with bass, mid and treble all on 5. What does the tone stack do?', opts: ['Nothing; 5 is flat', 'Scoops the mids around 400–800 Hz', 'Boosts the mids', 'Cuts only the treble'], a: 1, why: 'A passive FMV stack only cuts, and at noon its natural shape is a deep mid scoop. “Flat” on the dial is not flat in frequency.' },
    q2: { q: 'Compared with preamp distortion, power-amp distortion tends to be…', opts: ['Tighter and fizzier', 'Looser and bigger, with more compression and bloom from sag', 'Identical', 'Cleaner'], a: 1, why: 'Power tubes clipping into a transformer, plus supply sag, give a softer, more dynamic compression. Cascaded preamp stages give dense, tight saturation.' },
  },
});

CH.push({
  id: 'cab', title: 'Speaker, cabinet and microphone', short: 'Cab & mic', mins: 3,
  body: () => `
  <p class="lede">The speaker is the biggest filter in the chain. A 12-inch paper cone is too heavy to follow anything much above about 5–6 kHz, it resonates around 80–120 Hz, and between those it breaks up into peaks and dips. Those peaks and dips are each speaker’s fingerprint.</p>
  <ul>
    <li><b>Low-pass:</b> it removes the harsh harmonics the distortion created. Plug a distortion straight into a PA or interface with no cab simulation and you hear raw <i>fizz</i>.</li>
    <li><b>Resonance:</b> a closed-back 4×12 traps air behind the cones, giving the low thump of palm mutes. An open back leaks the rear wave: less bass, more air and room.</li>
    <li><b>Cone breakup</b> (≈1.5–4 kHz): the peaks that make one speaker sound “woody”, another “aggressive”.</li>
  </ul>
  <h2>The microphone is another filter</h2>
  <p>Aimed at the dust cap, a mic hears the bright centre of the cone. Moved toward the edge, it hears the darker outer cone. Off-axis is smoother still. Close up, the mic’s <b>proximity effect</b> boosts bass. Pull it back and you get less bass and more room.</p>
  ${demo('cab')}
  ${call('phys', 'Impulse responses (IRs)', 'Speaker, cabinet, mic and room together are close to a <b>linear</b> system, so they can be captured exactly as an <i>impulse response</i>: record a click (or a sweep) through the cab and convolve your signal with the result. That’s what IR loaders do. An IR can’t capture anything nonlinear, like speaker compression at high volume, power-amp distortion or sag. Capturing those needs the neural modelling in the last chapter.')}
  ${qz('q1')}${qz('q2')}`,
  demos: {
    cab: {
      title: 'Cab and mic', phrases: ['lick', 'chug', 'chords'], scope: 'spec', cfg: Object.assign({}, CRUNCH, { amp: { on: true, model: 'marshall', gain: 0.6, master: 0.45 } }),
      plot: (cv, D) => { if (!rig) { plotResp(cv, () => 0, { range: 48, top: 12 }); return; } const t = D.state['cab.type'] || '4x12'; plotResp(cv, t === 'none' ? () => 0 : nodesDb(rig.blocks.cab.nodes), { range: 48, top: 12, lo: 30, hi: 20000 }); },
      controls: [
        { k: 'cab.type', label: 'Cabinet', type: 'seg', v: '4x12', opts: [['none', 'None (direct)'], ['1x8', '1×8 practice'], ['1x12', '1×12 open'], ['2x12', '2×12 open'], ['4x12', '4×12 closed']], on: (v, D) => setTimeout(D.redraw, 120) },
        { k: 'cab.mic', label: 'Mic: centre cap → cone edge', v: 0.3, on: (v, D) => setTimeout(D.redraw, 120) },
        { k: 'cab.dist', label: 'Mic distance: close → room', v: 0.15, on: (v, D) => setTimeout(D.redraw, 120) },
      ],
      listen: 'switch to <i>None (direct)</i>: angry-bee fizz above 5 kHz. That’s what the speaker normally removes. Then 1×8 against 4×12 on the chug: the small speaker is boxy and nasal with no thump. Slide the mic from centre to edge and the top end rounds off.',
    },
  },

CH.push({
  id: 'time', title: 'Time: delay and reverb', short: 'Delay & reverb', mins: 4,
  body: () => `
  <p class="lede">Delay and reverb are the same physics at different densities: copies of your signal arriving later. A few distinct copies read as <b>echo</b>. Thousands of overlapping copies read as a <b>room</b>.</p>
  <h2>Delay: four numbers</h2>
  <ul>
    <li><b>Time.</b> Under ~35 ms the copy fuses with the note (doubling, comb filtering). 60–130 ms is <b>slapback</b>, the rockabilly and country sound. 300–600 ms reads as a distinct echo, and tempo-synced times make it part of the rhythm.</li>
    <li><b>Feedback</b> (regeneration): how much of each echo is fed back in, so how many repeats you get. Near 100% it builds on itself into self-oscillation.</li>
    <li><b>Mix</b>: how loud the repeats sit under the dry note. Ambient players often use 30–50%; most rhythm parts sit at 10–20%.</li>
    <li><b>Character</b>: what happens to each repeat. <b>Digital</b> repeats are exact copies. <b>Analog</b> (bucket-brigade) repeats lose highs and lows each pass and get darker and murkier. <b>Tape</b> repeats wobble slightly in pitch (wow and flutter) and saturate as they build.</li>
  </ul>
  ${call('phys', 'Why the dotted eighth works', 'At tempo T, a dotted-eighth delay lands ¾ of a beat after each note. Play straight eighths and the echoes fall exactly between your notes, so one picked note becomes a cascading sixteenth-note pattern. That is the whole trick behind the U2/Edge sound, and it only works when the delay time is locked to the tempo.')}
  ${demo('delay')}
  <h2>Reverb: the room</h2>
  <p>A real room returns a few distinct <b>early reflections</b> from nearby walls in the first 5–80 ms, then a dense, decaying <b>tail</b>. Your ears read the size of the room from the early-reflection timing and the length of the tail. They read the wall materials from how fast the highs die away.</p>
  <ul>
    <li><b>Decay (RT60)</b>: the time for the tail to fall 60 dB. A small room is about 0.3–0.8 s, a hall 1.8–3 s, a cathedral 5 s or more.</li>
    <li><b>Pre-delay</b>: the gap before the reverb starts. 20–40 ms keeps your pick attack clean and dry in front of the wash. It's the single most useful reverb setting.</li>
    <li><b>Tone/damping</b>: a darker tail sits behind the guitar, a brighter one competes with it.</li>
    <li><b>Type.</b> <b>Spring</b>: the boingy, drippy tank in a Fender amp; surf guitar. <b>Plate</b>: a dense, bright, smooth metal sheet; classic on vocals and leads. <b>Hall</b>: slow build, big and dark. <b>Room</b>: short and natural, makes a close-miked amp sound like it's in a real space.</li>

  ${demo('verb')}
  ${call('inter', 'Interactions', '<b>Gain × space.</b> Distortion compresses, so every echo and tail comes out as loud as the note and turns to mush. High-gain players use less mix, shorter decays, and often duck the delay so it only blooms between phrases. <b>Low end × reverb.</b> Reverb on bass frequencies muddies everything, which is why studio reverbs are high-passed at 150–300 Hz (this one is). <b>Tempo × delay.</b> A delay that ignores the song’s tempo fights the drummer. <b>Order</b>: put delay and reverb before a distorted amp and the amp distorts the echoes too; more on that in the Order chapter.')}

    q2: { q: 'A big reverb makes your fast lead lines blurry. Which single setting helps most without making it smaller?', opts: ['Pre-delay of 30–60 ms', 'More mix', 'Brighter tone', 'More gain'], a: 0, why: 'Pre-delay holds the reverb back so each note’s attack is heard dry and clear before the tail arrives. The space stays big; the articulation comes back.' },

CH.push({

  <p class="lede">A wah is one <b>resonant bandpass filter</b>: a narrow peak that boosts a band and cuts the rest. Rocking the pedal sweeps the peak from about 400 Hz (heel down, dark: “uuu”) to about 2 kHz (toe down, bright: “eee”). Our mouths do the same thing when we move from one vowel to another, which is why a wah sounds like it’s talking.</p>

  ${demo('wah')}
  ${call('inter', 'Interactions', '<b>Wah × fuzz.</b> Wah before a fuzz: the fuzz squashes the level changes but keeps the moving resonance, giving a vocal, singing sweep (the Hendrix order). Wah after a fuzz sounds more extreme, synthy and thin. Try both in the Order chapter. <b>Envelope filter × compressor.</b> A compressor before an envelope filter evens out your picking, so the filter opens the same amount every note, which defeats the point.')}

CH.push({
  id: 'order', title: 'Order and interaction', short: 'Order', mins: 4,
  body: () => `
  <p class="lede">Linear stages (EQ, cab, filters) can be swapped with no audible difference. Nonlinear stages (drive, compressor, fuzz) can’t: <b>whatever sits before a nonlinear stage gets processed by it</b>. That one idea answers almost every “which order?” question.</p>
  <div class="grid2">
    <div class="card"><b>Delay → drive</b><br>Echoes are distorted too and pile up into a wash. Each repeat is as loud as the note. Chaotic, sometimes great.</div>
    <div class="card"><b>Drive → delay</b><br>The distorted note is echoed cleanly. Repeats decay naturally under the playing. The usual choice.</div>
    <div class="card"><b>Comp → drive</b><br>Even level going into the clipping: more sustain, consistent breakup. Standard.</div>
    <div class="card"><b>Drive → comp</b><br>The distortion is already squashed, so the compressor mostly raises noise and hiss.</div>
    <div class="card"><b>Wah → fuzz</b><br>Vocal sweep, thick. The classic order.</div>
    <div class="card"><b>Fuzz → wah</b><br>Extreme, synthy, thinner sweep.</div>
  </div>
  ${demo('ord')}
  <h2>Gain staging: where the distortion comes from</h2>
  <p>A drive pedal into an amp is two clipping stages in series. You choose which one does the work:</p>
  <ul>
    <li><b>Boost into a clean amp</b>: the pedal provides most of the dirt, and the amp just amplifies it.</li>
    <li><b>Boost into an amp at the edge of breakup</b>: the pedal mostly adds level, so the amp’s own preamp distorts. Usually the most “amp-like” and dynamic result.</li>
    <li><b>Tube Screamer with low gain, high level into a high-gain amp</b>: the pedal cuts lows before the amp’s distortion, so palm mutes tighten instead of flubbing. That’s the standard metal trick.</li>
  </ul>
  ${demo('stack')}
  ${call('inter', 'The general rule', 'Think of every nonlinear stage as asking: <i>how loud is the input, and what frequencies does it contain?</i> Anything that changes level or spectrum before it (volume knob, EQ, boost, wah, compression) changes how it distorts. Anything after it just reshapes the result. That is why a guitar’s volume knob cleans up an amp but an EQ after the amp doesn’t.')}
  ${call('big', 'Solo vs in the mix', 'A tone that sounds huge alone is usually wrong in a band: too much low end, too much gain, scooped mids. Players who record well use <b>less gain than they think</b> (notes stay defined), <b>a high-pass around 80–120 Hz</b> (leave room for bass and kick) and <b>more 1–3 kHz</b> (cut through). Judge tone at band volume, with the band, whenever you can.')}
  ${qz('q1')}${qz('q2')}`,

    },

      controls: [

  id: 'future', title: 'The future: AI and guitar', short: 'AI & guitar', mins: 3,
  body: () => `
  <p class="lede">The deepest change in guitar tone this decade is machine learning applied to <b>capturing gear</b>: instead of engineers modelling every circuit by hand, a neural network listens to a real amp and learns to imitate it. Here is the state of play as of November 2026. Tags: <span class="tag fact">FACT</span> reported, <span class="tag spec">SPECULATION</span> informed guess.</p>
  <h2>1 · Captures ate amp modelling</h2>
  <p><span class="tag fact">FACT</span> A <b>capture</b> (also called a profile or a model) is made by playing test signals through a real amp or pedal, recording the output, and training a network to reproduce the input→output relationship, including the distortion. Everything you heard in this course is hand-built physics. Captures skip that and learn the device directly from a recording.</p>
  <p><span class="tag fact">FACT</span> <b>Neural Amp Modeler (NAM)</b>, Steven Atkinson’s open-source project, became the de facto open standard. Its code is free and MIT-licensed. <b>TONE3000</b> hosts the community library: in September 2026 it released a free, open-source NAM plugin and standalone app with access to over 700,000 amp and pedal captures (<a href="https://sonicstate.com/news/2026/09/02/get-access-to-the-worlds-largest-library-of-guitar-tone" target="_blank" rel="noopener">Sonicstate, 2 Sep 2026</a>). The second-generation <b>A2</b> architecture launched in 2026; A2 files need updated plugins and firmware (<a href="https://www.tone3000.com/blog/a2-next-generation-neural-amp-modeler" target="_blank" rel="noopener">TONE3000</a>, <a href="https://www.gearnews.com/neural-amp-modeler-guide-guitar/" target="_blank" rel="noopener">gearnews</a>).</p>
  <p><span class="tag fact">FACT</span> Hardware makers now load NAM files natively: HeadRush across its multi-effects line, Blackstar’s Beam Mini, and others (<a href="https://www.tone3000.com/blog/headrush-nam-tone3000" target="_blank" rel="noopener">TONE3000/HeadRush</a>). The big commercial platforms each have their own capture system: Neural DSP’s cloud-trained <b>Neural Capture V2</b> covers amps, cabs, drives, fuzzes and compressors, and its <b>Quad Cortex mini</b> launched at NAMM in January 2026 (<a href="https://www.soundonsound.com/news/namm-2026-neural-dsp-introduce-quad-cortex-mini" target="_blank" rel="noopener">Sound On Sound</a>). Line 6 added cloud-based <b>Proxy</b> cloning to Helix Stadium in firmware 1.3 in March 2026 as “phase one” (<a href="https://musicplayers.com/?p=67139" target="_blank" rel="noopener">MusicPlayers</a>). IK Multimedia continues with <b>TONEX</b>, including the tiny TONEX Plug (<a href="https://www.recordingmag.com/resources/featured-reviews/april-2026-ik-multimedia-tonex-plug/" target="_blank" rel="noopener">Recording, Apr 2026</a>).</p>
  ${call('phys', 'What a capture can and can’t do', 'A capture is a snapshot of one amp at one set of knob positions. Turn the knobs on the real amp and you need a new capture. Most captures don’t respond to your guitar’s volume knob or to power-amp sag at different volumes exactly like the real thing. Newer approaches (parametric models, “full-rig” captures) are attacking exactly this. Notice that this course’s chapters map onto it: the capture learns the <b>nonlinear</b> stages; the cab is often a separate impulse response (a linear filter).')}
  <h2>2 · “Make it sound like this record”</h2>
  <p><span class="tag fact">FACT</span> Tone matching from a reference recording is now a product category. <b>Positive Grid BIAS X</b> (launched late 2025, about $149) lets you attach a song and builds an amp and pedal chain that approximates its guitar sound (<a href="https://www.guitarworld.com/gear/plugins-apps/positive-grid-bias-x-launch" target="_blank" rel="noopener">Guitar World</a>). MusicRadar’s hands-on test got close to a Kinks track but missed a slapback delay until asked (<a href="https://www.musicradar.com/guitars/guitar-plugins/project_bias_x" target="_blank" rel="noopener">MusicRadar</a>). Web services such as TonesMatch suggest settings for your own gear from a song title; treat their claims as vendor marketing.</p>
  <p><span class="tag spec">SPECULATION</span> Expect this to merge with captures: describe or play a reference, get a capture-based rig that’s editable with normal knobs. The vocabulary you learned in chapter 14 is exactly the interface these tools use: they turn “warmer, less fizzy, more slapback” into parameter changes.</p>
  <h2>3 · Learning and practice tools</h2>
  <p><span class="tag fact">FACT</span> Stem separation now isolates electric and acoustic guitar as separate stems (<a href="https://www.lalal.ai/blog/lalalai-perseus-supports-piano-guitars/" target="_blank" rel="noopener">LALAL.AI</a>), and it increasingly runs on-device. Automatic tab transcription is common in practice apps, but it still usually runs in the cloud, and accuracy claims are mostly unverified vendor statements (<a href="https://www.aimusicpreneur.com/ai-tools-news/lalal-ai-neko-offline-real-time-stem-separation/" target="_blank" rel="noopener">AI Musicpreneur</a>).</p>
  <h2>4 · Generative music and the guitarist</h2>
  <p><span class="tag fact">FACT</span> Song generators like Suno produce convincing guitar parts. In 2026 string maker D’Addario published a demo that musicians suspected was AI-generated. It first denied it, then admitted Suno was used and apologised, promising disclosure rules (<a href="https://jackrighteous.com/blogs/ai-music-distribution-guide/daddario-suno-ai-music-controversy-creator-lessons" target="_blank" rel="noopener">summary</a>). Session players in Nashville report clients sending AI-generated guitar parts as references (<a href="https://www.nashvillescene.com/music/features/ai-music-nashville/article_2ce229d0-d7e0-4dc3-8fc9-f35eb4a0f88c.html" target="_blank" rel="noopener">Nashville Scene</a>).</p>
  <p><span class="tag spec">SPECULATION</span> The likely split: gear and tone become nearly free and infinitely available (every famous amp, in your pocket, matched to any record), while what stays scarce is the <b>player</b>: touch, timing, phrasing and taste. Everything in this course that depends on your hands (picking position, dynamics into a touch-sensitive amp, volume-knob cleanup, the wah foot) is the part no capture replaces. Knowing <i>why</i> a tone works is what lets you direct these tools instead of scrolling presets.</p>
  ${qz('q1')}`,
  demos: {},
  qs: {
    q1: { q: 'What does a neural “capture” of an amp actually learn?', opts: ['The amp’s schematic', 'The input→output behaviour of one amp at one set of knob positions, learned from test signals', 'Every possible knob setting automatically', 'Just its EQ curve'], a: 1, why: 'Training compares what went in with what came out and fits a network to that mapping, including the nonlinear distortion. It’s a snapshot. Change the real amp’s knobs and you need another capture, unless the model is parametric.' },
  },
});

/* ---------- final quiz ---------- */
const EQ_FLAT = { b: [0, 0, 0, 0, 0, 0, 0] };
const FINAL = [
  { kind: '👂 Ear test', q: 'Which pickup is this: neck or bridge?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ guitar: { pickup: 'neck', type: 'sc' } }, CLEAN)), phrase: 'lick' }], opts: ['Neck', 'Bridge'], a: 0, why: 'The neck pickup sits near the string’s antinode for the lower harmonics, so it’s rounder and fuller. The bridge pickup is thinner and brighter, with a nasal bite.' },
  { kind: '👂 Ear test', q: 'Something is missing from this distorted tone. What?', ears: [{ label: '▶ Clip', cfg: rigCfg({ amp: { on: true, model: 'marshall', gain: 0.65 }, cab: { on: false } }), phrase: 'chug' }], opts: ['The speaker cabinet', 'The amp', 'Reverb', 'The pickup'], a: 0, why: 'That fizzy, buzzing top end above 5 kHz is a distorted amp heard without a speaker. The cab is a steep low-pass filter that removes it.' },
  { kind: '👂 Ear test', q: 'Which modulation effect is this?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ guitar: { pickup: 'nm' }, mod: { on: true, type: 'flanger', rate: 0.25, depth: 0.8, mix: 0.5, fb: 0.7 } }, CLEAN)), phrase: 'chords' }], opts: ['Chorus', 'Flanger', 'Tremolo', 'Vibrato'], a: 1, why: 'A sweeping, metallic “jet” resonance is a short delay with feedback, so a moving comb filter: a flanger.' },
  { kind: '👂 Ear test', q: 'And this one?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ guitar: { pickup: 'nm' }, mod: { on: true, type: 'tremolo', rate: 0.45, depth: 0.85, shape: 'sine' } }, CLEAN)), phrase: 'chords' }], opts: ['Phaser', 'Chorus', 'Tremolo', 'Uni-Vibe'], a: 2, why: 'Only the volume pulses; the pitch and tone colour don’t move. That’s tremolo.' },
  { kind: '👂 Ear test', q: 'Which pedal is this: Tube Screamer-style or Big Muff-style?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ drive: { on: true, type: 'muff', gain: 0.7, tone: 0.5, level: 0.5 } }, CLEAN)), phrase: 'chords' }], opts: ['Tube Screamer-style', 'Big Muff-style'], a: 1, why: 'A thick, sustaining, fuzzy wall with a scooped midrange is a Big Muff. A Tube Screamer is milder, mid-humped and less bassy.' },
  { kind: '👂 Ear test', q: 'Is the delay before or after the distortion?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ order: ORD.delayFirst, drive: { on: true, type: 'rat', gain: 0.65 }, delay: { on: true, mode: 'digital', time: 360, fb: 0.45, mix: 0.45 } }, CLEAN)), phrase: 'lick' }], opts: ['Delay before the distortion', 'Delay after the distortion'], a: 0, why: 'The echoes are as loud and distorted as the notes and smear together: they were distorted along with the playing. Delay after the drive gives clean repeats that fade under the notes.' },
  { kind: '👂 Ear test', q: 'Which reverb?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ reverb: { on: true, type: 'spring', decay: 2.5, mix: 0.55 } }, CLEAN)), phrase: 'lick' }], opts: ['Spring', 'Hall', 'Small room'], a: 0, why: 'The boingy, metallic “drip” on every attack is the dispersion of a spring tank. Halls are smooth and slow, rooms short and natural.' },
  { kind: '👂 Ear test', q: 'Which delay character?', ears: [{ label: '▶ Clip', cfg: rigCfg(Object.assign({ delay: { on: true, mode: 'tape', time: 420, fb: 0.6, mix: 0.45 } }, CLEAN)), phrase: 'lick' }], opts: ['Digital', 'Tape'], a: 1, why: 'The repeats wobble in pitch (wow and flutter) and get softer at the edges each time round. Digital repeats are exact copies.' },
  { kind: 'Concept', q: 'Picking right over the 12th fret makes a hollow sound because…', opts: ['the string is looser there', 'plucking at the midpoint cancels every even harmonic', 'the pickup can’t hear it', 'it adds compression'], a: 1, why: 'A pluck at 1/n of the length suppresses the n-th harmonic and its multiples. At ½, every even harmonic vanishes.' },
  { kind: 'Concept', q: 'Why do power chords sound great with heavy distortion while full major chords turn to mush?', opts: ['Power chords are louder', 'Distortion creates intermodulation (sum and difference) tones. With a perfect fifth they line up with the harmonic series; with a third and other intervals they are dissonant', 'Major chords have no harmonics', 'It’s purely cultural'], a: 1, why: 'Two notes through a nonlinearity create f1±f2 and higher-order products. For a 3:2 fifth these land on the same harmonic series; for more complex ratios they clash.' },
  { kind: 'Concept', q: 'Turning down the guitar’s volume knob cleans up a cranked amp, but a cut on an EQ pedal after the amp doesn’t. Why?', opts: ['EQ pedals are weaker', 'The volume knob is before the nonlinear stage, so it changes how hard the amp clips; the EQ after only reshapes the result', 'The volume knob adds compression', 'They are the same'], a: 1, why: 'Level going into a nonlinear stage sets how much it distorts. After the distortion, you can only filter what has already been created.' },
  { kind: 'Concept', q: 'What does a compressor before an overdrive do?', opts: ['Removes all distortion', 'Evens out the level going in: more sustain, and consistent breakup whatever your pick strength', 'Adds echo', 'Nothing audible'], a: 1, why: 'The drive sees a steadier input, so quiet and loud notes distort more evenly and notes sustain longer. You trade away some dynamic touch.' },
  { kind: 'Concept', q: 'Which part of the chain is the biggest single tone-shaping filter?', opts: ['The tone knob', 'The speaker cabinet and microphone', 'The cable', 'The reverb'], a: 1, why: 'Guitar speakers roll off steeply above about 5 kHz and have strong resonances and breakup peaks. The speaker and mic choice changes the sound more than any EQ.' },
  { kind: 'Concept', q: 'A modern high-gain rhythm tone flubs on palm mutes. The classic fix?', opts: ['More amp bass', 'A Tube Screamer-style pedal with low gain and high level in front, and a high-pass around 80–100 Hz', 'More reverb', 'A chorus'], a: 1, why: 'Cutting lows before the amp’s distortion keeps the low end from modulating everything. Mutes become tight and percussive.' },
  { kind: 'Concept', q: 'What sets a phaser apart from a flanger?', opts: ['Phasers use all-pass stages, which give a few unevenly spaced notches; flangers use a short delay, which gives many evenly spaced comb notches', 'Phasers are louder', 'Flangers only work on bass', 'Nothing'], a: 0, why: 'Few uneven notches give a smoother, vocal swirl. Many harmonically spaced notches give a metallic, pitched jet sound.' },
  { kind: 'Concept', q: 'Your tone sounds massive alone and disappears in the band. Most likely?', opts: ['Too little gain', 'Too much low end and gain, scooped mids', 'Not enough reverb', 'The pickup height'], a: 1, why: 'The bass and kick own the lows and the vocal owns the mids. A guitar that cuts through has a high-pass, more 1–3 kHz and enough clarity to hear notes.' },
];
CH.push({
  id: 'quiz', title: 'Final quiz', short: 'Quiz', mins: 5,

  <p class="lede">${FINAL.length} questions: ${FINAL.filter((q) => q.kind.includes('Ear')).length} ear tests (use headphones) and the rest concepts. Each one explains itself when you answer.</p>

$('#prev').onclick = () => go(S.ch - 1);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === 'ArrowRight' && !e.target.matches('input[type=range]')) $('#next').click();
  if (e.key === 'ArrowLeft' && !e.target.matches('input[type=range]')) $('#prev').click();
  if (e.key === 'Escape') $('#menu').classList.add('hidden');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
S.ch = clamp(S.ch || 0, 0, CH.length - 1);
render();
