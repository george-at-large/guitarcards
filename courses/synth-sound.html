  ivUpd();
  root.append(note('listen', `<p>Play the <b>Major 3rd</b> and flip between Just and Equal-tempered. The ET third is 14 cents sharp of 5:4, so the 5th harmonic of the root and the 4th of the third sit ~3 Hz apart here: a slow shimmer. The ET fifth is only 2 cents off and stays nearly still. Then try the Minor 2nd: dense, fast beating = dissonance.</p>`));
  root.append(note('gen', `<p>On guitar, natural harmonics <i>are</i> this series: touch the string at the 12th fret (½ length) for harmonic 2, 7th fret (⅓) for 3, 5th fret (¼) for 4, near the 4th fret (⅕) for 5 — that slightly flat major third. Picking near the bridge excites more upper harmonics (brighter); near the neck fewer (warmer). Pickup position works the same way.</p>`));
  root.append(ask('You remove the fundamental but keep harmonics 2–8. What happens to the perceived pitch?', ['It jumps up an octave', 'It mostly stays the same; the timbre gets thinner', 'It becomes noise', 'It drops an octave'], 1, 'The brain infers the fundamental from the spacing of the harmonics (all 110 Hz apart). That is the "missing fundamental", which lets small speakers imply bass.'));
  root.append(ask('Why does a perfect fifth sound smoother than a minor second?', ['It is louder', 'Its 3:2 ratio makes many harmonics coincide, so few beat against each other', 'Fifths have no harmonics', 'Because of equal temperament'], 1, 'Coinciding partials = little beating = smooth. The minor second (16:15) produces many close, rapidly beating pairs.'));
} });

chapter({ id: 'waves', title: 'Waveforms', min: 2, patch: { wave: 'sawtooth', aA: 0.01, aR: 0.25 }, build(root) {
  root.append(H(`<div class="kicker">Chapter 3 · Source</div><h1>The classic waveforms are harmonic recipes</h1>
  <p class="lede">Analog synths offered a few shapes because they were easy to make with circuits. Each is just a particular harmonic recipe — and knowing the recipe tells you what a filter will have to work with.</p>`));
  const r = rig({ notes: [45], pat: BASS, bpm: 116, droneLabel: 'Drone (A2)', loopLabel: 'Bass loop' });
  const pw = pk('Pulse width', 'pw', 0.05, 0.5, { fmt: pct });
  const pwm = toggle('PWM (LFO → width)', false, (v) => { setFX({ ...FX, lfoRate: 0.4, lfoShape: 'triangle' }); P('lfoDest', v ? 'pw' : 'none'); P('lfoDepth', v ? 0.9 : 0); r.restart(); });
  root.append(demo('Oscillator',
    r.el,
    seg([['sine', 'Sine'], ['triangle', 'Triangle'], ['sawtooth', 'Saw'], ['square', 'Square'], ['pulse', 'Pulse']], 'sawtooth', (w) => { P('wave', w); r.restart(); setViz('spec'); }),
    row(pw), btns(pwm, hit('Show the wave', () => setViz('scope')), hit('Show the spectrum', () => setViz('spec')))));
  root.append(H(`<div class="tw"><table>
  <tr><th>Wave</th><th>Harmonics</th><th>Sounds like</th></tr>
  <tr><td><b>Sine</b></td><td>fundamental only</td><td>pure, flute-ish, sub-bass; nothing for a filter to remove</td></tr>
  <tr><td><b>Triangle</b></td><td>odd only, falling fast (1/n²)</td><td>soft, mellow, ocarina</td></tr>
  <tr><td><b>Saw</b></td><td>all, falling as 1/n</td><td>bright, buzzy; strings and brass start here</td></tr>
  <tr><td><b>Square</b></td><td>odd only, 1/n</td><td>hollow, woody, clarinet, chiptune</td></tr>
  <tr><td><b>Pulse</b> (width w)</td><td>all, except every 1/w-th is missing</td><td>narrower = thinner, nasal, reedy</td></tr></table></div>`));
  root.append(note('listen', `<p>Saw → Square: the sound goes <b>hollow</b> because every even harmonic disappears (watch alternate spectral lines vanish). Pulse at 33% removes every 3rd harmonic; at 10% it's thin and nasal. Turn on <b>PWM</b>: the missing harmonics sweep continuously, which sounds like a built-in chorus — the classic string-machine and Juno sound.</p>`));
  root.append(note('phys', `<p>A clarinet is a tube closed at one end, which physically supports only odd harmonics — the same recipe as a square wave, which is why the two sound related. A bowed or plucked string supports all harmonics, closer to a saw.</p>`));
  root.append(note('ix', `<p><b>Source × filter:</b> a filter can only remove what is there. A sine through a sweeping lowpass just gets quieter; a saw through the same sweep goes from buzz to growl to whisper. Pick bright sources when you want filters to be expressive.</p>`));
  root.append(ask('Which wave contains only odd harmonics with amplitudes 1/n?', ['Saw', 'Triangle', 'Square', 'Sine'], 2, 'Square: odd harmonics at 1/n. Triangle is also odd-only but falls much faster (1/n²), so it is mellower.'));
} });

chapter({ id: 'noise', title: 'Noise & inharmonic sounds', min: 2, build(root) {
  root.append(H(`<div class="kicker">Chapter 4 · Source</div><h1>Not every sound is a stack of harmonics</h1>
  <p class="lede">Noise spreads energy across all frequencies at random. Bells, drums and cymbals have partials that are <b>not</b> whole-number multiples. Both matter: noise is the breath, scrape and sizzle in real instruments, and inharmonic partials make metal and skin sound like metal and skin.</p>`));
  let ns = null, col = 'white';
  const playNoise = () => { const c = ac(); const s = c.createBufferSource(); s.buffer = makeNoise(col); s.loop = true; const g = c.createGain(); g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(0.35, c.currentTime + 0.05); s.connect(g).connect(A.clean); s.start(); ns = { s, g }; setViz('spec'); own(() => { g.gain.setTargetAtTime(0, ctx.currentTime, 0.02); s.stop(ctx.currentTime + 0.1); ns = null; }); };
  root.append(demo('Noise colours',
    btns(player('Play noise', playNoise), seg([['white', 'White'], ['pink', 'Pink'], ['brown', 'Brown']], 'white', (v) => { col = v; if (ns) { stopAll(); } }))));
  root.append(note('phys', `<p><b>White</b>: equal energy per Hz — flat on a linear axis, but each octave holds twice as many Hz as the one below, so it sounds hissy and tilts <i>up</i> on our log display. <b>Pink</b>: equal energy per octave (−3 dB/octave) — sounds balanced, like rain; engineers tune rooms with it. <b>Brown</b>: −6 dB/octave — a rumble, surf, wind. (After changing colour, press play again.)</p>`));
  // bell
  const RISSET = [[0.56, 1, 1], [0.56 * 1.0018, 0.67, 0.9], [0.92, 1, 0.65], [0.92 * 1.0019, 1.8, 0.55], [1.19, 2.67, 0.325], [1.7, 1.67, 0.35], [2, 1.46, 0.25], [2.74, 1.33, 0.2], [3, 1.33, 0.15], [3.76, 1, 0.1], [4.07, 1.33, 0.075]];
  let harmonise = false;
  const strike = (base = 330, partials = RISSET, dur = 6) => {
    const c = ac(), t = c.currentTime + 0.02;
    partials.forEach(([r2, a, d]) => {
      const ratio = harmonise ? Math.max(0.5, Math.round(r2 * 2) / 2) : r2;
      const o = c.createOscillator(); o.frequency.value = base * ratio; const g = c.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.045 * a, t + 0.004); g.gain.setTargetAtTime(0, t + 0.004, dur * d / 4);
      o.connect(g).connect(A.clean); o.start(t); o.stop(t + dur * d * 1.4 + 0.1);
    });
  };
  const MEMB = [[1, 1, 0.5], [1.59, 0.8, 0.35], [2.14, 0.65, 0.28], [2.3, 0.55, 0.25], [2.65, 0.5, 0.2], [2.92, 0.4, 0.17], [3.16, 0.35, 0.15], [3.5, 0.3, 0.12]];
  root.append(demo('Inharmonic partials',
    btns(hit('🔔 Strike bell (Risset)', () => { setViz('gram'); strike(330, RISSET, 6); }), hit('🥁 Hit drum membrane', () => { setViz('gram'); strike(110, MEMB, 1.2); }),
      toggle('Force partials to harmonic', false, (v) => { harmonise = v; }))));
  root.append(note('listen', `<p>Strike the bell, then turn on <b>Force partials to harmonic</b> and strike again. The same amplitudes and decays, snapped to whole multiples, turn the bell into a dull organ-like chime: the <b>ratios</b> are what made it metallic. The bell also has no clear single pitch — your brain hunts for a fundamental that doesn't exist. Its pairs of almost-equal partials beat slowly: the "wah-wah" of a real bell.</p>`));
  root.append(note('phys', `<p>A string is a 1-D object pinned at both ends, so its modes fall at whole-number ratios. A drumhead is 2-D: its modes follow Bessel functions (1 : 1.59 : 2.14 : 2.30…), and bars and bells have their own stiff-material ratios. Shape and material set the ratios; that is why you can hear what something is made of.</p>`));
  root.append(H(`<h2>Reading a spectrogram</h2><p>The spectrogram shows frequency (up), time (right) and loudness (brightness). Learn four shapes and you can read any sound: <b>horizontal lines</b> are steady partials; <b>evenly spaced</b> lines mean harmonic, uneven mean inharmonic; <b>vertical smears</b> are transients and noise bursts; <b>slanted lines</b> are pitch glides.</p>`));
  root.append(btns(hit('▶ Play a tour: pluck · bell · noise burst · glide', () => {
    stopAll(); setViz('gram'); const c = ac(), t = c.currentTime + 0.05;
    setPatch({ wave: 'sawtooth', cutoff: 900, fEnv: 3, fD: 0.3, aD: 0.6, aS: 0, aR: 0.3, key: 0.5 }); const v = noteOn(57, 0.9, t); v.release(t + 0.9); setPatch(CH[cur].patch);
    setTimeout(() => strike(440, RISSET, 2.5), 1100);
    setTimeout(() => { const s = ctx.createBufferSource(); s.buffer = makeNoise('white'); const g = ctx.createGain(); g.gain.setValueAtTime(0.4, ctx.currentTime); g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); s.connect(g).connect(A.clean); s.start(); s.stop(ctx.currentTime + 0.4); }, 2700);
    setTimeout(() => { const o = tone({ f: 220, type: 'sawtooth', level: 0.08, dur: 1.4 }); o.o.frequency.setValueAtTime(220, ctx.currentTime + 0.02); o.o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 1.3); }, 3300);
  })));
  root.append(ask('Why does a bell sound metallic rather than like an organ pipe?', ['It is louder', 'Its partials are at non-integer ratios', 'It has no attack', 'It contains only odd harmonics'], 1, 'Inharmonic partial ratios are the fingerprint of bars, plates and bells.'));
} });

chapter({ id: 'filters', title: 'Filters', min: 3, patch: { wave: 'sawtooth', uni: 2, spread: 8, cutoff: 1200, res: 0.3, slope: 24, aA: 0.01, aR: 0.2 }, build(root) {
  root.append(H(`<div class="kicker">Chapter 5 · Shapers</div><h1>Filters remove frequencies</h1>
  <p class="lede">Subtractive synthesis — start bright, carve away — is how most synths, wah pedals, guitar tone knobs and EQs work. A filter has a <b>type</b> (which side it removes), a <b>cutoff</b> (where), a <b>slope</b> (how steeply) and a <b>resonance</b> (a boost right at the cutoff).</p>`));
  const r = rig({ notes: [45, 57], pat: BASS, bpm: 116, droneLabel: 'Drone', loopLabel: 'Bass loop' });
  const cut = pk('Cutoff', 'cutoff', 40, 18000, { log: true, fmt: fmtHz });
  let sweeping = false;
  root.append(demo('Filter',
    r.el,
    seg([['sawtooth', 'Saw source'], ['noise', 'Noise source'], ['sine', 'Sine source']], 'sawtooth', (w) => { P('wave', w); r.restart(); }),
    seg([['lowpass', 'Lowpass'], ['highpass', 'Highpass'], ['bandpass', 'Bandpass'], ['notch', 'Notch']], 'lowpass', (t) => { P('fType', t); }),
    row(cut, pk('Resonance', 'res', 0, 1, { fmt: pct })),
    btns(seg([[12, '12 dB/oct'], [24, '24 dB/oct']], 24, (s) => { P('slope', s); r.restart(); }),
      toggle('Auto-sweep (LFO)', false, (v) => { sweeping = v; FX.lfoShape = 'triangle'; FX.lfoRate = 0.12; restartLFO(); P('lfoDest', v ? 'cutoff' : 'none'); P('lfoDepth', v ? 0.6 : 0); r.restart(); }))));
  root.append(note('listen', `<p>On the Spectrum, sweep <b>Cutoff</b> down: the harmonics to the right of it sink. Raise <b>Resonance</b>: a peak appears right at the cutoff, and sweeping it sounds vocal ("yow"). Switch to <b>Bandpass</b>: telephone. <b>Highpass</b>: thin, the body is gone. <b>Notch</b>: subtle — a narrow hole — the building block of a phaser. Then choose <b>Sine source</b> and sweep: almost nothing to hear, only volume.</p>`));
  root.append(note('phys', `<p><b>Cutoff</b> is the −3 dB point. <b>Slope</b>: a 12 dB/octave (2-pole) filter lets more through above cutoff — brighter, gentler; 24 dB/octave (4-pole, the Moog ladder sound) is steeper and more "synthy". <b>Resonance</b> feeds the output back to the input; at high settings analog filters self-oscillate into a sine at the cutoff. An EQ band is the same family of filters with gain controls: a peaking band is a resonant bump you can steer.</p>`));
  root.append(H(`<h2>Keytracking: filters that follow the note</h2><p>A fixed cutoff makes low notes bright and high notes dull, because their harmonics sit in different places. <b>Keytracking</b> moves the cutoff with the pitch. At 100%, the cutoff rises an octave for every octave played, so every note keeps the same harmonic recipe.</p>`));
  root.append(demo('Keytracking',
    btns(player('Play notes over 4 octaves', () => { P('cutoff', 500); cut.set(500); seqStart(SPAN, { bpm: 92 }); })),
    row(pk('Keytrack', 'key', 0, 1, { fmt: pct }))));
  root.append(note('listen', `<p>At 0%, the high notes lose almost all their harmonics and sound like sines. Raise keytrack toward 100% and the brightness becomes even across the range. Acoustic instruments behave in between — that's why real high notes are often a little purer.</p>`));
  root.append(note('ix', `<p><b>Cutoff × resonance × source:</b> resonance only rings when there is energy near the cutoff, so a resonant filter on a bright saw screams while the same setting on a sine does little. Many analog filters also <b>lose bass</b> as resonance rises — producers compensate with a sub oscillator. And <b>slope × cutoff</b>: a 12 dB filter at 800 Hz can sound as bright as a 24 dB filter at 1.5 kHz.</p>`));
  root.append(note('gen', `<p>Your guitar's tone knob is a passive lowpass; with the cable's capacitance and the pickup's inductance it even has a resonant peak (that's the "voice" of a pickup). A wah pedal is a resonant bandpass swept by your foot. Mixing EQ — cut mud with a highpass, tame harshness with a notch — is the same tool with a different goal.</p>`));
  root.append(ask('Raising a lowpass filter\'s resonance does what?', ['Lowers the cutoff', 'Adds a peak of emphasis right at the cutoff frequency', 'Adds distortion', 'Makes the slope gentler'], 1, 'Resonance boosts a narrow band at the cutoff; sweep it and you hear that peak move.'));
  root.append(ask('A bass line sounds dull up high and too bright down low. Which control fixes this?', ['Resonance', 'Keytracking', 'Slope', 'Notch mode'], 1, 'Keytracking moves cutoff with pitch so the harmonic balance stays constant.'));
} });

chapter({ id: 'env', title: 'Envelopes', min: 2, patch: { wave: 'sawtooth', cutoff: 2600, res: 0.1, slope: 24, key: 0.5, aA: 0.005, aD: 0.4, aS: 0.6, aR: 0.4 }, build(root) {
  root.append(H(`<div class="kicker">Chapter 6 · Modulators</div><h1>Envelopes: the shape of a note in time</h1>
  <p class="lede">An envelope generator draws a curve each time a key goes down. On volume, the classic <b>ADSR</b> describes most instruments: <b>Attack</b> (time to reach full level), <b>Decay</b> (time to fall to…), <b>Sustain</b> (a level held while the key is down), <b>Release</b> (time to fade after key up).</p>`));
  const svg = envSvg(); const redraw = () => svg.draw(patch.aA, patch.aD, patch.aS, patch.aR);
  const sA = pk('Attack', 'aA', 0.001, 3, { log: true, fmt: fmtS, on: redraw }), sD = pk('Decay', 'aD', 0.01, 3, { log: true, fmt: fmtS, on: redraw });
  const sS = pk('Sustain', 'aS', 0, 1, { fmt: pct, on: redraw }), sR = pk('Release', 'aR', 0.01, 5, { log: true, fmt: fmtS, on: redraw });
  const pre = (a, d, s, r) => { patch.aA = a; patch.aD = d; patch.aS = s; patch.aR = r; sA.set(a); sD.set(d); sS.set(s); sR.set(r); redraw(); };
  root.append(demo('Amplitude envelope',
    btns(player('Play phrase', () => seqStart(ENVPAT, { bpm: 92 }))),
    svg, row(sA, sD), row(sS, sR),
    btns(hit('Pluck', () => pre(0.002, 0.35, 0, 0.3)), hit('Organ', () => pre(0.003, 0.05, 1, 0.03)), hit('Pad', () => pre(0.9, 1.2, 0.8, 2)), hit('Swell', () => pre(2.5, 0.5, 1, 1.2)), hit('Piano-ish', () => pre(0.002, 1.8, 0.0, 0.5)), hit('Staccato brass', () => pre(0.04, 0.15, 0.7, 0.08)))));
  redraw();
  root.append(note('listen', `<p>The phrase has short and long notes. With <b>Organ</b>, short and long notes differ only in length. With <b>Pluck</b> and <b>Piano-ish</b> (sustain 0), long notes die away anyway — the Decay decides. <b>Release</b> is what you hear after the key lifts: long releases blur notes together like a sustain pedal. Tap 🎹 and play slowly with <b>Pad</b>.</p>`));
  root.append(H(`<h2>The attack carries identity</h2><p>Classic experiments that cut the first fraction of a second off instrument recordings found listeners confusing trumpet, violin and clarinet. The transient — a short, noisy, broadband burst — is how we recognise a source.</p>`));
  const atk = (a) => { stopAll(); const keep = patch; setPatch({ wave: 'sawtooth', cutoff: 1400, fEnv: 2.5, fD: 0.15, fS: 0.3, key: 0.5, aA: a, aD: 0.5, aS: 0.6, aR: 0.4, noise: a < 0.01 ? 0.25 : 0 }); const t = now() + 0.03; [57, 64, 69].forEach((m, i) => noteOn(m, 0.9, t + i * 0.5).release(t + i * 0.5 + 0.45)); patch = keep; };
  root.append(demo('Same tone, attack on or off', btns(hit('▶ Sharp attack + click', () => atk(0.002)), hit('▶ 120 ms attack', () => atk(0.12)), hit('▶ 400 ms attack', () => atk(0.4)))));
  root.append(note('phys', `<p>Fast change = many frequencies: a 1 ms attack contains energy far up the spectrum (look for the vertical smear in the Spectrogram). That's why an instant attack on a low sine <b>clicks</b>, and why synths default to a few milliseconds of attack and release.</p>`));
  root.append(note('gen', `<p>A guitarist rolling the volume knob up after picking ("violining") is a manual slow attack. Compressor attack/release, noise-gate open/close, and a sustain pedal are all envelopes. When a mix sounds "smeared", the culprit is often too much release or reverb tail.</p>`));
  root.append(ask('A sound keeps its level as long as you hold the key, then fades for 2 seconds after release. Which settings?', ['Sustain 0, release 2 s', 'Sustain 100%, release 2 s', 'Attack 2 s', 'Decay 2 s, sustain 0'], 1, 'Sustain is a level held while the key is down; release is the fade time after key-up.'));
} });

chapter({ id: 'fenv', title: 'Filter envelope (interaction #1)', min: 3,
  patch: { wave: 'sawtooth', cutoff: 220, res: 0.55, slope: 24, fEnv: 4, fA: 0.002, fD: 0.22, fS: 0, fR: 0.15, velF: 0.7, aA: 0.002, aD: 0.4, aS: 0.7, aR: 0.08, key: 0.3 },
  fx: { dMix: 0.15, dSync: 0.75, dFb: 0.3, dTone: 2500 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 7 · Interaction</div><h1>Envelope → cutoff: where synth sounds come alive</h1>
  <p class="lede">Send a second envelope to the filter cutoff and each note gets a brightness contour: a bright attack that darkens, like a plucked string. This is the single most important modulation in synthesis — and the clearest example of parameters that only make sense <b>together</b>.</p>`));
  const pkTxt = E('div', { class: 'readout' });
  const show = () => { const b = patch.cutoff, hi = clamp(b * Math.pow(2, patch.fEnv), 20, 20000), lo = clamp(b * Math.pow(2, patch.fEnv * (1 - patch.velF + patch.velF * 0.55)), 20, 20000);
    pkTxt.textContent = `cutoff sweeps ${fmtHz(b)} → ${fmtHz(hi)} on accents, → ${fmtHz(lo)} on soft notes${b * Math.pow(2, patch.fEnv) > 20000 ? '  (hitting the 20 kHz ceiling!)' : ''}`; };
  const s = {
    cut: pk('Cutoff (base)', 'cutoff', 40, 6000, { log: true, fmt: fmtHz, on: show }),
    amt: pk('Env amount', 'fEnv', -4, 7, { step: 0.1, fmt: (v) => (v > 0 ? '+' : '') + v.toFixed(1) + ' oct', on: show }),
    dec: pk('Filter decay', 'fD', 0.02, 2, { log: true, fmt: fmtS }),
    res: pk('Resonance', 'res', 0, 1, { fmt: pct }),
    vel: pk('Velocity → filter', 'velF', 0, 1, { fmt: pct, on: show }),
    att: pk('Filter attack', 'fA', 0.002, 1.5, { log: true, fmt: fmtS }),
  };
  const pre = (o) => { Object.assign(patch, o); s.cut.set(patch.cutoff); s.amt.set(patch.fEnv); s.dec.set(patch.fD); s.res.set(patch.res); s.vel.set(patch.velF); s.att.set(patch.fA); show(); };
  root.append(demo('Acid-style bass with a filter envelope',
    btns(player('Play bass loop', () => seqStart(BASS, { bpm: 122 })), player('Play chords', () => seqStart(CHORDS, { bpm: 100, len: 64 }))),
    row(s.cut, s.amt), row(s.dec, s.res), row(s.vel, s.att), pkTxt,
    btns(hit('Acid', () => pre({ cutoff: 220, fEnv: 4, fD: 0.22, res: 0.6, fA: 0.002, fS: 0, velF: 0.7, aA: 0.002, aS: 0.7 })), hit('Pluck', () => pre({ cutoff: 300, fEnv: 5, fD: 0.12, res: 0.15, fA: 0.002, fS: 0, velF: 0.3, aS: 0 })),
      hit('Brass swell', () => pre({ cutoff: 500, fEnv: 2.5, fA: 0.25, fD: 0.6, fS: 0.6, res: 0.1, velF: 0.3, aA: 0.06, aS: 0.9 })), hit('Inverted (−)', () => pre({ cutoff: 4000, fEnv: -3.5, fD: 0.4, fA: 0.002, fS: 0, res: 0.3 })),
      hit('No envelope', () => pre({ cutoff: 900, fEnv: 0, res: 0.3 })), hit('Ceiling trap', () => pre({ cutoff: 4000, fEnv: 5, fD: 0.3, res: 0.2 })))));
  show();
  root.append(note('listen', `<p>Hold the loop and drag <b>Filter decay</b> from short to long: "blip" → "wow" → "waaow". Raise <b>Resonance</b>: the sweep starts to sing — the 303 squelch. Now set <b>Env amount</b> to 0 and the same filter is static and lifeless. Try <b>Ceiling trap</b>: cutoff is already high, so the envelope pushes past 20 kHz and seems to do nothing.</p>`));
  root.append(note('ix', `<p>The filter actually sees <b>cutoff × 2<sup>(amount × velocity)</sup></b>, shaped over time by the envelope. So:</p>
  <ul><li><b>Cutoff × amount</b>: low cutoff + big amount = dramatic sweep; high cutoff + any amount = little audible change.</li>
  <li><b>Amount × decay</b>: how far vs how long. Big amount with short decay = percussive click; small amount with long decay = gentle bloom.</li>
  <li><b>Resonance × sweep</b>: resonance makes the <i>movement</i> audible, so it matters far more with an envelope than on a static filter.</li>
  <li><b>Velocity × amount</b>: harder notes open further, like a real instrument played harder.</li>
  <li><b>Filter env × amp env</b>: if the amp decays faster than the filter, you never hear the filter's tail.</li></ul>`));
  root.append(note('gen', `<p>Every acoustic instrument does this: a harder pick or bow stroke is both louder <i>and</i> brighter, then the highs die before the lows. That's why "brightness falls during the note" reads as natural, and a static filter reads as synthetic. An auto-wah / envelope filter pedal is exactly this, driven by how hard you play.</p>`));
  root.append(ask('You raise filter env amount but hear almost no change. Most likely cause?', ['Resonance is too low', 'Base cutoff is already near the top, so the sweep hits the ceiling', 'The amp envelope attack is too slow', 'The slope is 12 dB'], 1, 'Envelope amount is relative to the base cutoff. If the base is high, there is no room left to open.'));
} });

chapter({ id: 'lfo', title: 'LFOs & the mod matrix', min: 3,
  patch: { wave: 'sawtooth', cutoff: 1100, res: 0.45, slope: 24, aA: 0.01, aS: 0.9, aR: 0.2, lfoDest: 'pitch', lfoDepth: 0.15 },
  fx: { lfoRate: 5.5, lfoShape: 'sine' },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 8 · Modulators</div><h1>LFOs: repeating hands on the knobs</h1>
  <p class="lede">A low-frequency oscillator is a waveform too slow to hear (typically 0.05–20 Hz) used to move a parameter back and forth. Same LFO, different destination, completely different effect.</p>`));
  const r = rig({ notes: [57], pat: BASS, bpm: 120, droneLabel: 'Drone', loopLabel: 'Bass loop' });
  const rate = fk('Rate', 'lfoRate', 0.05, 40, { log: true, fmt: (v) => v.toFixed(v < 1 ? 2 : 1) + ' Hz' + (v > 20 ? ' — audio rate!' : '') });
  const depth = pk('Depth', 'lfoDepth', 0, 1, { fmt: pct });
  root.append(demo('LFO',
    r.el,
    E('div', { class: 'small muted' }, 'Destination'),
    seg([['pitch', 'Pitch'], ['amp', 'Volume'], ['cutoff', 'Cutoff'], ['pan', 'Pan'], ['pw', 'Pulse width']], 'pitch', (d) => {
      if (d === 'pw' && patch.wave !== 'pulse') { P('wave', 'pulse'); } else if (d !== 'pw' && patch.wave === 'pulse') P('wave', 'sawtooth');
      P('lfoDest', d); r.restart(); }),
    E('div', { class: 'small muted', style: 'margin-top:8px' }, 'Shape'),
    seg([['sine', 'Sine'], ['triangle', 'Tri'], ['ramp', 'Ramp ↗'], ['saw', 'Saw ↘'], ['square', 'Square'], ['random', 'S&H']], 'sine', (sh) => fx('lfoShape', sh)),
    row(rate, depth),
    E('div', { class: 'small muted' }, 'Tempo sync (loop is 120 BPM)'),
    seg([[0, 'Free'], [4, '1 bar'], [2, '1/2'], [1, '1/4'], [0.5, '1/8'], [1 / 3, '1/8T'], [0.25, '1/16']], 0, (v) => { FX.lfoSync = v; setLfoRate(); restartLFO(); })));
  root.append(H(`<div class="tw"><table><tr><th>Destination</th><th>Name</th><th>Typical</th></tr>
  <tr><td>Pitch</td><td>vibrato · trill (square)</td><td>5–7 Hz, 10–40 cents</td></tr>
  <tr><td>Volume</td><td>tremolo</td><td>3–10 Hz</td></tr>
  <tr><td>Cutoff</td><td>wah, wobble bass</td><td>tempo-synced 1/4–1/16</td></tr>
  <tr><td>Pan</td><td>auto-pan</td><td>0.1–2 Hz</td></tr>
  <tr><td>Pulse width</td><td>PWM, chorus-like</td><td>0.2–1 Hz</td></tr>
  <tr><td>Any + S&amp;H</td><td>"computer burble"</td><td>random step per cycle</td></tr></table></div>`));
  root.append(note('listen', `<p>Try Pitch + Sine at 5.5 Hz, depth ~15%: a singer's vibrato. Square on pitch = trill. <b>Cutoff</b> + sync <b>1/8</b> on the bass loop = wobble bass. <b>S&amp;H</b> on cutoff = the random-step burble from 70s sci-fi. Now push Rate past 20 Hz: the wobble stops being a rhythm and becomes a <b>new timbre</b> — sidebands. That's the doorway to FM and AM (Chapter 10).</p>`));
  root.append(H(`<h2>The modulation matrix</h2><p>Every modern synth is a grid of <b>sources</b> (envelopes, LFOs, velocity, key position, mod wheel, aftertouch, random) routed with an <b>amount</b> to <b>destinations</b> (pitch, cutoff, level, pan, pulse width, effect parameters — even another modulator's rate). Once you see that, every synth is the same synth.</p>`));
  root.append(note('ix', `<p><b>Depth × base value:</b> an LFO swings the parameter around where the knob is set. With cutoff near the ceiling the upper half of the swing is clipped, so the wobble turns lopsided. <b>LFO on cutoff × resonance:</b> resonance makes the sweep audible as a "voice". <b>Rate × tempo:</b> free-running LFOs drift against the beat (organic); synced ones lock to it (mechanical, groovy). <b>Modulating the modulator</b> — an envelope on LFO depth — is how delayed vibrato works: the note starts straight and the vibrato blooms.</p>`));
  root.append(note('gen', `<p>Guitar pedals are mostly LFOs: tremolo = LFO → volume; phaser = LFO → a chain of notch filters; flanger/chorus = LFO → a short delay time; uni-vibe = LFO → phase shifters with a lopsided shape. A Leslie speaker is one rotating horn modulating pitch, volume and pan at once.</p>`));
  root.append(ask('Same LFO, sine at 6 Hz. Routed to volume it\'s called…', ['Vibrato', 'Tremolo', 'Chorus', 'Wah'], 1, 'Tremolo is amplitude modulation; vibrato is pitch modulation. (Fender famously swapped the names on some amps.)'));
} });

chapter({ id: 'unison', title: 'Detune, unison & width', min: 2,
  patch: { wave: 'sawtooth', uni: 2, spread: 6, width: 0, cutoff: 7000, slope: 12, aA: 0.01, aS: 0.9, aR: 0.4 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 9 · Source × time</div><h1>Many slightly-wrong copies sound huge</h1>
  <p class="lede">Detune two oscillators by a few cents and they drift in and out of phase: beating. Stack seven, spread them across the stereo field, and you get the wall of sound in trance, synthwave and modern pop — the supersaw. A string section works the same way.</p>`));
  const beat = E('div', { class: 'readout' });
  const bupd = () => { const f = mtof(57), c = patch.spread * 2; beat.textContent = `two oscillators ${c.toFixed(1)} cents apart at ${nname(57)} (${f.toFixed(0)} Hz) → ${(f * (Math.pow(2, c / 2400) - Math.pow(2, -c / 2400))).toFixed(2)} beats per second`; };
  const r = rig({ notes: [57], pat: CHORDS, bpm: 100, len: 64, droneLabel: 'Drone (A3)', loopLabel: 'Chords' });
  const uni = slider({ label: 'Voices', min: 1, max: 9, step: 1, value: patch.uni, fmt: (v) => v, on: (v) => { patch.uni = v; r.restart(); } });
  root.append(demo('Unison',
    r.el,
    row(pk('Detune spread', 'spread', 0, 50, { step: 0.5, fmt: (v) => '±' + v + '¢', on: bupd }), uni),
    row(pk('Stereo width', 'width', 0, 1, { fmt: pct })),
    beat,
    btns(hit('Two oscillators', () => { patch.uni = 2; patch.spread = 6; patch.width = 0; uni.set(2); r.restart(); fx('chorus', 0); }), hit('Supersaw', () => { Object.assign(patch, { uni: 7, spread: 22, width: 1, cutoff: 6000 }); uni.set(7); r.restart(); fx('chorus', 0.3); }))));
  bupd();
  root.append(note('listen', `<p>With two voices, push spread from 0 to 3 cents: a slow pulse (watch the Wave view breathe). Further: a fast shimmer, then sourness. Load <b>Supersaw</b> and press the <b>ST</b> button in the top bar to switch to MONO: the width disappears and the sound gets thinner and phasier — the unison voices partly cancel when summed. Phone speakers, club PAs and some streaming playback are mono.</p>`));
  root.append(H(`<h2>Chorus: detune without more oscillators</h2><p>A chorus effect mixes in a copy delayed by ~15–25 ms, with the delay time slowly modulated. A delay that is getting longer plays back slightly flat; getting shorter, slightly sharp (Doppler). So a moving delay is a moving detune.</p>`));
  root.append(demo('Chorus effect on one oscillator',
    btns(player('Play single saw chords', () => { patch.uni = 1; seqStart(CHORDS, { bpm: 100, len: 64 }); })),
    row(fk('Chorus mix', 'chorus', 0, 1, { fmt: pct }), fk('Rate', 'chorusRate', 0.1, 6, { log: true, fmt: (v) => v.toFixed(2) + ' Hz' }), fk('Depth', 'chorusDepth', 0, 1, { fmt: pct }))));
  root.append(note('ix', `<p><b>Detune × pitch:</b> a fixed detune in cents produces beats proportional to frequency — high notes shimmer fast, low notes wobble slowly and sound muddy. That's why producers keep basses mono and lightly detuned, or add a clean sub. <b>Width × mono compatibility:</b> the wider the spread, the more you lose when summed. <b>Unison × filter:</b> detuned voices beat in the upper harmonics first, so a lowpass makes heavy unison sound smoother.</p>`));
  root.append(note('gen', `<p>Double-tracked guitars (two takes panned hard left/right) are natural unison: tiny timing and pitch differences make them wide. A 12-string guitar is unison and octave doubling. Choirs and string sections sound "big" for the same reason.</p>`));
  root.append(ask('Two oscillators at 440 Hz and 442 Hz. What do you hear?', ['Two separate pitches', 'One pitch pulsing twice per second', 'A chord', 'Silence'], 1, 'The difference frequency (2 Hz) is heard as beating; the ear fuses close frequencies into one pitch.'));
} });
</script>

<script>
/* ================= chapters 10–17 ================= */
const MELODY = [{ s: 0, n: 69, d: 3 }, { s: 4, n: 72, d: 2 }, { s: 6, n: 71, d: 2 }, { s: 8, n: 69, d: 3 }, { s: 12, n: 64, d: 3 }, { s: 16, n: 67, d: 3 }, { s: 20, n: 65, d: 2 }, { s: 22, n: 64, d: 2 }, { s: 24, n: 62, d: 6 }];
const STABS = [{ s: 0, n: [57, 60, 64], d: 2 }, { s: 3, n: [57, 60, 64], d: 2 }, { s: 8, n: [55, 59, 62], d: 3 }, { s: 12, n: [53, 57, 60], d: 3 }];
const SPARSE = [{ s: 0, n: 64, d: 1 }, { s: 3, n: 67, d: 1 }, { s: 8, n: 69, d: 1 }];
const BEAT = [{ s: 0, dr: 'kick' }, { s: 8, dr: 'kick' }, { s: 10, dr: 'kick', v: 0.8 }, { s: 4, dr: 'snare' }, { s: 12, dr: 'snare' },
  ...[0, 2, 4, 6, 8, 10, 12].map((s) => ({ s, dr: 'hat', v: s % 4 ? 0.5 : 0.8 })), { s: 14, dr: 'open', v: 0.6 }];
const DRUMBASS = [...BEAT, ...BASS.map((e) => ({ ...e, v: e.v * 0.8 }))];
const FOUR = [0, 4, 8, 12].map((s) => ({ s, dr: 'kick' }));

chapter({ id: 'fm', title: 'FM, AM & ring modulation', min: 3,
  patch: { wave: 'sine', fmRatio: 1, fmIndex: 2, fmDecay: 0, cutoff: 18000, aA: 0.005, aS: 0.9, aR: 0.3 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 10 · Source</div><h1>Modulation at audio rate creates new frequencies</h1>
  <p class="lede">Speed an LFO on pitch past ~20 Hz and the wobble disappears into a new timbre. That's <b>frequency modulation</b>: a <i>modulator</i> oscillator pushes a <i>carrier</i>'s frequency up and down hundreds of times a second, creating <b>sidebands</b>. Two sines can make bells, electric pianos, basses and metal.</p>`));
  const sb = E('div', { class: 'readout' });
  const sbUpd = () => { const fc = mtof(57), fm = fc * patch.fmRatio; const list = []; for (let k = -3; k <= 3; k++) { const f = Math.abs(fc + k * fm); if (f > 1) list.push(f); }
    const harmonic = Math.abs(patch.fmRatio * 2 - Math.round(patch.fmRatio * 2)) < 0.02 || Math.abs(1 / patch.fmRatio - Math.round(1 / patch.fmRatio)) < 0.02;
    sb.textContent = `on A3: carrier ${fc.toFixed(0)} Hz, modulator ${fm.toFixed(0)} Hz → sidebands at ${[...new Set(list.map((f) => Math.round(f)))].sort((a, b) => a - b).slice(0, 7).join(', ')} Hz… ${harmonic ? '(simple ratio → harmonic)' : '(irrational ratio → inharmonic)'}`; };
  const r = rig({ notes: [57], pat: MELODY, bpm: 100, len: 32, droneLabel: 'Drone (A3)', loopLabel: 'Melody' });
  const ratio = pk('Ratio (mod : carrier)', 'fmRatio', 0.5, 8, { step: 0.01, fmt: (v) => v.toFixed(2), on: sbUpd });
  const index = pk('Index (depth)', 'fmIndex', 0, 12, { step: 0.05, fmt: (v) => v.toFixed(2) });
  const decay = pk('Index decay', 'fmDecay', 0, 4, { step: 0.01, fmt: (v) => v ? fmtS(v) : 'static' });
  const snap = (v) => { ratio.set(v); P('fmRatio', v); sbUpd(); };
  const pre = (o, fxo) => { Object.assign(patch, o); ratio.set(patch.fmRatio); index.set(patch.fmIndex); decay.set(patch.fmDecay); sbUpd(); if (fxo) setFX({ ...FX, ...fxo }); r.restart(); };
  root.append(demo('Two-operator FM',
    r.el, row(ratio, index), row(decay),
    btns(...[1, 2, 3, 0.5, 1.414, 3.5, 7.13].map((v) => hit('×' + v, () => snap(v)))),
    sb,
    btns(hit('E-piano', () => pre({ fmRatio: 1, fmIndex: 2.4, fmDecay: 0.9, fmSus: 0.1, aD: 2.2, aS: 0, aR: 0.5 }, { chorus: 0.3 })), hit('Bell', () => pre({ fmRatio: 3.5, fmIndex: 4, fmDecay: 2.5, fmSus: 0.2, aD: 4, aS: 0, aR: 2.5 }, { rMix: 0.3, rDecay: 3 })),
      hit('FM bass', () => pre({ fmRatio: 1, fmIndex: 3.5, fmDecay: 0.2, fmSus: 0.15, aD: 0.5, aS: 0.4, aR: 0.1 })), hit('Metallic', () => pre({ fmRatio: 1.414, fmIndex: 6, fmDecay: 0, aD: 0.5, aS: 0.8, aR: 0.6 })),
      hit('Static, no FM', () => pre({ fmIndex: 0, fmDecay: 0, aS: 0.9 })))));
  sbUpd();
  root.append(note('listen', `<p>On the drone, raise <b>Index</b> from 0: a pure sine grows brighter and brassier — the same job a filter opening does, but by adding rather than removing. Now sweep <b>Ratio</b> slowly: at 1, 2, 3 it sounds like a pitched note; in between it turns clangorous and the pitch gets ambiguous. Load <b>E-piano</b> and <b>Bell</b>: the index decays, so each note starts bright and mellows.</p>`));
  root.append(note('phys', `<p>Sidebands appear at <b>carrier ± k × modulator</b> (k = 1, 2, 3…). Whole-number ratios put them on a harmonic series; irrational ratios (√2 ≈ 1.414) scatter them inharmonically — bells and metal. The <b>index</b> (peak frequency deviation ÷ modulator frequency) sets how many sidebands are strong, roughly bandwidth ≈ 2 × (deviation + modulator) (Carson's rule). The DX7 (1983) built the decade's sound on this.</p>`));
  root.append(note('ix', `<p><b>Ratio × index:</b> ratio decides <i>where</i> the energy goes, index decides <i>how much</i>. A small index makes even an odd ratio sound tame; a huge index makes even 1:1 harsh. <b>Index × envelope</b> is FM's equivalent of the filter envelope — the sound evolves because the spectrum is being rebuilt every instant.</p>`));
  // AM / ring
  root.append(H(`<h2>AM and ring modulation: multiplying signals</h2><p>Multiply a signal by an oscillator and you get the <b>sum and difference</b> frequencies. <b>Ring modulation</b> keeps only those (the original disappears); <b>amplitude modulation</b> keeps the original too. Below ~20 Hz both are just tremolo.</p>`));
  let rm = null; const rs = { f: 30, mode: 'ring', src: 'sine' };
  const rmTxt = E('div', { class: 'readout' });
  const rmUpd = () => { rmTxt.textContent = rs.src === 'sine' ? `440 Hz × ${rs.f.toFixed(0)} Hz → ${(440 + rs.f).toFixed(0)} Hz and ${Math.abs(440 - rs.f).toFixed(0)} Hz${rs.mode === 'am' ? ' + the 440 Hz original' : ''}` : 'every partial of the chord gets its own sum and difference pair: almost always inharmonic';
    if (rm) { rm.m.frequency.setTargetAtTime(rs.f, now(), 0.02); rm.vca.gain.setTargetAtTime(rs.mode === 'am' ? 0.5 : 0, now(), 0.02); rm.mg.gain.setTargetAtTime(rs.mode === 'am' ? 0.5 : 1, now(), 0.02); } };
  const startRM = () => {
    const c = ac(), vca = c.createGain(); vca.gain.value = rs.mode === 'am' ? 0.5 : 0;
    const m = c.createOscillator(); m.frequency.value = rs.f; const mg = c.createGain(); mg.gain.value = rs.mode === 'am' ? 0.5 : 1; m.connect(mg).connect(vca.gain); m.start();
    const out = c.createGain(); out.gain.setValueAtTime(0, c.currentTime); out.gain.linearRampToValueAtTime(1, c.currentTime + 0.05); vca.connect(out).connect(A.clean);
    let src;
    if (rs.src === 'sine') { src = [c.createOscillator()]; src[0].frequency.value = 440; src[0].connect(vca); src[0].start(); }
    else { src = [220, 277.18, 329.63].map((f) => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const g = c.createGain(); g.gain.value = 0.3; o.connect(g).connect(vca); o.start(); return o; }); }
    rm = { m, mg, vca }; setViz('spec');
    own(() => { out.gain.setTargetAtTime(0, ctx.currentTime, 0.01); [m, ...src].forEach((o) => o.stop(ctx.currentTime + 0.08)); rm = null; });
  };
  root.append(demo('Ring / AM',
    btns(player('Play', startRM), seg([['ring', 'Ring mod'], ['am', 'AM']], 'ring', (v) => { rs.mode = v; rmUpd(); }), seg([['sine', '440 Hz sine'], ['chord', 'Saw chord']], 'sine', (v) => { rs.src = v; if (rm) { stopAll(); } rmUpd(); })),
    row(slider({ label: 'Modulator frequency', min: 1, max: 2000, log: true, value: rs.f, fmt: fmtHz, on: (v) => { rs.f = v; rmUpd(); } })), rmTxt));
  rmUpd();
  root.append(note('listen', `<p>Start the modulator at 1–8 Hz: plain tremolo. Sweep up through 20–40 Hz: the pulsing turns into a growl, then two distinct pitches split away from 440 in opposite directions. On the saw chord, ring mod gives the robotic, bell-like clang of Dalek voices and Moogerfooger guitar.</p>`));
  root.append(note('gen', `<p>Vibrato and tremolo are FM and AM at slow rates; the boundary is perception, not physics. A ring-modulator pedal on guitar, a radio's AM band, and the "robot voice" are all the same multiplication.</p>`));
  root.append(ask('Carrier 200 Hz, modulator 200 Hz (ratio 1:1). Where are the FM sidebands?', ['200, 300, 500 Hz', '0, 400, 600, 800 Hz… (a harmonic series on 200)', 'Random inharmonic places', 'Nowhere — there are none'], 1, '200 ± k·200 = 0, 400, 600, 800…: all multiples of 200, so it stays harmonic.'));
} });

chapter({ id: 'digital', title: 'Digital audio & aliasing', min: 2, build(root) {
  root.append(H(`<div class="kicker">Chapter 11 · Physics of the computer</div><h1>Sample rate, Nyquist and bit depth</h1>
  <p class="lede">Digital audio measures the pressure wave thousands of times a second (<b>sample rate</b>) with a certain precision (<b>bit depth</b>). Both limits are audible when pushed — sometimes on purpose.</p>`));
  root.append(note('phys', `<p>The <b>Nyquist limit</b>: a sample rate f<sub>s</sub> can represent frequencies only up to f<sub>s</sub>/2. Anything above it doesn't vanish — it <b>folds back</b> (aliases) to f<sub>s</sub> − f, an unrelated pitch moving the wrong way. Your device is running at <b>${ac().sampleRate} Hz</b>, so its limit is ${(ac().sampleRate / 2000).toFixed(1)} kHz. CDs use 44.1 kHz because it covers 20 kHz hearing with room for a filter.</p>`));
  const c = ac(), sr = c.sampleRate;
  const naive = (() => { const dur = 4, n = sr * dur, b = c.createBuffer(1, n, sr), d = b.getChannelData(0); let ph = 0; for (let i = 0; i < n; i++) { const f = 110 * Math.pow(32, i / n); ph += f / sr; ph -= Math.floor(ph); d[i] = (2 * ph - 1) * 0.12; } return b; })();
  const sweep = (bl) => { stopAll(); setViz('gram'); const t = c.currentTime + 0.05;
    if (bl) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(3520, t + 4); const g = c.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.setValueAtTime(0.12, t + 3.95); g.gain.linearRampToValueAtTime(0, t + 4); o.connect(g).connect(A.clean); o.start(t); o.stop(t + 4.05); }
    else { const s = c.createBufferSource(); s.buffer = naive; s.connect(A.clean); s.start(t); } };
  root.append(demo('Hear aliasing: a sawtooth sweeping 110 Hz → 3.5 kHz',
    btns(hit('▶ Naive saw (aliases)', () => sweep(false)), hit('▶ Band-limited saw', () => sweep(true)))));
  root.append(note('listen', `<p>In the naive version, listen <i>under</i> the rising pitch for ghost tones falling or warbling — and see them in the Spectrogram as lines slanting downward. The band-limited saw only contains harmonics below Nyquist, so it rises cleanly. Good synths and plugins work hard to avoid aliasing.</p>`));
  let sw = null;
  const crushUI = { rate: sr, bits: 16 };
  const applyC = () => { FX.crushDown = Math.max(1, sr / crushUI.rate); FX.crushBits = crushUI.bits; FX.crushMix = (crushUI.rate < sr || crushUI.bits < 16) ? 1 : 0; applyFX(); };
  root.append(demo('Bitcrusher: lower the sample rate and the bit depth',
    btns(player('Sine sweep 200 Hz → 8 kHz', () => { applyC(); setViz('gram'); const o = c.createOscillator(); o.frequency.value = 200; const g = c.createGain(); g.gain.value = 0.25; o.connect(g).connect(A.fxIn); o.start();
      const loop = () => { const t = c.currentTime; o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(8000, t + 5); };
      loop(); const id = setInterval(loop, 5000); own(() => { clearInterval(id); g.gain.setTargetAtTime(0, ctx.currentTime, 0.01); o.stop(ctx.currentTime + 0.05); }); }),
      player('Drum + bass loop', () => { applyC(); seqStart(DRUMBASS, { bpm: 104 }); })),
    row(slider({ label: 'Effective sample rate', min: 1500, max: sr, log: true, value: sr, fmt: (v) => fmtHz(v), on: (v) => { crushUI.rate = v; applyC(); } }),
      slider({ label: 'Bit depth', min: 1, max: 16, step: 1, value: 16, fmt: (v) => v + ' bit · ' + (v * 6.02).toFixed(0) + ' dB range', on: (v) => { crushUI.bits = v; applyC(); } }))));
  root.append(note('listen', `<p>Set the sample rate to ~8 kHz and play the sweep: once the sine passes 4 kHz its alias comes back <b>down</b> as the real tone goes up — a mirror at Nyquist. On the loop, 12 bits and ~26 kHz is the classic gritty sampler sound (SP-1200 era); 4 bits is pure distortion. Each bit is worth about 6 dB of dynamic range: 16-bit ≈ 96 dB, 24-bit ≈ 144 dB.</p>`));
  root.append(note('ix', `<p><b>Distortion × sample rate:</b> clipping creates harmonics far above the input, and any above Nyquist alias into inharmonic grit. That's why distortion plugins and amp sims <b>oversample</b> (this course's shapers run at 4×). <b>Pitch × aliasing:</b> high notes are the first to alias because their harmonics reach Nyquist soonest.</p>`));
  root.append(ask('At a 48 kHz sample rate, a 30 kHz tone is generated digitally without filtering. What do you hear?', ['Nothing — it is ultrasonic', 'An 18 kHz alias', 'A 30 kHz tone', 'A 60 kHz tone'], 1, 'It folds around Nyquist (24 kHz): 48 − 30 = 18 kHz.'));
} });

chapter({ id: 'drive', title: 'Distortion & saturation', min: 3,
  patch: { wave: 'sine', drive: 0.4, driveType: 'soft', aA: 0.01, aS: 1, aR: 0.2 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 12 · Shapers</div><h1>Distortion adds harmonics</h1>
  <p class="lede">A filter only removes. A distortion — any nonlinear transfer curve — <b>creates</b> frequencies that weren't there. Gentle saturation reads as warmth and density; heavy clipping as aggression. The <i>shape</i> of the curve decides which harmonics appear.</p>`));
  const r = rig({ notes: [45], droneLabel: 'Sine drone (A2)' });
  root.append(demo('Drive a pure sine',
    r.el, row(pk('Drive', 'drive', 0.01, 1, { fmt: pct })),
    seg([['soft', 'Soft clip (tube-ish)'], ['hard', 'Hard clip'], ['asym', 'Asymmetric'], ['fold', 'Wavefolder']], 'soft', (v) => P('driveType', v)),
    btns(hit('Show spectrum', () => setViz('spec')), hit('Show wave', () => setViz('scope')))));
  root.append(note('listen', `<p>With the Spectrum showing, raise Drive on <b>Soft clip</b>: lines appear at 3×, 5×, 7× — <b>odd</b> harmonics, because a symmetric curve flattens tops and bottoms equally (it squares the wave off). <b>Asymmetric</b> adds the <b>even</b> harmonics too (2×, 4×) — a smoother, "tube" warmth. <b>Hard clip</b> is brighter and buzzier. The <b>wavefolder</b> reflects the wave back on itself: a West-Coast synth sound with harmonics that dance as drive changes.</p>`));
  root.append(H(`<h2>Why power chords and distortion are friends</h2><p>Distort <b>two</b> notes together and you get more than each note's harmonics: the curve multiplies them, producing <b>intermodulation</b> — sum and difference tones. With a fifth (3:2) these land on the same harmonic series as the root. With a tempered major third they land between notes: mud.</p>`));
  const dy = (notes) => { stopAll(); const keep = patch; setPatch({ wave: 'triangle', aA: 0.01, aS: 1, aR: 0.3, level: 0.9 }); FX.busDrive = 0.75; applyFX(); setViz('spec'); const vs = notes.map((m) => noteOn(m, 0.85)); own(() => { vs.forEach((v) => v.release()); FX.busDrive = 0; applyFX(); }); patch = keep; };
  root.append(demo('Intermodulation: distort a dyad',
    btns(hit('Single note A2', () => dy([45])), hit('Fifth A2+E3 (power chord)', () => dy([45, 52])), hit('Major 3rd A2+C♯3', () => dy([45, 49])), hit('Minor 2nd', () => dy([45, 46])), hit('■ Stop', () => stopAll()))));
  root.append(note('listen', `<p>The power chord stays solid; its difference tone (165 − 110 = 55 Hz) is the root an octave down, so it even sounds bigger. The major third grows a gritty, out-of-tune undertow. That's why heavy guitar riffs live on fifths and octaves, and why distorted full chords get voiced carefully.</p>`));
  root.append(H(`<h2>Order matters: filter → drive vs drive → filter</h2>`));
  const r2 = rig({ notes: [45], pat: BASS, bpm: 118, droneLabel: 'Drone', loopLabel: 'Bass loop' });
  root.append(demo('Signal order',
    r2.el,
    btns(hit('Set up a resonant saw', () => { Object.assign(patch, { wave: 'sawtooth', cutoff: 700, res: 0.65, slope: 24, fEnv: 2.5, fD: 0.25, fS: 0.1, drive: 0.6, driveType: 'soft', aS: 0.8 }); r2.restart(); })),
    seg([['post', 'Filter → Drive'], ['pre', 'Drive → Filter']], 'post', (v) => { P('driveOrder', v); r2.restart(); })));
  root.append(note('listen', `<p>Press "Set up", then play the loop and flip the order. <b>Filter → Drive</b>: the resonant peak slams the distortion, which regenerates harmonics <i>above</i> the cutoff — aggressive, raspy. <b>Drive → Filter</b>: the filter removes the fizz the distortion made — smoother, darker, more controllable. Neither is right; they're different instruments.</p>`));
  root.append(note('ix', `<p><b>Drive × input level:</b> a nonlinearity responds to how hard it's hit — the same drive knob is cleaner on soft notes and dirtier on loud ones (roll back a guitar's volume to clean up an amp). <b>Drive × compression:</b> clipping caps peaks, so distortion <i>is</i> compression — sustain increases. <b>EQ before vs after:</b> boosting mids into a drive (Tube Screamer into an amp) changes <i>what</i> distorts; EQ after only changes the colour of the result.</p>`));
  root.append(note('gen', `<p>Overdrive (soft, often asymmetric), distortion (harder), fuzz (near-square), tape and console saturation (subtle soft clipping on mixes) are points on one continuum. Producers saturate bass so its upper harmonics carry it on small speakers.</p>`));
  root.append(ask('A symmetric soft clipper on a sine mainly adds…', ['Even harmonics', 'Odd harmonics', 'Noise', 'Subharmonics'], 1, 'Symmetric curves add odd harmonics; asymmetry is needed for even ones.'));
  root.append(ask('Why do distorted power chords sound cleaner than distorted major chords?', ['They are quieter', 'Intermodulation products of a fifth fall on the root\'s harmonic series', 'Distortion removes thirds', 'Fifths have fewer harmonics'], 1, 'Difference and sum tones of a 3:2 dyad reinforce the root; a tempered third\'s products fall between notes.'));
} });

chapter({ id: 'dyn', title: 'Dynamics: compression', min: 3,
  patch: { wave: 'sawtooth', cutoff: 500, res: 0.3, slope: 24, fEnv: 2.5, fD: 0.2, aA: 0.003, aD: 0.3, aS: 0.5, aR: 0.08, level: 0.8 },
  fx: { comp: 1, thr: -24, ratio: 4, att: 0.01, rel: 0.15, makeup: 6 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 13 · Dynamics</div><h1>Compressors turn loud parts down</h1>
  <p class="lede">A compressor watches the level. Above the <b>threshold</b>, it reduces gain by the <b>ratio</b> (4:1 = 4 dB in gives 1 dB out). <b>Attack</b> is how fast it clamps down, <b>release</b> how fast it lets go, and <b>makeup gain</b> raises everything back up. The result: smaller differences between loud and quiet — and a sound you can shape in time.</p>`));
  const meter = E('div', { style: 'height:10px;border-radius:5px;background:var(--panel3);overflow:hidden;margin:6px 0' }, E('i', { style: 'display:block;height:100%;width:0;background:var(--hard);float:right;transition:width .05s' }));
  const grTxt = E('div', { class: 'readout' });
  let raf = 0; const tick = () => { raf = requestAnimationFrame(tick); if (!ctx) return; const r2 = A.comp.reduction; const v = typeof r2 === 'number' ? r2 : (r2 && r2.value) || 0; meter.firstChild.style.width = clamp(-v / 24 * 100, 0, 100) + '%'; grTxt.textContent = FX.comp ? `gain reduction ${v.toFixed(1)} dB` : 'compressor bypassed'; };
  tick(); own(() => cancelAnimationFrame(raf));
  const s = { thr: fk('Threshold', 'thr', -60, 0, { step: 1, fmt: (v) => v + ' dB' }), ratio: fk('Ratio', 'ratio', 1, 20, { step: 0.5, fmt: (v) => v + ':1' }),
    att: fk('Attack', 'att', 0.0002, 0.2, { log: true, fmt: (v) => v < 0.001 ? (v * 1000).toFixed(1) + ' ms' : fmtS(v) }), rel: fk('Release', 'rel', 0.01, 1, { log: true, fmt: fmtS }), mk: fk('Makeup', 'makeup', 0, 24, { step: 0.5, fmt: (v) => '+' + v + ' dB' }) };
  const onoff = toggle('Compressor on', true, (v) => fx('comp', v ? 1 : 0));
  const pre = (o) => { Object.assign(FX, o, { comp: 1 }); applyFX(); onoff.set(true); s.thr.set(FX.thr); s.ratio.set(FX.ratio); s.att.set(FX.att); s.rel.set(FX.rel); s.mk.set(FX.makeup); };
  root.append(demo('Compressor on a drum + bass loop',
    btns(player('Play loop', () => seqStart(DRUMBASS, { bpm: 104 })), onoff),
    meter, grTxt, row(s.thr, s.ratio), row(s.att, s.rel), row(s.mk),
    btns(hit('Gentle glue', () => pre({ thr: -18, ratio: 2, att: 0.03, rel: 0.2, makeup: 3 })), hit('Punch (slow attack)', () => pre({ thr: -32, ratio: 6, att: 0.04, rel: 0.1, makeup: 8 })),
      hit('Squash (fast attack)', () => pre({ thr: -38, ratio: 12, att: 0.0003, rel: 0.06, makeup: 14 })), hit('Pumping (slow release)', () => pre({ thr: -42, ratio: 10, att: 0.003, rel: 0.6, makeup: 14 })))));
  root.append(note('listen', `<p>Toggle the compressor and <b>level-match by ear with Makeup</b> — otherwise "on" wins just by being louder (Chapter 15). <b>Punch</b>: the slow attack lets each drum's first few milliseconds through before clamping, so hits snap. <b>Squash</b>: the fast attack shaves transients off — flatter, denser, smaller. <b>Pumping</b>: the slow release means the level is still recovering when the next kick arrives; you hear the whole mix breathe.</p>`));
  root.append(H(`<h2>Sidechain: one sound controls another</h2><p>Feed a compressor's detector from the kick while it compresses a pad, and the pad ducks on every beat — the pulsing pump of house and EDM, and a mixing trick for making room for the kick.</p>`));
  root.append(demo('Sidechain ducking',
    btns(player('Play pad + kick', () => { setPatch({ wave: 'sawtooth', uni: 5, spread: 16, width: 0.9, cutoff: 2200, aA: 0.3, aS: 0.9, aR: 1, level: 0.9 }); seqStart([...FOUR, ...CHORDS], { bpm: 120, len: 64 }); })),
    row(fk('Duck depth', 'duck', 0, 1, { fmt: pct }), fk('Duck release', 'duckRel', 0.05, 0.6, { log: true, fmt: fmtS }))));
  root.append(note('ix', `<p><b>Threshold × input level:</b> turn up what feeds a compressor and it compresses more — that's why gain staging matters. <b>Attack × transient length:</b> attack slower than the transient = punch; faster = smooth. <b>Release × tempo:</b> release near the beat interval makes groove-locked pumping; too long and it never recovers. <b>Compressor × drive:</b> compress before distortion for even, sustained clipping; after, to tame its peaks.</p>`));
  root.append(note('gen', `<p>Guitar compressors give sustain and even out picking (country chicken-pickin' lives on them). Streaming services normalise loudness (Spotify and YouTube aim around −14 LUFS), so squashing a master to win the loudness war just costs punch. The real goal is <b>crest factor</b> — the gap between peaks and average — chosen on purpose.</p>`));
  root.append(ask('You want drums to hit harder, not flatter. Which attack setting helps?', ['Very fast (under 1 ms)', 'Slower (tens of ms) so the transient passes before gain reduction', 'Attack does not matter', 'Infinite'], 1, 'A slower attack lets the initial transient through, exaggerating it relative to the compressed tail.'));
} });

chapter({ id: 'space', title: 'Space: delay & reverb', min: 3,
  patch: { wave: 'sawtooth', uni: 2, spread: 8, cutoff: 600, res: 0.2, slope: 24, fEnv: 3.5, fD: 0.18, fS: 0, aA: 0.002, aD: 0.4, aS: 0, aR: 0.3, key: 0.5 },
  fx: { dMix: 0.35, dSync: 0.75, dFb: 0.45, dTone: 3500, dMode: 'pp', rMix: 0.15, rDecay: 2.2 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 14 · Space</div><h1>Delayed copies create space</h1>
  <p class="lede">Every room returns your sound as thousands of delayed, filtered copies. A few distinct copies we hear as <b>echo</b>; very short ones fuse into <b>width</b> and <b>colour</b>; a dense, decaying cloud is <b>reverb</b>. It's all delay.</p>`));
  const tsel = seg([[0, 'Free'], [1, '1/4'], [0.75, 'Dotted 1/8'], [0.5, '1/8'], [1 / 3, '1/8 triplet']], 0.75, (v) => fx('dSync', v));
  root.append(demo('Delay',
    btns(player('Play sparse plucks (100 BPM)', () => seqStart(SPARSE, { bpm: 100 }))),
    row(fk('Mix', 'dMix', 0, 1, { fmt: pct }), fk('Time (when Free)', 'dTime', 0.02, 1.2, { log: true, fmt: fmtS, on: () => { fx('dSync', 0); tsel.set(0); } })),
    tsel,
    row(fk('Feedback', 'dFb', 0, 0.92, { fmt: pct }), fk('Repeat tone (lowpass)', 'dTone', 400, 18000, { log: true, fmt: fmtHz })),
    seg([['pp', 'Ping-pong'], ['mono', 'Mono']], 'pp', (v) => fx('dMode', v))));
  root.append(note('listen', `<p><b>Dotted 1/8</b> fills the gaps between notes with a galloping rhythm (The Edge's signature). Raise <b>Feedback</b> for more repeats; lower <b>Repeat tone</b> so each echo is darker than the last — the tape/analog sound, which also tucks echoes <i>behind</i> the dry signal. Set Time to ~100 ms Free with low feedback: <b>slapback</b>, the rockabilly vocal and guitar sound.</p>`));
  // Haas
  let hz = { ms: 12 };
  const haasHit = () => { const c = ac(), t = c.currentTime + 0.01; const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = 392; const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.002); g.gain.setTargetAtTime(0, t + 0.002, 0.07);
    const n = c.createBufferSource(); n.buffer = makeNoise('white'); const ng = c.createGain(); ng.gain.setValueAtTime(0.25, t); ng.gain.setTargetAtTime(0, t, 0.006);
    const mono = c.createGain(); o.connect(g).connect(mono); n.connect(ng).connect(mono);
    const d = c.createDelay(0.2); d.delayTime.value = hz.ms / 1000; const mg = c.createChannelMerger(2); mono.connect(mg, 0, 0); mono.connect(d).connect(mg, 0, 1); mg.connect(A.clean);
    o.start(t); o.stop(t + 0.6); n.start(t); n.stop(t + 0.1); };
  root.append(demo('Haas effect (use headphones)',
    btns(player('Repeat hits', () => { haasHit(); const id = setInterval(haasHit, 700); own(() => clearInterval(id)); })),
    row(slider({ label: 'Right channel delay', min: 0, max: 80, step: 0.5, value: hz.ms, fmt: (v) => v + ' ms', on: (v) => { hz.ms = v; } }))));
  root.append(note('phys', `<p>The <b>precedence effect</b>: below ~1 ms of offset, the image shifts toward the earlier ear. From ~1 to ~30 ms, you hear <i>one</i> sound, located on the earlier side, but wider. Past ~35–40 ms, it splits into a distinct echo. Mixers use 10–25 ms offsets to widen mono sources — and in mono those same offsets become comb filters (try the MONO button).</p>`));
  // reverb
  const rv = { mix: fk('Mix', 'rMix', 0, 1, { fmt: pct }), dec: fk('Decay (RT60)', 'rDecay', 0.3, 8, { log: true, fmt: fmtS }), pre: fk('Pre-delay', 'rPre', 0, 0.15, { step: 0.001, fmt: fmtS }), damp: fk('Damping', 'rDamp', 0, 1, { fmt: pct }), low: fk('Low cut on reverb', 'rLow', 20, 800, { log: true, fmt: fmtHz }) };
  const rpre = (o) => { Object.assign(FX, o); applyFX(); rv.mix.set(FX.rMix); rv.dec.set(FX.rDecay); rv.pre.set(FX.rPre); rv.damp.set(FX.rDamp); rv.low.set(FX.rLow); };
  root.append(demo('Reverb',
    btns(player('Play chords', () => { FX.dMix = 0; applyFX(); setPatch({ wave: 'sawtooth', uni: 3, spread: 10, cutoff: 1800, aA: 0.02, aD: 0.6, aS: 0.5, aR: 0.4 }); seqStart(STABS, { bpm: 96 }); }), player('Play drums + bass', () => { FX.dMix = 0; applyFX(); setPatch(CH[cur].patch); seqStart(DRUMBASS, { bpm: 104 }); })),
    row(rv.mix, rv.dec), row(rv.pre, rv.damp), row(rv.low),
    btns(hit('Small room', () => rpre({ rMix: 0.3, rDecay: 0.6, rPre: 0.004, rDamp: 0.6, rLow: 150 })), hit('Hall', () => rpre({ rMix: 0.35, rDecay: 2.8, rPre: 0.03, rDamp: 0.5, rLow: 200 })),
      hit('Cathedral', () => rpre({ rMix: 0.45, rDecay: 6.5, rPre: 0.06, rDamp: 0.35, rLow: 150 })), hit('Bright plate', () => rpre({ rMix: 0.35, rDecay: 1.8, rPre: 0, rDamp: 0.1, rLow: 300 })), hit('Mud (no low cut)', () => rpre({ rMix: 0.6, rDecay: 4, rPre: 0, rDamp: 0.2, rLow: 20 })))));
  root.append(note('listen', `<p><b>Decay</b> is room size and hardness. <b>Pre-delay</b> is the gap before the reverb starts: 20–60 ms keeps the dry sound clear in front of the tail, like a big hall. <b>Damping</b> models air and soft surfaces absorbing highs. Load <b>Mud</b> on the drum+bass loop, then raise the <b>Low cut</b> to ~250 Hz: the bass stops smearing.</p>`));
  root.append(note('ix', `<p><b>Decay × tempo:</b> a tail longer than the gap between notes blurs the music; fast parts need short or ducked reverbs. <b>Reverb × low end:</b> bass energy lingering in a reverb muddies everything — high-pass the send. <b>Pre-delay × clarity</b>, <b>feedback × repeat tone</b> (dark repeats can feed back longer without clutter), and <b>delay time × tempo</b> (synced delays become part of the groove).</p>`));
  root.append(note('gen', `<p>A guitar amp's spring reverb, a room mic, an algorithmic hall plugin and a convolution reverb (a recorded room's impulse response — exactly what this course generates synthetically) all answer one question: how many copies, how late, how filtered.</p>`));
  root.append(ask('What does reverb pre-delay mainly do?', ['Changes the room size', 'Separates the dry sound from the reverb tail for clarity', 'Removes low frequencies', 'Adds modulation'], 1, 'A short gap before the tail lets the direct sound read clearly, while still sounding like a big space.'));
} });

chapter({ id: 'psycho', title: 'Psychoacoustics', min: 3, patch: { wave: 'sine', fmRatio: 1, fmIndex: 1.8, fmDecay: 0.8, aD: 1.5, aS: 0.2, aR: 0.5 }, build(root) {
  root.append(H(`<div class="kicker">Chapter 15 · The listener</div><h1>Your ears are not a measuring device</h1>
  <p class="lede">Everything so far was physics. What you <i>perceive</i> is physics filtered by an ear and a brain with strong, predictable biases. Knowing them stops you being fooled — and lets you exploit them.</p>`));
  root.append(H(`<h2>1 · Equal loudness</h2><p>These five sines are played at <b>exactly the same level</b>. Listen to how loud each sounds.</p>`));
  root.append(demo('Same level, different loudness',
    btns(hit('▶ 50 Hz · 100 Hz · 1 kHz · 3.5 kHz · 12 kHz', () => { stopAll(); setViz('spec'); const t = now() + 0.05; [50, 100, 1000, 3500, 12000].forEach((f, i) => tone({ f, level: 0.12, t: t + i * 1.1, dur: 0.9 })); }))));
  root.append(note('phys', `<p>Hearing is most sensitive around <b>2–5 kHz</b> (the ear canal resonates there) and much less sensitive in the bass, especially at low volumes — the equal-loudness (Fletcher–Munson, ISO 226) curves. So turning music up seems to add bass and treble. (On small speakers the 50 Hz tone may be silent for a different reason: the speaker can't move enough air.)</p>`));
  // A/B trap
  root.append(H(`<h2>2 · The louder-is-better trap</h2><p>Two takes of the same phrase. Which sounds <b>better</b>?</p>`));
  let louder = Math.random() < 0.5 ? 'A' : 'B';
  const res = E('div', { class: 'ask-why' });
  const phrase = (which) => { stopAll(); const keep = patch; setPatch({ ...CH[cur].patch, level: which === louder ? 1.19 : 1 }); const t = now() + 0.05; [[57, 61, 64], [54, 57, 61]].forEach((ch, i) => ch.forEach((m) => noteOn(m, 0.8, t + i * 0.8).release(t + i * 0.8 + 0.7))); patch = keep; };
  const pick = (w) => { res.innerHTML = `${louder} was <b>1.5 dB louder</b> — otherwise identical. ${w === louder ? 'You chose the louder one, like most listeners do.' : 'You resisted the louder one — nicely done.'} Small level increases are heard as "fuller, clearer, better", not as "louder". <b>Always level-match before comparing</b> pedals, amps, plugins, mixes.`; };
  root.append(demo('Blind A/B',
    btns(hit('▶ A', () => phrase('A')), hit('▶ B', () => phrase('B')), hit('A is better', () => pick('A')), hit('B is better', () => pick('B')), hit('New trial', () => { louder = Math.random() < 0.5 ? 'A' : 'B'; res.textContent = 'Reshuffled.'; })), res));
  // masking
  root.append(H(`<h2>3 · Masking</h2><p>A loud sound hides quieter sounds near it in frequency. Here a 1 kHz beep sits under a band of noise you can move.</p>`));
  const mk = { c: 300, lvl: 0.25, beep: -32 }; let mn = null;
  const startMask = () => { const c = ac(); const s = c.createBufferSource(); s.buffer = makeNoise('white'); s.loop = true; const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.value = mk.c; const g = c.createGain(); g.gain.value = mk.lvl; s.connect(bp).connect(g).connect(A.clean); s.start(); mn = { bp, g };
    const beep = () => tone({ f: 1000, level: Math.pow(10, mk.beep / 20), dur: 0.18 }); beep(); const id = setInterval(beep, 600); setViz('spec');
    own(() => { clearInterval(id); g.gain.setTargetAtTime(0, ctx.currentTime, 0.02); s.stop(ctx.currentTime + 0.1); mn = null; }); };
  root.append(demo('Masking',
    btns(player('Play beep + noise', startMask)),
    row(slider({ label: 'Noise band centre', min: 150, max: 6000, log: true, value: mk.c, fmt: fmtHz, on: (v) => { mk.c = v; if (mn) mn.bp.frequency.setTargetAtTime(v, now(), 0.03); } }),
      slider({ label: 'Beep level', min: -50, max: -14, step: 1, value: mk.beep, fmt: (v) => v + ' dB', on: (v) => { mk.beep = v; } }))));
  root.append(note('listen', `<p>Sweep the noise band toward 1 kHz: the beep vanishes even though it's still there (you can see it on the spectrum). Move the band well above or below and it pops back. Masking spreads more <i>upward</i> than downward, so bass instruments mask more than they are masked. Mixing EQ is largely about un-masking: carve a little room for each part.</p>`));
  // missing fundamental
  root.append(H(`<h2>4 · The missing fundamental</h2>`));
  let mf = null, withF = false;
  const mfStart = () => { mf = tone({ f: 100, harm: withF ? [0.6, 0.6, 0.5, 0.4, 0.3, 0.25] : [0, 0.6, 0.5, 0.4, 0.3, 0.25], level: 0.25 }); setViz('spec'); };
  root.append(demo('Pitch without the fundamental',
    btns(player('Play harmonics 2–6 of 100 Hz', mfStart), toggle('Add the 100 Hz fundamental', false, (v) => { withF = v; if (mf) { mf.stop(); mfStart(); } }))));
  root.append(note('listen', `<p>There is no energy at 100 Hz, yet the pitch is 100 Hz — your brain reads the 100 Hz <i>spacing</i> between harmonics. Adding the real fundamental changes the weight, not the pitch. Try it on a phone speaker: this is how laptops and earbuds suggest bass they can't reproduce, and why saturating a bass helps it translate.</p>`));
  // roughness
  root.append(H(`<h2>5 · Beating, roughness, two tones</h2>`));
  let rp = null; const rr = { d: 4 }; const rTxt = E('div', { class: 'readout' });
  const rUpd = () => { const d = rr.d; rTxt.textContent = `${d.toFixed(1)} Hz apart → ${d < 15 ? 'beating: one pulsing tone' : d < 70 ? 'roughness: buzzy, dissonant' : d < 110 ? 'emerging into two tones (edge of the critical band)' : 'two smooth, separate tones'}`; if (rp) rp.b.o.frequency.setTargetAtTime(440 + d, now(), 0.02); };
  root.append(demo('Two sines near 440 Hz',
    btns(player('Play', () => { rp = { a: tone({ f: 440, level: 0.12 }), b: tone({ f: 440 + rr.d, level: 0.12 }) }; setViz('scope'); })),
    row(slider({ label: 'Separation', min: 0.5, max: 250, log: true, value: rr.d, fmt: (v) => v.toFixed(1) + ' Hz', on: (v) => { rr.d = v; rUpd(); } })), rTxt));
  rUpd();
  root.append(note('phys', `<p>The inner ear analyses sound in overlapping <b>critical bands</b> (roughly 100 Hz wide at low frequencies, ~15–20% of the frequency higher up). Two tones in the same band interfere: slow beating, then roughness. Once they're in separate bands they're heard as two notes. This is the physiological root of dissonance — and why close-voiced chords are muddy down low but fine up high.</p>`));
  root.append(ask('You compare two overdrive pedals; one is 1 dB louder. What should you do first?', ['Pick the louder one', 'Level-match them', 'Add reverb', 'Compare in mono'], 1, 'Tiny level differences masquerade as quality differences. Match levels, then judge.'));
  root.append(ask('Why can a bass line still be "heard" on a phone speaker that cannot reproduce 60 Hz?', ['Phones boost bass', 'The brain infers the fundamental from the harmonics', 'Masking', 'Aliasing'], 1, 'The missing-fundamental effect — which is why producers add harmonics to bass.'));
} });

/* ---------- recipes ---------- */
const RECIPES = [
  { name: 'Sub bass', p: { wave: 'sine', oct: -1, aA: 0.005, aD: 0.2, aS: 1, aR: 0.08, drive: 0.15 }, pat: 'bass', why: 'A pure <b>sine</b> one octave down, mono, short release. A little <b>soft drive</b> adds 2nd/3rd harmonics so small speakers imply the low note (missing fundamental).' },
  { name: 'Acid bass', p: { wave: 'sawtooth', cutoff: 230, res: 0.7, slope: 24, fEnv: 4.2, fD: 0.2, fS: 0, velF: 0.8, aA: 0.002, aD: 0.3, aS: 0.7, aR: 0.06, drive: 0.35 }, fx: { dMix: 0.15, dSync: 0.75, dFb: 0.3 }, pat: 'bass', why: '<b>Saw</b> → resonant <b>24 dB lowpass</b> with a low cutoff, big <b>filter envelope</b>, short decay, and <b>velocity → filter</b> so accents squelch. Drive after the filter for bite.' },
  { name: 'Reese bass', p: { wave: 'sawtooth', uni: 2, spread: 18, width: 0.3, cutoff: 650, slope: 24, res: 0.2, aA: 0.01, aS: 1, aR: 0.15, lfoDest: 'cutoff', lfoDepth: 0.12, drive: 0.25 }, fx: { lfoRate: 0.3 }, pat: 'long', why: 'Two <b>detuned saws</b> beating slowly against each other, lowpassed. The beating <i>is</i> the sound. A slow LFO on cutoff adds motion. Drum & bass staple.' },
  { name: 'Pluck', p: { wave: 'sawtooth', uni: 3, spread: 10, width: 0.7, cutoff: 380, res: 0.25, slope: 24, fEnv: 5, fD: 0.14, fS: 0, aA: 0.002, aD: 0.45, aS: 0, aR: 0.3, key: 0.5 }, fx: { dMix: 0.3, dSync: 0.75, dFb: 0.4, dTone: 3000, rMix: 0.2 }, pat: 'arp', why: 'Sustain at 0 on both envelopes: a short <b>filter envelope</b> gives the "pick" and the decay does the rest. A dotted-1/8 <b>delay</b> fills the space.' },
  { name: 'Warm pad', p: { wave: 'sawtooth', uni: 5, spread: 15, width: 1, cutoff: 1400, res: 0.15, aA: 1.2, aD: 1, aS: 0.85, aR: 2.5, lfoDest: 'cutoff', lfoDepth: 0.15 }, fx: { lfoRate: 0.15, chorus: 0.45, rMix: 0.45, rDecay: 4.5, rPre: 0.03 }, pat: 'chords', why: '<b>Slow attack and long release</b> make it swell and linger; <b>unison + chorus</b> make it wide; a slow <b>LFO on cutoff</b> keeps it alive; big <b>reverb</b> sets it far away.' },
  { name: 'Brass stab', p: { wave: 'sawtooth', uni: 2, spread: 7, cutoff: 550, slope: 24, fEnv: 2.6, fA: 0.07, fD: 0.35, fS: 0.5, aA: 0.04, aD: 0.3, aS: 0.85, aR: 0.15, pitchEnv: -0.3, pitchDecay: 0.08 }, fx: { rMix: 0.2 }, pat: 'stabs', why: 'Brass gets brighter as it gets louder: a filter envelope with a <b>slight attack</b> (~70 ms) "blooms". A tiny <b>pitch scoop</b> from below adds realism.' },
  { name: 'FM bell', p: { wave: 'sine', fmRatio: 3.5, fmIndex: 4, fmDecay: 2.5, fmSus: 0.2, aA: 0.002, aD: 4, aS: 0, aR: 2.5 }, fx: { rMix: 0.35, rDecay: 3.5 }, pat: 'melody', why: '<b>Inharmonic ratio</b> (3.5) for metal, high <b>index</b> for brightness, and an <b>index decay</b> so the clang fades into a purer hum, like a real bell.' },
  { name: 'FM e-piano', p: { wave: 'sine', fmRatio: 1, fmIndex: 2.4, fmDecay: 0.9, fmSus: 0.1, aA: 0.002, aD: 2.2, aS: 0, aR: 0.5, vel: 0.8 }, fx: { chorus: 0.35, rMix: 0.15 }, pat: 'stabs', why: '<b>1:1 ratio</b> keeps it harmonic; the <b>index envelope</b> makes the bark on the attack. Chorus is the classic 80s polish.' },
  { name: 'Supersaw lead', p: { wave: 'sawtooth', uni: 7, spread: 22, width: 1, cutoff: 5500, slope: 12, aA: 0.01, aS: 0.9, aR: 0.35, lfoDest: 'pitch', lfoDepth: 0.06 }, fx: { lfoRate: 5.5, dMix: 0.25, dSync: 0.5, dFb: 0.35, rMix: 0.3, rDecay: 3 }, pat: 'melody', why: '<b>Seven detuned saws</b> spread wide, gentle vibrato, delay + reverb. Check it in MONO: this is the patch that collapses most.' },
  { name: 'Wobble bass', p: { wave: 'sawtooth', uni: 2, spread: 8, cutoff: 280, res: 0.55, slope: 24, aA: 0.005, aS: 1, aR: 0.1, lfoDest: 'cutoff', lfoDepth: 0.55, drive: 0.45, sub: 0.6 }, fx: { lfoSync: 0.5, lfoShape: 'sine' }, pat: 'long', why: 'A <b>tempo-synced LFO</b> (1/8) on a resonant lowpass, distorted after the filter. A clean <b>sub</b> holds the low end steady while the top moves.' },
  { name: 'Kick', p: { wave: 'sine', oct: -1, pitchEnv: 30, pitchDecay: 0.06, aA: 0.001, aD: 0.4, aS: 0, aR: 0.1, drive: 0.2 }, pat: 'kick', why: 'A kick drum is a <b>sine with a very fast pitch envelope</b> (here starting 30 semitones up, falling in ~60 ms) and a short amp decay. The pitch drop is the "thud"; drive adds click.' },
  { name: 'Snare', p: { wave: 'triangle', noise: 1.6, fType: 'highpass', cutoff: 250, aA: 0.001, aD: 0.18, aS: 0, aR: 0.1, pitchEnv: 3, pitchDecay: 0.03 }, pat: 'snare', why: 'A short <b>tone</b> (the drum shell, ~180 Hz) plus <b>noise</b> (the snares), highpassed, with a fast decay. Balance tone vs noise for fat vs crisp.' },
  { name: 'Hi-hat', p: { wave: 'noise', fType: 'highpass', cutoff: 7500, res: 0.2, aA: 0.001, aD: 0.05, aS: 0, aR: 0.04 }, pat: 'hats', why: '<b>White noise</b>, <b>highpassed</b> hard, with a very short decay. Longer decay = open hat. Metallic hats add inharmonic square waves (TR-808 used six).' },
  { name: 'Wind', p: { wave: 'noise', noiseColor: 'pink', fType: 'bandpass', cutoff: 700, res: 0.75, aA: 1.5, aS: 1, aR: 2, lfoDest: 'cutoff', lfoDepth: 0.35 }, fx: { lfoShape: 'random', lfoRate: 1.2, rMix: 0.4, rDecay: 5 }, pat: 'drone', why: '<b>Pink noise</b> through a resonant <b>bandpass</b>, with a slow random LFO moving the centre: gusts. Pure source + shaper + modulator, no pitch at all.' },
];
const RPAT = {
  bass: [BASS, 118, 16], arp: [ARP, 112, 16], chords: [CHORDS, 100, 64], stabs: [STABS, 104, 16], melody: [MELODY, 100, 32],
  long: [[{ s: 0, n: 33, d: 7 }, { s: 8, n: 33, d: 3 }, { s: 12, n: 36, d: 3 }], 140, 16],
  kick: [[0, 4, 8, 12].map((s) => ({ s, n: 33, d: 2 })), 120, 16], snare: [[4, 12].map((s) => ({ s, n: 54, d: 2 })), 120, 16],
  hats: [[0, 2, 4, 6, 8, 10, 12, 14].map((s) => ({ s, n: 60, d: 1, v: s % 4 ? 0.6 : 1 })), 120, 16], drone: [[{ s: 0, n: 57, d: 30 }], 60, 32],
};
function loadRecipe(r) { setPatch(r.p); setFX(r.fx); }
function playRecipe(r) { stopAll(); loadRecipe(r); const [pat, bpm, len] = RPAT[r.pat]; seqStart(pat, { bpm, len }); }

/* ---------- playground ---------- */
function explainPatch(p, f) {
  const out = [];
  const W = { sine: 'a pure sine (fundamental only)', triangle: 'a soft triangle (odd harmonics, falling fast)', sawtooth: 'a bright saw (all harmonics)', square: 'a hollow square (odd harmonics)', pulse: `a ${Math.round(p.pw * 100)}% pulse`, noise: `${p.noiseColor} noise (no pitch)`, custom: 'a custom additive wave' };
  let s = `<b>Source:</b> ${W[p.wave] || p.wave}`;
  if (p.uni > 1 && p.wave !== 'noise') s += `, ${p.uni} unison voices ±${p.spread}¢ (${p.width > 0.6 ? 'wide' : 'narrow'})`;
  if (p.fmIndex > 0 && p.wave !== 'noise') s += `, FM at ratio ${p.fmRatio} index ${p.fmIndex}${Math.abs(p.fmRatio - Math.round(p.fmRatio)) > 0.02 && Math.abs(p.fmRatio * 2 - Math.round(p.fmRatio * 2)) > 0.02 ? ' (inharmonic → metallic)' : ''}${p.fmDecay ? ', index decaying over ' + fmtS(p.fmDecay) : ''}`;
  if (p.sub) s += ', plus a sine sub an octave down'; if (p.noise) s += ', plus noise';
  out.push(s + '.');
  const FT = { lowpass: 'lowpass', highpass: 'highpass', bandpass: 'bandpass', notch: 'notch' };
  s = `<b>Filter:</b> ${p.slope} dB/oct ${FT[p.fType]} at ${fmtHz(p.cutoff)}`;
  if (p.res > 0.6) s += ', strong resonance (vocal peak)'; else if (p.res > 0.25) s += ', some resonance';
  if (p.key > 0.2) s += `, ${Math.round(p.key * 100)}% keytracking`;
  if (p.fEnv) s += `; the envelope sweeps it ${p.fEnv > 0 ? 'up' : 'down'} ${Math.abs(p.fEnv).toFixed(1)} octaves to ~${fmtHz(clamp(p.cutoff * Math.pow(2, p.fEnv), 20, 20000))} and back over ${fmtS(p.fD)}`;
  out.push(s + '.');
  const kind = p.aA > 0.3 ? 'a slow swell (pad-like)' : p.aS < 0.12 ? 'percussive: it decays even while held (pluck)' : p.aS > 0.9 && p.aR < 0.1 ? 'organ-like: on/off' : 'a sustaining note';
  out.push(`<b>Amp envelope:</b> ${kind}, release ${fmtS(p.aR)}.`);
  if (p.lfoDest !== 'none' && p.lfoDepth > 0) out.push(`<b>LFO:</b> ${f.lfoShape} at ${f.lfoSync ? 'tempo-synced' : f.lfoRate.toFixed(2) + ' Hz'} on ${({ pitch: 'pitch (vibrato)', amp: 'volume (tremolo)', cutoff: 'cutoff (wah/wobble)', pan: 'pan', pw: 'pulse width (PWM)' })[p.lfoDest]}, depth ${pct(p.lfoDepth)}.`);
  if (p.drive) out.push(`<b>Drive:</b> ${p.driveType} at ${pct(p.drive)}, ${p.driveOrder === 'pre' ? 'before' : 'after'} the filter.`);
  const sp = []; if (f.chorus) sp.push('chorus'); if (f.dMix) sp.push(`${f.dSync ? 'synced' : fmtS(f.dTime)} delay`); if (f.rMix) sp.push(`${fmtS(f.rDecay)} reverb`); if (f.comp) sp.push('compression'); if (f.crushMix) sp.push('bitcrushing');
  if (sp.length) out.push(`<b>Effects:</b> ${sp.join(', ')}.`);
  const warn = [];
  if (p.fEnv > 0 && p.cutoff * Math.pow(2, p.fEnv) > 20000) warn.push('the filter envelope hits the 20 kHz ceiling — lower the cutoff or the amount to hear the sweep');
  if (p.wave === 'sine' && p.fType === 'lowpass' && !p.fmIndex && !p.drive) warn.push('a sine has nothing for a lowpass to remove');
  if (p.uni > 3 && p.width > 0.7) warn.push('wide unison — check it in MONO');
  if (f.rMix > 0.3 && f.rDecay > 3.5) warn.push('long, loud reverb will blur fast notes');
  if (p.res > 0.6 && p.drive > 0.4 && p.driveOrder !== 'pre') warn.push('resonance into drive: expect aggressive, raspy peaks');
  if (p.aA > 0.3 && p.fEnv && p.fA < 0.05) warn.push('the filter envelope finishes before the slow amp attack lets you hear it');
  if (warn.length) out.push(`<b>Interactions to watch:</b> ${warn.join('; ')}.`);
  return out.map((x) => `<p>${x}</p>`).join('');
}

chapter({ id: 'play', title: 'Playground', min: 0, build(root) {

  root.append(demo('Filter',

    row(pk('Cutoff', 'cutoff', 40, 18000, { log: true, fmt: fmtHz }), pk('Resonance', 'res', 0, 1, { fmt: pct })),
    row(pk('Keytrack', 'key', 0, 1, { fmt: pct }), pk('Env amount', 'fEnv', -4, 7, { step: 0.1, fmt: (v) => (v > 0 ? '+' : '') + v.toFixed(1) + ' oct' })),
    row(pk('Velocity → filter', 'velF', 0, 1, { fmt: pct }), E('div', { class: 'sl' }, E('div', { class: 'sl-top' }, E('span', {}, 'Slope')), seg([[12, '12 dB'], [24, '24 dB']], patch.slope, (v) => { patch.slope = v; restart(); })))));
  const envs = (pre, label) => demo(label,
    row(pk('Attack', pre + 'A', 0.001, 3, { log: true, fmt: fmtS }), pk('Decay', pre + 'D', 0.01, 3, { log: true, fmt: fmtS })),
    row(pk('Sustain', pre + 'S', 0, 1, { fmt: pct }), pk('Release', pre + 'R', 0.01, 5, { log: true, fmt: fmtS })));
  root.append(envs('a', 'Amp envelope'), envs('f', 'Filter envelope'));
  root.append(demo('LFO',
    seg([['none', 'Off'], ['pitch', 'Pitch'], ['amp', 'Volume'], ['cutoff', 'Cutoff'], ['pan', 'Pan'], ['pw', 'PW']], patch.lfoDest, (v) => { if (v === 'pw' && patch.wave !== 'pulse') patch.wave = 'pulse'; P('lfoDest', v); restart(); }),
    seg([['sine', 'Sine'], ['triangle', 'Tri'], ['ramp', 'Ramp'], ['saw', 'Saw'], ['square', 'Square'], ['random', 'S&H']], FX.lfoShape, (v) => fx('lfoShape', v)),

    row(fk('Reverb decay', 'rDecay', 0.3, 8, { log: true, fmt: fmtS }), fk('Reverb damping', 'rDamp', 0, 1, { fmt: pct })),
    row(fk('Crush: bits', 'crushBits', 1, 16, { step: 1, fmt: (v) => v + ' bit', on: () => fx('crushMix', FX.crushBits < 16 || FX.crushDown > 1 ? 1 : 0) }), fk('Crush: downsample', 'crushDown', 1, 32, { step: 0.5, fmt: (v) => '÷' + v, on: () => fx('crushMix', FX.crushBits < 16 || FX.crushDown > 1 ? 1 : 0) })),
    btns(toggle('Compressor', !!FX.comp, (v) => fx('comp', v ? 1 : 0))),
    row(fk('Comp threshold', 'thr', -60, 0, { step: 1, fmt: (v) => v + ' dB' }), fk('Comp ratio', 'ratio', 1, 20, { step: 0.5, fmt: (v) => v + ':1' }))));
  root.append(note('gen', `<p>Challenges: make a sound that is bright but not loud. Make the same patch sound near, then far, using only effects. Make a bass that works on a phone speaker. Make a pad that collapses badly in MONO, then fix it.</p>`, '🎯 Try this'));
} });
function randomPatch() {
  const R = (a, b) => a + Math.random() * (b - a), pickR = (xs) => xs[Math.floor(Math.random() * xs.length)], logR = (a, b) => a * Math.pow(b / a, Math.random());
  const perc = Math.random() < 0.5;
  const p = { ...DEF, wave: pickR(['sawtooth', 'sawtooth', 'square', 'pulse', 'triangle', 'sine']), pw: R(0.1, 0.5), uni: pickR([1, 1, 2, 3, 5, 7]), spread: R(4, 25), width: R(0, 1),
    cutoff: logR(150, 5000), res: R(0, 0.75), slope: pickR([12, 24]), key: R(0, 0.8), fEnv: R(-1, 5), fD: logR(0.05, 1.5), fS: R(0, 0.5),
    aA: perc ? 0.003 : logR(0.003, 1.5), aD: logR(0.1, 1.5), aS: perc ? 0 : R(0.4, 1), aR: logR(0.05, 2),
    lfoDest: pickR(['none', 'none', 'pitch', 'cutoff', 'amp', 'pan']), lfoDepth: R(0.05, 0.4), drive: Math.random() < 0.4 ? R(0.1, 0.7) : 0,
    fmIndex: Math.random() < 0.25 ? R(0.5, 5) : 0, fmRatio: pickR([1, 2, 3, 0.5, 1.414, 3.5]), sub: Math.random() < 0.3 ? R(0.2, 0.7) : 0 };
  if (p.lfoDest === 'pitch') p.lfoDepth = R(0.02, 0.12);
  const f = { ...FXDEF, lfoRate: logR(0.1, 8), lfoShape: pickR(['sine', 'triangle', 'square', 'random']), chorus: Math.random() < 0.4 ? R(0.2, 0.6) : 0,
    dMix: Math.random() < 0.5 ? R(0.1, 0.4) : 0, dSync: pickR([0.75, 0.5, 1]), dFb: R(0.2, 0.6), dTone: logR(1500, 8000), rMix: R(0.05, 0.45), rDecay: logR(0.6, 5) };
  store.set('pg', { p, fx: f, pat: store.get('pg', {})?.pat || (perc ? 'arp' : 'chords') });
}
