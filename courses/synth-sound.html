<script>
/* ================= future + quiz ================= */
chapter({ id: 'future', title: 'The future: AI and music', min: 3, build(root) {
  root.append(H(`<div class="kicker">Chapter 18 · Where this is going · researched November 2026</div><h1>AI music: what's real, what's next</h1>
  <p class="lede">Two very different things get called "AI music": <b>whole-song generators</b> that turn a text prompt into a finished track, and <b>AI inside the tools</b> — separating stems, transferring timbre, modelling gear. The first is reshaping the music business; the second is quietly changing how sound gets made. Tags: <span class="fact">FACT</span> reported events · <span class="spec">SPECULATION</span> informed guesses.</p>
  <h2>1 · Song generators went from lawsuits to licences</h2>
  <p><span class="fact">FACT</span> In 2024 the major labels sued Suno and Udio for training on their recordings. By late 2025 the fight had turned into deals: Universal settled with Udio in October 2025 and agreed to build a licensed platform for 2026, trained only on authorised music with artists opting in; Udio disabled downloads and moved its existing product into a "walled garden" during the transition, which angered paying users. Warner settled with both Suno and Udio in November 2025. Udio later added Merlin and Kobalt; Sony remains the major without a Udio deal.</p>
  <p><span class="fact">FACT</span> Suno launched its V6 model family on 9 September 2026, which it says was trained from scratch on music licensed from Warner, BMG and Believe, and retired its older models. Nine days later Sony and Universal filed a new suit arguing V6 still inherits the earlier models' alleged infringement through their outputs and "distillation". No court has ruled on that theory yet.</p>
  <p><span class="fact">FACT</span> ElevenLabs launched Eleven Music in August 2025 with licences from Merlin and Kobalt already signed (opt-in for rights holders), and in 2026 expanded it into a creation-and-streaming app. Google DeepMind put <b>Lyria 3</b> into the Gemini app in February 2026 (30-second tracks from text or images, watermarked with SynthID), followed in March by <b>Lyria 3 Pro</b>: up to three-minute songs with sections (intro, verse, chorus, bridge) you can specify, also offered to developers through Vertex AI.</p>
  <h2>2 · The flood, and the listening gap</h2>
  <p><span class="fact">FACT</span> Deezer, which detects and labels fully AI-generated tracks, reported in July 2026 that they passed <b>50% of its daily uploads</b> for the first time (up from ~10% in January 2025). Yet they draw only <b>1–3% of streams</b>, and Deezer found up to 85% of those streams were fraudulent (bots farming royalties) and excluded them from payouts. Billboard uses Deezer's detector to identify AI tracks on its charts. Spotify signed a deal with Sony, Universal, Warner, Merlin and Believe in October 2025 to build "responsible" AI music products around artist consent and credit, and adopted the DDEX standard for disclosing AI involvement in track credits.</p>
  <h2>3 · AI inside the tools</h2>
  <p><span class="fact">FACT</span> <b>Stem separation</b> — unmixing a finished song into vocals, drums, bass and the rest — is now built into Logic Pro, Ableton Live 12 and Studio One, and runs offline in plugins such as LALAL.AI's (Feb 2026) and zplane's PEEL STEMS. For musicians that means isolating a guitar part from a record to learn it, or remixing anything.</p>
  <p><span class="fact">FACT</span> <b>Neural synthesis</b> connects directly to this course. Google Magenta's <b>DDSP</b> (2020) put the very blocks you've learned — harmonic oscillators, filtered noise, reverb — inside a neural network, which learns to <i>drive their parameters</i> from audio; that's how "tone transfer" turns your humming into a convincing violin. IRCAM's <b>RAVE</b> (2021) is a real-time model that encodes any sound into a compact latent space and decodes it as another timbre; you can run such models in a DAW through hosts like Neutone FX, or in Max/Pd. Most text-to-music systems sit on <b>neural audio codecs</b> (SoundStream, EnCodec) that compress audio into tokens a language-model-style network can predict. Neural amp modelling — capturing a real amp or pedal as a trained network — is the guitar-world version (see the guitar-tone course).</p>
  <h2>4 · Where it's heading</h2>
  <p><span class="spec">SPECULATION</span> <b>Licensed, walled gardens become the default</b> for consumer generators: you can make and remix inside the platform, with exports, commercial use and voice likeness gated by licence. The open legal question — can a "clean" model inherit liability from a dirty predecessor? — will shape who can compete.</p>
  <p><span class="spec">SPECULATION</span> <b>Parameter-level AI</b> grows faster than song-level AI for working musicians: "make this pad warmer and further away" turned into actual cutoff, envelope and reverb moves you can see and tweak; patch generation from a reference sound; mix assistants that flag masking and loudness traps. The vocabulary in this course is exactly the interface those tools expose.</p>
  <p><span class="spec">SPECULATION</span> <b>Detection, provenance and labelling</b> (watermarks like SynthID, DDEX credits, upload filters) become infrastructure, because the volume of generated audio already outstrips human output on some platforms. Expect the arms race to continue.</p>
  <p><span class="spec">SPECULATION</span> As generated music becomes abundant, value tilts toward what's scarce: live performance, recognisable human voices and styles (and the licences on them), and the taste to judge and shape sound — which is to say, ears trained on exactly the dimensions you just learned.</p>`));
  root.append(note('gen', `<p>Whatever the tool — a prompt box, a stem splitter, a neural amp — the questions you can now ask are the same: What's the source? What's being removed or added? How does it move in time? How dense are the dynamics? Where does it sit in space? Are my ears being fooled by level?</p>`, '🧭 Why this course still matters'));

/* ---------- final quiz ---------- */
function quizBank() {
  const pickR = (xs) => xs[Math.floor(Math.random() * xs.length)];
  const qs = [];
  const play = (p, notes = [57], dur = 1.1, fxo) => { stopAll(); const keep = patch, kf = FX; setPatch(p); if (fxo) setFX({ ...FX, ...fxo }); const t = now() + 0.05; notes.forEach((m) => noteOn(m, 0.85, t).release(t + dur)); patch = keep; setTimeout(() => { if (fxo) setFX(kf); }, (dur + 1) * 1000); };
  // ear questions
  { const W = [['sine', 'Sine'], ['triangle', 'Triangle'], ['sawtooth', 'Saw'], ['square', 'Square']]; const a = Math.floor(Math.random() * 4);
    qs.push({ ear: true, q: 'Which waveform is this?', o: W.map((w) => w[1]), a, play: () => play({ wave: W[a][0], aA: 0.01, aS: 1, aR: 0.1 }, [57], 1.4), why: 'Sine is pure, triangle soft, square hollow (odd harmonics), saw bright and buzzy (all harmonics). The Spectrum view shows the recipe.' }); }
  { const C = [['Cutoff lowered', { cutoff: 600 }], ['Slower attack', { aA: 0.35 }], ['Detune / unison added', { uni: 3, spread: 18, width: 0.8 }], ['Vibrato added', { lfoDest: 'pitch', lfoDepth: 0.12 }]]; const a = Math.floor(Math.random() * 4);
    const base = { wave: 'sawtooth', cutoff: 4000, slope: 12, aA: 0.005, aS: 0.9, aR: 0.15 };
    qs.push({ ear: true, q: 'You hear A, then B. What changed?', o: C.map((c) => c[0]), a, play: () => { play(base, [57], 0.9); setTimeout(() => play({ ...base, ...C[a][1] }, [57], 1.2, { lfoRate: 5.5 }), 1300); }, why: 'Cutoff = darker; attack = softer start; unison = wider and shimmery; vibrato = wavering pitch.' }); }
  { const F = [['lowpass', 'Lowpass'], ['highpass', 'Highpass'], ['bandpass', 'Bandpass']]; const a = Math.floor(Math.random() * 3);
    qs.push({ ear: true, q: 'Noise through which filter type?', o: F.map((f) => f[1]), a, play: () => { play({ wave: 'noise', noiseColor: 'white', fType: 'highpass', cutoff: 20, aS: 1, aR: 0.1 }, [57], 0.8); setTimeout(() => play({ wave: 'noise', noiseColor: 'white', fType: F[a][0], cutoff: 900, res: F[a][0] === 'bandpass' ? 0.5 : 0.1, aS: 1, aR: 0.1 }, [57], 1.2), 1100); },
      why: 'First you hear the unfiltered noise, then the filtered one. Lowpass = dark rumble, highpass = thin hiss, bandpass = a narrow "shhh" in the middle.' }); }
  { const L = [['pitch', 'Pitch (vibrato)'], ['amp', 'Volume (tremolo)'], ['cutoff', 'Cutoff (wah)']]; const a = Math.floor(Math.random() * 3);
    qs.push({ ear: true, q: 'Where is the LFO routed?', o: L.map((l) => l[1]), a, play: () => play({ wave: 'sawtooth', cutoff: 1200, res: 0.4, slope: 24, aS: 1, aR: 0.2, lfoDest: L[a][0], lfoDepth: L[a][0] === 'pitch' ? 0.15 : 0.6 }, [57], 2.2, { lfoRate: 4, lfoShape: 'sine' }), why: 'Pitch wavers for vibrato, loudness pulses for tremolo, brightness sweeps for wah.' }); }
  { const a = Math.random() < 0.5 ? 0 : 1;
    qs.push({ ear: true, q: 'FM tone: harmonic ratio or inharmonic ratio?', o: ['Harmonic (whole-number ratio)', 'Inharmonic (irrational ratio)'], a, play: () => play({ wave: 'sine', fmRatio: a ? 1.414 : 2, fmIndex: 3, aD: 1.5, aS: 0.3, aR: 0.4 }, [57], 1.6), why: 'Whole-number ratios give a clear pitch; irrational ratios sound metallic and pitch-ambiguous.' }); }
  // concept questions
  const C = (q, o, a, why) => qs.push({ q, o, a, why });
  C('Going up one octave does what to frequency?', ['Adds 100 Hz', 'Doubles it', 'Multiplies by 1.5', 'Adds 12 Hz'], 1, 'Octave = ×2. Pitch is perceived logarithmically.');
  C('+6 dB means the amplitude has…', ['Doubled', 'Increased 6%', 'Increased tenfold', 'Halved'], 0, '20·log10(2) ≈ 6 dB. (Perceived "twice as loud" is closer to +10 dB.)');
  C('Which source gives a lowpass filter the most to work with?', ['Sine', 'Triangle', 'Saw', 'They are equal'], 2, 'Saw has every harmonic at 1/n, so filtering changes it dramatically.');
  C('Filter env amount is high but you barely hear a sweep. Most likely?', ['Resonance too low', 'Base cutoff already near the top', 'Sustain too high', 'Slope too steep'], 1, 'The envelope multiplies the base cutoff; if it\'s near 20 kHz, there is no room to open.');
  C('Same detune in cents on a low note and a high note. Which beats faster?', ['Low', 'High', 'Same', 'Neither beats'], 1, 'Beat rate is a frequency difference, and the same cents is more Hz at higher pitch.');
  C('FM sidebands appear at…', ['carrier × modulator', 'carrier ± multiples of the modulator frequency', 'only odd harmonics', 'the modulator frequency only'], 1, 'fc ± k·fm. Ratio decides where; index decides how many are strong.');
  C('The Nyquist limit at a 44.1 kHz sample rate is…', ['44.1 kHz', '22.05 kHz', '20 kHz', '88.2 kHz'], 1, 'Half the sample rate. Content above it folds back as aliasing.');
  C('Asymmetric clipping, compared with symmetric, adds…', ['Only odd harmonics', 'Even harmonics as well', 'Fewer harmonics', 'Subharmonics'], 1, 'Asymmetry breaks half-wave symmetry, producing even harmonics — the "warm" tube character.');
  C('Distorted major-chord voicings often sound muddy because of…', ['Aliasing', 'Intermodulation tones that fall between notes', 'Masking', 'Phase cancellation'], 1, 'Sum and difference tones of tempered thirds land off the harmonic series; fifths reinforce the root.');
  C('A guitar amp with the gain stage before the tone stack is like which synth order?', ['Filter → Drive', 'Drive → Filter', 'Neither', 'Drive in parallel'], 1, 'The tone stack (a filter) shapes the already-distorted signal — it tames fizz rather than feeding distortion.');
  C('For punchier drums, a compressor\'s attack should be…', ['As fast as possible', 'Slow enough to let the transient through', 'Irrelevant', 'Linked to the release'], 1, 'A slower attack lets the first milliseconds pass before gain reduction kicks in.');
  C('A reverb is muddying the bass. Best fix?', ['More pre-delay', 'High-pass (low cut) the reverb', 'Longer decay', 'More damping only'], 1, 'Low-frequency energy lingering in the tail is the mud; cut it from the reverb send.');
  C('The ear is most sensitive around…', ['50–100 Hz', '2–5 kHz', '12–16 kHz', 'Equal everywhere'], 1, 'The ear canal resonance boosts that range; the equal-loudness curves dip there.');
  C('You A/B two plugins and prefer the one that is 1 dB louder. What is the lesson?', ['Louder is better', 'Level-match before judging', 'Use mono', 'Add compression'], 1, 'Small level differences are heard as quality differences.');
  C('A wah pedal is best described as…', ['A source', 'A resonant bandpass filter whose cutoff your foot modulates', 'A compressor', 'A delay'], 1, 'Shaper (filter) + modulator (your foot). An auto-wah swaps your foot for an envelope follower.');
  return qs;
}
chapter({ id: 'quiz', title: 'Final quiz', min: 4, build(root) {
  root.append(H(`<div class="kicker">Final</div><h1>Final quiz</h1><p class="lede">Twenty questions: five are <b>ear tests</b> (press ▶, use headphones), the rest check concepts. Answers randomise each time you retake it.</p>`));
  const best = store.get('quizBest', null);
  if (best != null) root.append(E('p', { class: 'muted small' }, `Your best so far: ${best}/20`));
  const box = E('div'); root.append(box);
  let qs, i, score, misses;
  const start = () => { qs = quizBank(); qs = [...qs.filter((q) => q.ear), ...qs.filter((q) => !q.ear).sort(() => Math.random() - 0.5)]; i = 0; score = 0; misses = []; show(); };
  const show = () => {
    box.innerHTML = '';
    if (i >= qs.length) {
      const prev = store.get('quizBest', 0); if (score > prev) store.set('quizBest', score);
      box.append(demo('Result', E('div', { class: 'score' }, `${score} / ${qs.length}`),
        E('p', { style: 'text-align:center' }, score >= 18 ? 'Excellent — you can reason about sound in any context.' : score >= 14 ? 'Solid. Revisit the chapters behind the misses below.' : 'Worth a second pass through the chapters below.'),
        ...misses.map((m) => E('div', { class: 'ask-why', html: `<b>${m.q}</b><br>Answer: ${m.o[m.a]} — ${m.why}` })),
        btns(hit('Retake', start, 'primary'))));
      return;
    }
    const q = qs[i];
    const card = demo(`Question ${i + 1} of ${qs.length}${q.ear ? ' · 👂 ear test' : ''}`, E('div', { class: 'ask-q' }, q.q));
    if (q.ear) card.append(btns(hit('▶ Play', q.play, 'play')));
    const list = E('div', { class: 'ask-o' }); let answered = false;
    q.o.forEach((o, j) => list.append(E('button', { type: 'button', onclick: () => {
      if (answered) return; answered = true; const ok = j === q.a; if (ok) score++; else misses.push(q);
      [...list.children].forEach((x, k) => x.classList.add(k === q.a ? 'right' : k === j ? 'wrong' : 'dim'));
      card.append(E('div', { class: 'ask-why', html: (ok ? '<b>Right.</b> ' : '<b>Not quite.</b> ') + q.why }), btns(hit(i + 1 < qs.length ? 'Next question ›' : 'See result', () => { i++; show(); }, 'primary')));
    } }, o)));
    card.append(list); box.append(card);
  };
  start();
} });

  if (k === 'z') { kbOct = Math.max(24, kbOct - 12); buildKbd(); return; }
  if (k === 'x') { kbOct = Math.min(84, kbOct + 12); buildKbd(); return; }
  if (k in KEYMAP) kOn('k' + k, kbOct + KEYMAP[k]);
});
addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in KEYMAP) kOff('k' + k); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });

vizInit();
go(clamp(store.get('cur', 0), 0, CH.length - 1), false);
</script>
</body>
