<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0b0f">
<title>Sound &amp; Synthesis</title>
<style>
:root {
  --bg: #0a0b0f; --bg2: #101219;
  --panel: #15181f; --panel2: #1d2129; --panel3: #262b35;
  --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.12);
  --text: #f4f5f8; --muted: #8d95a5; --dim: #5d6574;
  --accent: #ffb547; --accent2: #4cc9f0;
  --grad: linear-gradient(135deg, #ffc35c 0%, #ff8a4c 100%);
  --good: #34d399; --bad: #f87171; --hard: #fb923c; --easy: #8b9cff;
  --r: 18px;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 30px -12px rgba(0,0,0,0.6);
  --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--text); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; background: radial-gradient(120% 60% at 50% -10%, #1b1f2b 0%, var(--bg) 55%) fixed, var(--bg); overflow-x: hidden; }
a { color: var(--accent2); }
h1 { font: 800 30px/1.1 -apple-system, "SF Pro Display", system-ui, sans-serif; letter-spacing: -0.03em; margin: 18px 0 6px; background: linear-gradient(180deg, #fff 30%, #c9cdd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font: 750 21px/1.25 -apple-system, "SF Pro Display", system-ui, sans-serif; letter-spacing: -0.02em; margin: 26px 0 8px; }
h3 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 22px 0 8px; }
p { margin: 8px 0; color: #dfe2e8; }
b, strong { color: var(--text); }
.kicker { color: var(--accent); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-top: 14px; }
.lede { font-size: 17px; color: #cfd4dd; }
.muted { color: var(--muted); } .small { font-size: 13px; }
code { background: var(--panel3); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0; }
td, th { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.tw { overflow-x: auto; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 9px 13px; cursor: pointer; touch-action: manipulation; transition: transform .08s, background .15s, border-color .15s; }
button:active { transform: scale(.97); }
button.primary { background: var(--grad); color: #1d1206; border-color: transparent; font-weight: 750; }
button.on { border-color: rgba(255,181,71,.65); background: rgba(255,181,71,.14); color: #ffd79a; }
button.play { font-weight: 700; min-width: 120px; }
button.play.on { background: rgba(76,201,240,.14); border-color: rgba(76,201,240,.6); color: #aee9fb; }

/* top + dock */
.topwrap { position: sticky; top: 0; z-index: 20; background: rgba(10,11,15,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding-top: var(--safe-t); }
.top { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px 4px; }
.top .back { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
.top .ttl { flex: 1; text-align: center; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconb { background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 4px 8px; }
.dock { max-width: 720px; margin: 0 auto; padding: 0 16px 8px; }
.dock-head { display: flex; align-items: center; gap: 8px; }
.dock-head .seg { flex: 0 1 auto; }
.dock-head .peak { flex: 1; text-align: right; font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent2); white-space: nowrap; overflow: hidden; }
#viz { display: block; width: 100%; height: 104px; margin-top: 6px; border-radius: 12px; background: #07080b; border: 1px solid var(--line); }
.dock.collapsed #viz { display: none; }
@media (min-width: 600px) { #viz { height: 140px; } }

.seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 3px; border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { flex: 1; border: none; background: transparent; padding: 7px 9px; font-size: 13.5px; border-radius: 9px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--panel3); color: var(--text); font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.seg.mini button { padding: 5px 8px; font-size: 12px; }

main { max-width: 720px; margin: 0 auto; padding: 4px 16px calc(var(--safe-b) + 120px); }
body.kbd-open main { padding-bottom: calc(var(--safe-b) + 260px); }

.demo { background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 16px 0; box-shadow: var(--shadow); }
.demo-h { font-weight: 750; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.demo-h::before { content: "🎛"; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 8px 0; }
.ctl-row > * { min-width: 0; }
.sl { display: block; flex: 1 1 150px; min-width: 130px; }
.sl-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--muted); }
.sl-top b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,181,71,.55), rgba(76,201,240,.45)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; margin-top: -8px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,181,71,.55), rgba(76,201,240,.45)); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: none; }
.btns { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
.btns button { font-size: 13.5px; padding: 8px 11px; }
.readout { font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent2); }
.note { border-radius: 14px; padding: 11px 13px; margin: 12px 0; font-size: 14.5px; border: 1px solid var(--line); background: var(--panel); }
.note p { margin: 4px 0; font-size: 14.5px; }
.note .nh { font-weight: 750; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
.note.listen { border-color: rgba(76,201,240,.35); background: rgba(76,201,240,.06); } .note.listen .nh { color: var(--accent2); }
.note.ix { border-color: rgba(255,181,71,.4); background: rgba(255,181,71,.06); } .note.ix .nh { color: var(--accent); }
.note.gen { border-color: rgba(139,156,255,.4); background: rgba(139,156,255,.06); } .note.gen .nh { color: var(--easy); }
.note.phys { border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.05); } .note.phys .nh { color: var(--good); }
.note.warn { border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.06); } .note.warn .nh { color: var(--bad); }
.ask { border: 1px dashed var(--line2); border-radius: 14px; padding: 12px; margin: 14px 0; }
.ask-q { font-weight: 650; margin-bottom: 8px; }
.ask-o { display: grid; gap: 6px; }
.ask-o button { text-align: left; font-size: 14.5px; }
.ask-o button.right { border-color: var(--good); background: rgba(52,211,153,.12); }
.ask-o button.wrong { border-color: var(--bad); background: rgba(248,113,113,.12); }
.ask-o button.dim { opacity: .5; }
.ask-why { margin-top: 8px; font-size: 14px; color: #cfd4dd; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 7px 12px; border-radius: 999px; font-size: 13.5px; }
svg { max-width: 100%; }
.map { width: 100%; height: auto; display: block; margin: 8px 0; }
.envsvg { width: 100%; height: 90px; display: block; background: #07080b; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.card b { display: block; }
.card small { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: block; }
.drawbars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; margin: 8px 0; }
.drawbars .db { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); }
.drawbars .db input { writing-mode: vertical-lr; direction: rtl; width: 26px; height: 110px; }
.drawbars .db input::-webkit-slider-runnable-track { width: 6px; height: auto; }
.drawbars .db input::-webkit-slider-thumb { margin-top: 0; margin-left: -8px; }
.src { font-size: 13px; color: var(--muted); }
.src li { margin: 4px 0; }
.fact, .spec { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
.fact { background: rgba(52,211,153,.15); color: var(--good); }
.spec { background: rgba(251,146,60,.15); color: var(--hard); }
.score { font-size: 40px; font-weight: 800; text-align: center; margin: 10px 0; }

/* bottom bar + keyboard */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(10,11,15,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px 16px calc(var(--safe-b) + 8px); }
.bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.bar .prog { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
.bar .prog div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { height: 4px; border-radius: 2px; background: var(--panel3); margin-top: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--grad); transition: width .3s; }
.kbd-wrap { max-width: 720px; margin: 0 auto 8px; }
.kbd-tools { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.kbd-tools button { padding: 4px 10px; font-size: 13px; }
#kbd { position: relative; height: 118px; user-select: none; -webkit-user-select: none; touch-action: none; }
#kbd .k { position: absolute; top: 0; border-radius: 0 0 7px 7px; }
#kbd .w { height: 118px; background: linear-gradient(180deg, #e9ebef, #fff); border: 1px solid #9aa0aa; z-index: 1; }
#kbd .b { height: 72px; background: linear-gradient(180deg, #2a2e36, #0e1014); border: 1px solid #000; z-index: 2; }
#kbd .w.down { background: linear-gradient(180deg, #ffd79a, #ffb547); }
#kbd .b.down { background: linear-gradient(180deg, #4cc9f0, #1b7fa3); }
#kbd .lbl { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 10px; color: #6b7280; }
.hidden { display: none !important; }

.menu { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,9,.7); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; padding: calc(var(--safe-t) + 20px) 16px 20px; overflow-y: auto; }
.menu-in { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 14px; }
.menu-in .mi { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; margin: 4px 0; padding: 10px 12px; }
.menu-in .mi .n { color: var(--dim); width: 22px; font-variant-numeric: tabular-nums; font-size: 13px; }
.menu-in .mi .t { flex: 1; }
.menu-in .mi .m { color: var(--muted); font-size: 12.5px; }
.menu-in .mi.cur { border-color: rgba(255,181,71,.6); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 74px); z-index: 40; background: var(--panel3); border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; box-shadow: var(--shadow); white-space: nowrap; }
</style>
</head>
<body>
<div class="topwrap">
  <div class="top">
    <a class="back" href="../index.html">‹ Guitar Cards</a>
    <div class="ttl" id="ttl">Sound &amp; Synthesis</div>
    <button class="iconb" id="monoBtn" title="Mono check (sum L+R)">ST</button>
    <button class="iconb" id="menuBtn" aria-label="Chapters">☰</button>
  </div>
  <div class="dock" id="dock">
    <div class="dock-head">
      <div class="seg mini" id="vizSeg"></div>
      <span class="peak" id="peak"></span>
      <button class="iconb" id="dockBtn" aria-label="Hide visualiser">▾</button>
    </div>
    <canvas id="viz"></canvas>
  </div>
</div>

<main id="main"></main>

<div class="bar">
  <div class="kbd-wrap hidden" id="kbdWrap">
    <div class="kbd-tools"><span>Octave</span><button id="octDn">−</button><span id="octLbl">C3</span><button id="octUp">+</button><span class="grow" style="flex:1"></span><span class="hide-sm">Computer keys: A W S E D F T G Y H U J K · Z/X octave</span></div>
    <div id="kbd"></div>
  </div>
  <div class="bar-in">
    <button id="prev" aria-label="Previous">‹</button>
    <div class="prog"><div id="progTxt"></div><div class="pbar"><i id="pfill"></i></div></div>
    <button id="kbdBtn" title="Keyboard">🎹</button>
    <button id="next" class="primary">Next ›</button>
  </div>
</div>
<div class="menu hidden" id="menu"><div class="menu-in" id="menuIn"></div></div>
<div class="toast" id="toast">🔈 Tap anywhere to switch sound on</div>

<script>
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const ftom = (f) => 69 + 12 * Math.log2(f / 440);
const NOTES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const nname = (m) => NOTES[((Math.round(m) % 12) + 12) % 12] + (Math.floor(Math.round(m) / 12) - 1);
const fmtHz = (f) => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2).replace(/\.?0+$/, '') + ' kHz' : (f >= 100 ? Math.round(f) : f.toFixed(1)) + ' Hz';
const fmtS = (s) => s >= 1 ? s.toFixed(2) + ' s' : Math.round(s * 1000) + ' ms';
const pct = (v) => Math.round(v * 100) + '%';
const store = {
  get(k, d) { try { const v = localStorage.getItem('synthcourse:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('synthcourse:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

/* ================= audio core ================= */
const A = { voices: new Set(), owned: new Set(), waves: new Map(), curves: new Map(), noise: {} };
let ctx = null;
function ac() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  buildGraph();
  return ctx;
}
const now = () => ac().currentTime;

// iOS home-screen apps: a looping silent <audio> element puts the page in the "media playback" audio session,
// so Web Audio isn't muted by the ring/silent switch.
let keepAlive = null, unlocked = false;
function silentWavUrl() {
  const sr = 8000, n = sr;
  const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlock() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* */ }
  try {
    if (!keepAlive) { keepAlive = new Audio(silentWavUrl()); keepAlive.loop = true; keepAlive.setAttribute('playsinline', ''); keepAlive.volume = 0.01; }
    if (keepAlive.paused) keepAlive.play().catch(() => {});
  } catch (e) { /* */ }
  const c = ac();
  if (c.state !== 'running') c.resume().catch(() => {});
  if (!unlocked) {
    const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0);
    unlocked = true; $('#toast').classList.add('hidden');
  }
}

function makeNoise(color) {
  if (A.noise[color]) return A.noise[color];
  const sr = ctx.sampleRate, n = sr * 3, b = ctx.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, br = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (color === 'pink') { // Paul Kellet's refined filter: -3 dB/octave
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      } else if (color === 'brown') { // integrated white: -6 dB/octave
        br = (br + 0.02 * w) / 1.02; d[i] = br * 3.5;
      } else d[i] = w * 0.5;
    }
  }
  return (A.noise[color] = b);
}

function buildGraph() {
  const c = ctx;
  const G = (v = 1) => { const g = c.createGain(); g.gain.value = v; return g; };
  A.G = G;
  A.synthBus = G(1); A.synthPan = c.createStereoPanner(); A.ducker = G(1); A.drumBus = G(0.9);
  A.fxIn = G(1);
  A.synthBus.connect(A.synthPan).connect(A.ducker).connect(A.fxIn);
  A.drumBus.connect(A.fxIn);
  // bus drive (shared by every voice, so chords intermodulate)
  A.busDry = G(1); A.busWet = G(0); A.busShaper = c.createWaveShaper(); A.busShaper.oversample = '4x';
  A.busDC = c.createBiquadFilter(); A.busDC.type = 'highpass'; A.busDC.frequency.value = 18;
  A.crushIn = G(1); A.crushOut = G(1);
  A.fxIn.connect(A.busDry).connect(A.crushIn);
  A.fxIn.connect(A.busShaper).connect(A.busDC).connect(A.busWet).connect(A.crushIn);
  A.crushIn.connect(A.crushOut);
  // chorus: two modulated short delays, one per side, LFOs in antiphase
  A.chDry = G(1); A.chWet = G(0); A.chOut = G(1);
  const dl = c.createDelay(0.1), dr = c.createDelay(0.1); dl.delayTime.value = 0.016; dr.delayTime.value = 0.019;
  const lfo = c.createOscillator(); lfo.frequency.value = 0.7; const dep = G(0.0024), inv = G(-0.0024);
  lfo.connect(dep).connect(dl.delayTime); lfo.connect(inv).connect(dr.delayTime); lfo.start();
  const sl = c.createChannelSplitter(2), sr = c.createChannelSplitter(2), mg = c.createChannelMerger(2);
  A.crushOut.connect(A.chDry).connect(A.chOut);
  A.crushOut.connect(dl); A.crushOut.connect(dr);
  dl.connect(sl); dr.connect(sr); sl.connect(mg, 0, 0); sr.connect(mg, 1, 1); mg.connect(A.chWet).connect(A.chOut);
  A.chLfo = lfo; A.chDep = dep; A.chInv = inv;
  // compressor (switchable) with makeup gain
  A.compIn = G(1); A.comp = c.createDynamicsCompressor(); A.compWet = G(0); A.compBy = G(1); A.makeup = G(1); A.post = G(1);
  A.chOut.connect(A.compIn); A.compIn.connect(A.comp).connect(A.makeup).connect(A.compWet).connect(A.post); A.compIn.connect(A.compBy).connect(A.post);
  // sends
  A.mixBus = G(1); A.post.connect(A.mixBus);
  A.dSend = G(0); A.dL = c.createDelay(2.5); A.dR = c.createDelay(2.5);

chapter({ id: 'pressure', title: 'Sound is pressure', min: 3, build(root) {
  root.append(H(`<div class="kicker">Chapter 1 · Physics</div><h1>Frequency, level, phase</h1>
  <p class="lede">A speaker cone pushes and pulls air. Your eardrum follows the pressure. Three numbers describe the simplest possible sound, a sine wave: how often it repeats, how big the swing is, and where in its cycle it starts.</p>`));
  let osc = null;
  const st = { f: 220, db: -18 };
  const readout = E('div', { class: 'readout' });
  const upd = () => { readout.textContent = `${fmtHz(st.f)} · nearest note ${nname(ftom(st.f))} · period ${(1000 / st.f).toFixed(2)} ms · amplitude ×${Math.pow(10, st.db / 20).toFixed(3)}`; if (osc) { osc.o.frequency.setTargetAtTime(st.f, now(), 0.03); osc.g.gain.setTargetAtTime(Math.pow(10, st.db / 20), now(), 0.03); } };
  const fs = slider({ label: 'Frequency', min: 30, max: 16000, log: true, value: st.f, fmt: fmtHz, on: (v) => { st.f = v; upd(); } });
  const ls = slider({ label: 'Level', min: -50, max: -8, step: 1, value: st.db, fmt: (v) => v + ' dBFS', on: (v) => { st.db = v; upd(); } });
  const setF = (f) => { st.f = clamp(f, 30, 16000); fs.set(st.f); upd(); };
  root.append(demo('Sine generator',
    btns(player('Play sine', () => { osc = tone({ f: st.f, level: Math.pow(10, st.db / 20) }); setViz('scope'); }, null),
      hit('÷2 octave down', () => setF(st.f / 2)), hit('×2 octave up', () => setF(st.f * 2)), hit('+1 semitone (×1.0595)', () => setF(st.f * Math.pow(2, 1 / 12))), hit('+6 dB', () => { st.db = Math.min(-8, st.db + 6); ls.set(st.db); upd(); })),
    row(fs, ls), readout));
  upd();
  root.append(note('listen', `<p>Press <b>×2</b> a few times: each press sounds like the <i>same size</i> step even though the Hz jump doubles (220 → 440 → 880). Pitch perception is <b>logarithmic</b> — that's why the spectrum strip uses a log axis and why an octave is the same musical distance at any height. Watch the Wave view squeeze as frequency rises.</p>`));
  root.append(note('phys', `<p><b>Frequency</b> (Hz) = cycles per second; pitch. Humans hear ~20 Hz–20 kHz (the top drops with age). A semitone multiplies by 2<sup>1/12</sup> ≈ 1.0595, so 100 cents = +5.9%.</p>
  <p><b>Level</b> is measured in decibels: dB = 20·log<sub>10</sub>(amplitude ratio). +6 dB doubles amplitude; roughly +10 dB is <i>heard</i> as twice as loud. In digital audio, 0 dBFS is the ceiling and everything is negative below it.</p>`));
  root.append(H(`<h2>Phase: when waves meet</h2><p>Two sounds in the air simply add. If two identical sines are offset by half a cycle (180°), every push meets a pull — they cancel. This one idea explains comb filtering, mic-placement problems, chorus, and why some wide synths vanish in mono.</p>`));
  let pair = null; const ph = { deg: 0, b: true, nudge: false };
  const sumTxt = E('div', { class: 'readout' });
  const pupd = () => {
    const amp = ph.b ? Math.abs(2 * Math.cos(ph.deg * Math.PI / 360)) : 1;
    sumTxt.textContent = ph.nudge ? 'B is 1 Hz higher: the phase relationship sweeps 0→360° once per second (beating)' : `sum amplitude ×${amp.toFixed(2)} of one sine  (${amp > 0.01 ? (20 * Math.log10(amp)).toFixed(1) + ' dB' : 'silence'})`;
    if (pair) { pair.d.delayTime.setTargetAtTime((ph.deg / 360) / 220, now(), 0.02); pair.gb.gain.setTargetAtTime(ph.b ? 0.14 : 0, now(), 0.02); pair.ob.frequency.setTargetAtTime(ph.nudge ? 221 : 220, now(), 0.02); }
  };
  const startPair = () => {
    const c = ac(), t = c.currentTime + 0.02;
    const oa = c.createOscillator(), ob = c.createOscillator(); oa.frequency.value = ob.frequency.value = 220;
    const ga = c.createGain(), gb = c.createGain(), d = c.createDelay(0.1), m = c.createGain(); ga.gain.value = 0.14; gb.gain.value = ph.b ? 0.14 : 0; d.delayTime.value = (ph.deg / 360) / 220;
    m.gain.setValueAtTime(0, t); m.gain.linearRampToValueAtTime(1, t + 0.05);
    oa.connect(ga).connect(m); ob.connect(d).connect(gb).connect(m); m.connect(A.clean); oa.start(t); ob.start(t);
    pair = { d, gb, ob }; setViz('scope');
    own(() => { m.gain.setTargetAtTime(0, ctx.currentTime, 0.01); oa.stop(ctx.currentTime + 0.08); ob.stop(ctx.currentTime + 0.08); pair = null; });
    pupd();
  };
  root.append(demo('Two sines, one phase knob',
    btns(player('Play A + B', startPair), toggle('B on', true, (v) => { ph.b = v; pupd(); }), toggle('Nudge B +1 Hz', false, (v) => { ph.nudge = v; pupd(); })),
    row(slider({ label: 'Phase of B', min: 0, max: 360, step: 1, value: 0, fmt: (v) => v + '°', on: (v) => { ph.deg = v; pupd(); } })), sumTxt));
  pupd();
  root.append(note('listen', `<p>Drag phase to 180°: near silence. At 0° the two add to +6 dB. Then turn on <b>Nudge</b>: a 1 Hz difference means the phase drifts continuously, so the level swells and vanishes once per second. That pulsing is <b>beating</b>, the basis of detune, chorus and how you tune a guitar by ear.</p>`));
  root.append(note('gen', `<p>Two mics on one guitar cab at slightly different distances = a phase offset that varies with frequency, which notches out some frequencies (a <b>comb filter</b>). Same reason a stereo synth patch can thin out on a mono phone speaker, and how noise-cancelling headphones work.</p>`));
  root.append(ask('A3 is 220 Hz. What is A5?', ['440 Hz', '660 Hz', '880 Hz', '1320 Hz'], 2, 'Two octaves up = ×2×2 = ×4 → 880 Hz.'));
  root.append(ask('Two identical sines, one shifted by 180°. What do you hear?', ['Twice as loud', 'An octave higher', 'Silence', 'A chorus effect'], 2, 'Perfect cancellation: each peak meets a trough. Real sounds rarely cancel fully, but partial cancellation (comb filtering) is everywhere.'));
} });

// drone + loop transport that can restart when a structural parameter changes
function rig({ notes = [45], pat = null, bpm = 110, len = 16, droneLabel = 'Drone', loopLabel = 'Loop', vel = 0.8 } = {}) {

}

chapter({ id: 'harmonics', title: 'Harmonics & timbre', min: 3,
  patch: { wave: 'custom', harm: [1, 0.5, 0.33, 0.25, 0.2, 0.17, 0.14, 0.12, 0.11, 0.1, 0.09, 0.08], aA: 0.01, aR: 0.3 },
  build(root) {
  root.append(H(`<div class="kicker">Chapter 2 · Spectrum</div><h1>Harmonics: why a note has a colour</h1>
  <p class="lede">A guitar, a flute and a synth can all play A at 110 Hz and still sound nothing alike. The difference is which <b>other</b> frequencies ride along — and how loud each one is.</p>
  <p>Fourier's insight: any repeating waveform, however jagged, is exactly a sum of sine waves at whole-number multiples of its repetition rate. Those multiples are the <b>harmonics</b> (or partials): 110, 220, 330, 440 Hz… The first is the <b>fundamental</b> and sets the pitch; the recipe of the rest is the <b>timbre</b>.</p>`));
  const bars = E('div', { class: 'drawbars' }); const inputs = [];
  const r = rig({ notes: [45], pat: CHORDS.map((e) => ({ ...e, n: e.n.map((m) => m - 12) })), bpm: 100, len: 64, droneLabel: 'Drone (A2)', loopLabel: 'Chords' });
  const push = () => P('harm', patch.harm.slice());
  patch.harm.forEach((a, i) => {
    const inp = E('input', { type: 'range', min: 0, max: 100, value: Math.round(a * 100), 'aria-label': 'Harmonic ' + (i + 1) });
    inp.oninput = () => { unlock(); patch.harm[i] = inp.value / 100; push(); };
    inputs.push(inp); bars.append(E('div', { class: 'db' }, inp, E('span', {}, String(i + 1))));
  });
  const preset = (arr) => { arr = arr.concat(Array(12).fill(0)).slice(0, 12); patch.harm = arr; inputs.forEach((x, i) => (x.value = Math.round(arr[i] * 100))); push(); };
  const H12 = [...Array(12)].map((_, i) => i + 1);
  root.append(demo('Additive drawbars — build a wave from 12 harmonics',
    r.el,
    bars,
    btns(hit('Sine', () => preset([1])), hit('Saw recipe (1/n)', () => preset(H12.map((n) => 1 / n))), hit('Square recipe (odd 1/n)', () => preset(H12.map((n) => n % 2 ? 1 / n : 0))),
      hit('Triangle (odd 1/n²)', () => preset(H12.map((n) => n % 2 ? 1 / (n * n) : 0))), hit('Organ 8′+4′+2⅔′', () => preset([1, 0.8, 0.6, 0.5, 0, 0.4, 0, 0.35])),

  root.append(note('listen', `<p>Start with <b>Sine</b>, then raise bars 2, 3, 4 one at a time while the drone plays. Each addition is a new <i>colour</i>, not a new note — your brain fuses harmonics into one pitch. Watch the Spectrum: a picket fence of lines at 110, 220, 330… Then try <b>Fundamental removed</b>: the pitch stays at A2. (More on that illusion in Psychoacoustics.)</p>`));
  // harmonic series table
  const t = E('table', {}, E('tr', {}, E('th', {}, '#'), E('th', {}, 'Hz (on A2)'), E('th', {}, 'Nearest note'), E('th', {}, 'Interval above the root')));
  const IV = ['root', 'octave', 'octave + 5th', '2 octaves', '2 oct + major 3rd', '2 oct + 5th', '2 oct + ♭7 (flat)', '3 octaves', '3 oct + 9th', '3 oct + maj 3rd', '3 oct + ♯11 (very flat)', '3 oct + 5th'];
  H12.forEach((n) => { const f = 110 * n, m = ftom(f), c = Math.round((m - Math.round(m)) * 100); t.append(E('tr', {}, E('td', {}, String(n)), E('td', {}, String(f)), E('td', {}, `${nname(m)} ${c ? (c > 0 ? '+' : '') + c + '¢' : ''}`), E('td', {}, IV[n - 1]))); });
  root.append(H(`<h2>The harmonic series is a chord</h2><p>Look at the note names. The series spells octave, fifth, octave, major third, fifth, flat seventh… — a dominant chord built into every pitched sound. The cents column shows how far each lies from the equal-tempered piano/guitar note.</p>`));
  root.append(E('div', { class: 'tw' }, t));
  root.append(btns(hit('▶ Hear harmonics 1–12 one by one', () => { stopAll(); const t0 = now() + 0.05; H12.forEach((n, i) => tone({ f: 110 * n, level: 0.16, t: t0 + i * 0.32, dur: 0.3 })); })));
  // consonance
  root.append(H(`<h2>Why intervals sound consonant</h2><p>Two notes sound smooth when many of their harmonics <b>coincide</b>. A fifth is a 3:2 ratio, so every 3rd harmonic of the low note lands exactly on every 2nd of the upper one. Complex ratios leave harmonics a few Hz apart, and those near-misses <b>beat</b> (Chapter 1) — we hear that as roughness.</p>`));
  const iv = { r: 3 / 2, et: 7, just: true }; let dy = null;
  const IVS = [['Octave', 2, 12], ['Fifth', 3 / 2, 7], ['Fourth', 4 / 3, 5], ['Major 3rd', 5 / 4, 4], ['Minor 3rd', 6 / 5, 3], ['Tritone', 45 / 32, 6], ['Minor 2nd', 16 / 15, 1]];
  const hm = [1, 0.5, 0.33, 0.25, 0.2, 0.16, 0.14, 0.12];
