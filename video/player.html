<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar video player</title>
<style>
  :root { --bg: #101114; --fg: #ecebe7; --muted: #8a8c93; --accent: #f2b134; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  #stage { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-height: calc(100vh - 64px); }
  body.render #stage { width: 1920px; height: 1080px; max-height: none; }
  body.render #controls { display: none; }
  #controls { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  #controls button { font: inherit; background: #26282e; color: var(--fg); border: 1px solid #3a3d45; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  #controls input[type=range] { flex: 1; min-width: 0; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; text-align: right; }
  #msg { color: var(--muted); }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0">
  <span id="time">0.0 / 0.0</span>
  <span id="msg"></span>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
