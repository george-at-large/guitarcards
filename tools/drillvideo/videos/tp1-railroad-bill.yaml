# Repertoire TP1: a Railroad Bill study, Piedmont fingerpicking in C, written for the course over the song's
# traditional changes (C – E7 – F – C – G7 – C, the III7 is its signature). Not a transcription of any recording:
# learn Etta Baker's or Hobart Smith's version by ear once this is in the hands.
id: tp1-railroad-bill
title: "Railroad Bill"
rule: "The thumb never stops; the melody jumps in between."
bpm: 96
captions: false
page_neck: true

steps:
  - card: {title: "Railroad Bill", lines: ["Piedmont fingerpicking over the traditional changes:", "the thumb on every beat, the melody in between."]}
    hold: 3

  - card: null
    section: Railroad Bill
    key: "C major"
    bpm: 96
    notes: ["p: the thumb, every beat (5 4 6 4 on C). i m: the melody, mostly on the &s. Written for the course, not a transcription."]
    page:
      root: C
      repeat: 2
      harmony: ["C:I", "E7:III7", "F:IV", "F:IV", "C:I", "G7:V7", "C:I", "C:I G7:V7"]
      voices:
        - "1.0:1 2.1:.5 1.0:1 2.1:.5 3.0:1 | 1.0:1 3.1:.5 2.0:1 3.1:.5 2.0:1 | 1.1:1 2.1:.5 1.1:1 3.2:.5 2.1:1 | r:.5 1.1:.5 2.1:.5 3.2:1 2.1:.5 1.1:1 | 1.0:1 2.1:.5 1.0:1 2.1:.5 3.0:1 | 1.1:1 2.0:.5 1.1:1 2.0:.5 1.3:1 | 2.1:1 1.0:.5 2.1:1 3.0:.5 2.1:1 | 1.0:2 r:1 1.1:1 |"
        - "5.3:1 4.2:1 6.3:1 4.2:1 | 6.0:1 4.0:1 5.2:1 4.0:1 | 6.1:1 4.3:1 5.3:1 4.3:1 | 6.1:1 4.3:1 5.3:1 4.3:1 | 5.3:1 4.2:1 6.3:1 4.2:1 | 6.3:1 4.0:1 5.2:1 4.0:1 | 5.3:1 4.2:1 6.3:1 4.2:1 | 5.3:1 4.2:1 6.3:1 4.0:1 |"
      marks: [[2, "E7, the III7: its G♯ pulls up to the A of F."], [3, "F: a barre at fret 1, the thumb 6 4 5 4."], [8, "G7 on beat 3 to go round again."]]

  - section: null
    key: null
    card:
      title: You've got it when
      lines: ["the thumb stays steady at 96 and up,", "and the melody lands between the thumbs, not on them."]
    hold: 3
