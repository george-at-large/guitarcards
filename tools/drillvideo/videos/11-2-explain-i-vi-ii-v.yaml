# Explainer: Why I – vi – ii – V turns around.
# Written by gen.py: change the loops there, not the steps here.
id: 11-2-explain-i-vi-ii-v
title: "Why I – vi – ii – V turns around"
rule: "Function first: what does each chord want to do?"
bpm: 84
captions: false

steps:
  - card: {title: "Why I – vi – ii – V turns around", lines: ["Gmaj7 – Em7 – Am7 – D7:", "what each chord does,", "and the guide tones that lead it."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Hear the progression and say each Roman numeral", "2   Play the guide tones: the 3rd and 7th of each chord", "3   Name each chord’s job from the table, then play it in another key"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "Gmaj7 – Em7 – Am7 – D7"
    sub: "in G · drop 2, then the guide tones"
    notes: ["Roots fall in 5ths from vi: E → A → D → G, the strongest motion in tonal music."]
    say: "Why I – vi – ii – V turns around."
  - section: The progression
    play: strum 4
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: '{roman}'}
  - section: Guide tones
    notes: ['The 3rd and 7th of each chord: the two notes that say what the chord is, moving by step.']
    play: strum 4
    click: false
    expand: {kind: loop, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", keys: [G], voicing: close, strings: [3, 2], guide: true, startFret: 5, bars: 1, now: '{chord}', sub: '{roman}'}
  - section: What each chord does
    now: null
    sub: null
    show: null
    notes: null
    table:
      title: "Gmaj7 – Em7 – Am7 – D7"
      head: [Chord, Function, Why]
      widths: [0.18, 0.32, 0.5]
      rows: [["Gmaj7", "I · tonic", "home"], ["Em7", "vi · tonic substitute", "shares 3 notes with I: still home, a step away"], ["Am7", "ii · pre-dominant", "roots now fall in 5ths"], ["D7", "V · dominant", "pulls back to I: round again"]]
    hold: 9
  - section: null
    table: null
    card:
      title: You've got it when
      lines: ['you can name each chord’s job as it sounds,', 'play the guide tones without the full chords,', 'and find the progression in another key.']
    hold: 5
