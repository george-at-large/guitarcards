# Explainer: Why the minor ii – V – i works.
# Written by gen.py: change the loops there, not the steps here.
id: 11-5-explain-minor-ii-v-i
title: "Why the minor ii – V – i works"
rule: "Function first: what does each chord want to do?"
bpm: 84
captions: false

steps:
  - card: {title: "Why the minor ii – V – i works", lines: ["Aø – D7♭9 – Gm6:", "what each chord does,", "and the guide tones that lead it."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Hear the progression and say each Roman numeral", "2   Play the guide tones: the 3rd and 7th of each chord", "3   Name each chord’s job from the table, then play it in another key"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "Aø – D7♭9 – Gm6"
    sub: "in G · drop 2, then the guide tones"
    notes: ["Every chord holds a note of G harmonic minor: the ♭6 pulls down, the leading tone up."]
    say: "Why the minor ii – V – i works."
  - section: The progression
    play: strum 4
    click: false
    expand: {kind: prog, key: G, chart: "| ii:m7b5 | V:7b9 | i:m6 | i:m6 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: '{roman}'}
  - section: Guide tones
    notes: ['The 3rd and 7th of each chord: the two notes that say what the chord is, moving by step.']
    play: strum 4
    click: false
    expand: {kind: loop, chart: "| ii:m7b5 | V:7b9 | i:m6 | i:m6 |", keys: [G], voicing: close, strings: [3, 2], guide: true, startFret: 5, bars: 1, now: '{chord}', sub: '{roman}'}
  - section: What each chord does
    now: null
    sub: null
    show: null
    notes: null
    table:
      title: "Aø – D7♭9 – Gm6"
      head: [Chord, Function, Why]
      widths: [0.18, 0.32, 0.5]
      rows: [["Am7♭5", "iiø · pre-dominant", "E♭ (the ♭6 of G minor) in the chord"], ["D7♭9", "V7♭9 · dominant", "harmonic minor gives the major 3rd F♯; E♭ is the ♭9"], ["Gm6", "i · tonic", "E♭ → D, F♯ → G"]]
    hold: 9
  - section: null
    table: null
    card:
      title: You've got it when
      lines: ['you can name each chord’s job as it sounds,', 'play the guide tones without the full chords,', 'and find the progression in another key.']
    hold: 5
