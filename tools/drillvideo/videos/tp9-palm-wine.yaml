# Short series: Palm-wine guitar. Written for the course (see the notes on screen).
id: tp9-palm-wine
title: "Palm-wine guitar"
rule: "The thumb walks; the fingers answer in 3rds and 6ths, off the beat."
bpm: 104
captions: false
page_neck: true

steps:
  - card: {title: "Palm-wine guitar", lines: ["Ghana’s palm-wine style, the ancestor of highlife:", "a steady thumb, a sweet doubled melody answering off the beat."]}
    hold: 3

  - card: null
    section: "West African palm-wine"
    key: "C major"
    notes: ["Written for the course in the palm-wine style (Koo Nimo, Kwaa Mensah)."]
    page:
      root: C
      repeat: 3
      harmony: ["C:I", "F:IV", "G7:V7", "C:I"]
      voices: ["r:.5 1.0+2.1:.5 r:.5 1.0+2.1:.5 r:.5 1.1+2.3:1 1.0+2.1:.5 | r:.5 1.1+3.2:.5 r:.5 1.1+3.2:.5 r:.5 1.0+3.0:1 1.1+3.2:.5 | r:.5 1.3+2.0:.5 r:.5 1.3+2.0:.5 r:.5 1.1+2.0:1 1.3+2.0:.5 | r:.5 1.0+2.1:.5 r:.5 1.0+2.1:.5 1.0+2.1:2 |", "5.3:1 4.2:1 6.3:1 4.2:1 | 4.3:1 5.3:1 4.3:1 5.3:1 | 6.3:1 4.0:1 5.2:1 4.0:1 | 5.3:1 4.2:1 6.3:1 4.2:1 |"]
      marks: [[1, "The double stops land on the &s: the off-beat answer is the style."], [2, "F: 6ths (F over A) in place of 3rds."], [3, "G7: the same figure, its F the 7th."]]

  - section: null
    key: null
    notes: null
    card:
      title: You've got it when
      lines: ["the thumb is steady and the double stops sit between its beats,", "light and bouncing."]
    hold: 3
