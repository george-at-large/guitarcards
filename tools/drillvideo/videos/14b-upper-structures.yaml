# Video 14b: upper-structure triads over a dominant shell.
# Written by gen.py: change the loops there, not the steps here.
id: 14b-upper-structures
title: "Upper structures"
rule: "A triad on top, the shell below: name it from the bass."
bpm: 80
captions: false

steps:
  - card: {title: "Upper structures", lines: ["Five major triads over a D7 shell,", "each labelled from D:", "the colour tones they add."]}
    hold: 4.5
