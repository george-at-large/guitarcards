    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "D7 shell + a triad"
    sub: "shell D F♯ C on 6-5-4 · triad on 3-2-1"
    notes: ["The faint dots are the shell (1 3 ♭7); the bright ones the triad, measured from D."]
    say: "Upper structures: a major triad on top of a D seven shell. Each one adds different colour tones."
  - section: Upper structures
    now: "E over D7 = D13♯11"
    sub: "II: 9 ♯11 13, the Lydian dominant"
    show: [{kind: line, root: D, pitches: [D3, F#3, C4], each: [6, 5, 4], labels: ['1', '3', 'b7'], faint: true}, {kind: line, root: D, pitches: ["E4", "G#4", "B4"], each: [3, 2, 1], labels: ["9", "#11", "13"]}]
    notes: null
    play: strum 2
    hold: 1.2
  - section: Upper structures
    now: "B over D7 = D13♭9"
    sub: "VI: ♭9 3 13, the half-whole diminished"
    show: [{kind: line, root: D, pitches: [D3, F#3, C4], each: [6, 5, 4], labels: ['1', '3', 'b7'], faint: true}, {kind: line, root: D, pitches: ["D#4", "F#4", "B4"], each: [3, 2, 1], labels: ["b9", "3", "13"]}]
    notes: null
    play: strum 2
    hold: 1.2
  - section: Upper structures
    now: "A♭ over D7 = D7♭9♯11"
    sub: "♭V: ♭7 ♭9 ♯11, the tritone sub on top"
    show: [{kind: line, root: D, pitches: [D3, F#3, C4], each: [6, 5, 4], labels: ['1', '3', 'b7'], faint: true}, {kind: line, root: D, pitches: ["C4", "Eb4", "Ab4"], each: [3, 2, 1], labels: ["b7", "b9", "#11"]}]
    notes: null
    play: strum 2
    hold: 1.2
  - section: Upper structures
    now: "B♭ over D7 = D7♯9♭13"
    sub: "♭VI: 1 ♯9 ♭13, altered"
    show: [{kind: line, root: D, pitches: [D3, F#3, C4], each: [6, 5, 4], labels: ['1', '3', 'b7'], faint: true}, {kind: line, root: D, pitches: ["D4", "F4", "Bb4"], each: [3, 2, 1], labels: ["1", "#9", "b13"]}]
    notes: null
    play: strum 2
    hold: 1.2
  - section: Upper structures
    now: "F over D7 = D7♯9"
    sub: "♭III: ♭7 ♯9 5, the blues dominant"
    show: [{kind: line, root: D, pitches: [D3, F#3, C4], each: [6, 5, 4], labels: ['1', '3', 'b7'], faint: true}, {kind: line, root: D, pitches: ["C4", "F4", "A4"], each: [3, 2, 1], labels: ["b7", "#9", "5"]}]
    notes: null
    play: strum 2
    hold: 1.2
  - section: null
    show: null
    band: null
    notes: null
