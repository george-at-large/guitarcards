# Explainer: Why the 12-bar blues works.
# Written by gen.py: change the loops there, not the steps here.
id: 11-6-explain-blues
title: "Why the 12-bar blues works"
rule: "Function first: what does each chord want to do?"
bpm: 84
captions: false

steps:
  - card: {title: "Why the 12-bar blues works", lines: ["G7 – C7 – D7, all dominant:", "what each chord does,", "and the guide tones that lead it."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Hear the progression and say each Roman numeral", "2   Play the guide tones: the 3rd and 7th of each chord", "3   Name each chord’s job from the table, then play it in another key"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "G7 – C7 – D7, all dominant"
    sub: "in G · drop 2, then the guide tones"
    notes: ["Three dominant chords, none resolving “properly”: the blues lives in the tension."]
    say: "Why the 12-bar blues works."
  - section: The progression
    play: strum 4
    click: false
    expand: {kind: prog, key: G, chart: "| I:7 | IV:7 | I:7 | I:7 | IV:7 | IV:7 | I:7 | I:7 | V:7 | IV:7 | I:7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: '{roman}'}
  - section: Guide tones
    notes: ['The 3rd and 7th of each chord: the two notes that say what the chord is, moving by step.']
    play: strum 4
    click: false
    expand: {kind: loop, chart: "| I:7 | IV:7 | I:7 | I:7 | IV:7 | IV:7 | I:7 | I:7 | V:7 | IV:7 | I:7 | V:7 |", keys: [G], voicing: close, strings: [3, 2], guide: true, startFret: 5, bars: 1, now: '{chord}', sub: '{roman}'}
  - section: What each chord does
    now: null
    sub: null
    show: null
    notes: null
    table:
      title: "G7 – C7 – D7, all dominant"
      head: [Chord, Function, Why]
      widths: [0.18, 0.32, 0.5]
      rows: [["G7", "I7 · tonic, but dominant", "the blue ♭7 is part of home"], ["C7", "IV7", "its 7th (B♭) is the blue ♭3 of G"], ["D7", "V7", "bar 9: the strongest pull"], ["C7 → G7", "IV → I", "bar 10: the plagal close, the “amen”"]]
    hold: 9
  - section: null
    table: null
    card:
      title: You've got it when
      lines: ['you can name each chord’s job as it sounds,', 'play the guide tones without the full chords,', 'and find the progression in another key.']
    hold: 5
