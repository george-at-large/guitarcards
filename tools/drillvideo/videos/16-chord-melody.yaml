# Video 16: chord melody, on Silent Night (Gruber, 1818, public domain), arranged for the course in G: the melody on
# strings 1-2 (3 for the lowest notes), the chord pinched under it on each downbeat, I IV V7 only.
id: 16-chord-melody
title: 'Chord melody: Silent Night'
rule: The melody on top; the chord under it on the beat.
bpm: 84
captions: false

steps:
  - card: {title: 'Chord melody: Silent Night', lines: ['A melody harmonised on one guitar:', 'the tune on the top strings, the chord pinched under it on beat 1.']}
    hold: 4
  - card: {title: The drill, lines: ['1   Hear it once, following the tab', '2   Read the page: each mark explains a chord choice', '3   The melody alone, then with the chords on beat 1', '4   The 23 bars at 84, the melody always loudest']}
    hold: 8.5

  - card: null
    section: Hear it
    key: G major · 3/4
    now: Silent Night
    sub: 'I, IV and V7 only: the melody note decides the voicing'
    notes: ['Every chord is chosen so the melody note is its top note.']
    tab:
      root: G
      harmony: ["G:I", "G:I", "G:I", "G:I", "D7:V7", "D7:V7", "G:I", "G:I", "C:IV", "C:IV", "G:I", "G:I", "C:IV", "C:IV", "G:I", "G:I", "D7:V7", "D7:V7", "G:I", "G:I", "G:I", "D7:V7", "G:I"]
      voices:
        - "6.3+4.0+2.3:1.5 1.0:.5 2.3:1 | 6.3+4.0+3.0+2.0:3 | 6.3+4.0+2.3:1.5 1.0:.5 2.3:1 | 6.3+4.0+3.0+2.0:3 | 4.0+3.5+2.7+1.5:2 1.5:1 | 4.0+3.2+2.1+1.2:3 | 6.3+5.2+4.0+3.0+2.0+1.3:2 1.3:1 | 6.3+4.0+3.0+2.3:3 | 5.3+4.2+3.0+2.1+1.0:2 1.0:1 | 5.3+4.2+1.3:1.5 1.2:.5 1.0:1 | 6.3+4.0+2.3:1.5 1.0:.5 2.3:1 | 6.3+4.0+3.0+2.0:3 | 5.3+4.2+3.0+2.1+1.0:2 1.0:1 | 5.3+4.2+1.3:1.5 1.2:.5 1.0:1 | 6.3+4.0+2.3:1.5 1.0:.5 2.3:1 | 6.3+4.0+3.0+2.0:3 | 4.0+3.5+2.7+1.5:2 1.5:1 | 4.0+3.7+2.7+1.8:1.5 2.10:.5 2.7:1 | 6.3+4.0+3.0+2.0+1.3:3 | 4.5+3.7+2.8+1.7:3 | 6.3+4.0+1.3:1.5 2.3:.5 2.0:1 | 5.0+4.0+2.3:1.5 2.1:.5 3.2:1 | 6.3+5.2+4.0+3.0:3 |"

  - section: The score
    bpm: 66
    notes: ['Play the chord with the thumb and the melody finger together; let the melody ring over the chord.']
    page:
      marks:
        - [1, 'Bars 1–4: G with D, then B, on top: the melody note is always the top of the grip.']
        - [5, 'Bar 5: D7 grip with A on top (xx0575); bar 6 the open D7 with F♯ on top.']
        - [9, 'Bars 9–10: IV (C) under E; the F♯ in bar 10 is a passing note over the chord.']
        - [18, 'Bar 18: D7 with its 7th, C, in the melody: the most tension in the song.']
        - [21, 'Bars 21–23: the melody walks down G D B, D C A, home to G: V7 – I, the final cadence.']

  - section: null
    key: null
    notes: ['Next: the same idea on a tune you know, with I, IV and V7 first, then 7th chords.']
    card:
      title: You've got it when
      lines: ['you can play Silent Night at 84 with the melody always on top,', 'choose a grip for any melody note,', 'and harmonise another simple tune the same way.']
    hold: 5
