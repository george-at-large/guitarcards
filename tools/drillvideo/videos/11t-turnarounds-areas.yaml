  # ---------- all 12 keys ----------
  - section: All 12 keys
    key: null
    mark: null
    now: Then every key
    sub: round the cycle of fourths
    show: null
    band: null
    notes: null
    table:
      title: "Where each key's areas sit: the I chord's root (string: fret) in each form"
      head: [Key, E form, D form, C form, A form, G form]
      widths: [0.2, 0.16, 0.16, 0.16, 0.16, 0.16]
      rows_from: {kind: areasTable, keys: [G, C, F, Bb, Eb, Ab, Db, Gb, B, E, A, D], forms: [E, D, C, A, G], cols: ['{key}', '{at[0]}', '{at[1]}', '{at[2]}', '{at[3]}', '{at[4]}']}
    say: Then every key, round the cycle of fourths, five areas each.
    hold: 6
  - notes: ['In each key: find the I chord’s root in each form, then voice-lead the progression inside that area.', 'Each day: one progression in all five areas, in one or two keys.']
