# Progression strand: turnarounds in the five areas, after Marbin's fifteen areas (plan v3).
# Written by gen.py: change the loops there, not the steps here.
id: 11t-turnarounds-areas
title: "Turnarounds in five areas"
rule: "Stay in the area: every chord is a fret or two away."
bpm: 80
captions: false

steps:
  - card: {title: "Turnarounds in five areas", lines: ["Five essential progressions, voice-led", "without leaving each of the five CAGED areas,", "on the top four strings."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   One progression in one area: every chord to the nearest voicing", "2   The same progression in the next area, until all five are done", "3   Next progression; then the next key"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "Five progressions, five areas"
    sub: "ii–V–I · I–vi–ii–V · iii–VI–ii–V · backdoor · minor ii–V–i"
    notes: ["Each chord moves to the nearest voicing of the next.", "The band is the area: the hand never leaves it."]
    say: "Five progressions in G, each played in the five CAGED areas without moving out of the area. Every chord moves to the nearest voicing of the next."

  # ---------- ii–V–I ----------
  - section: ii–V–I · E-form area
    notes: ['Am7 – D7 – Gmaj7: the 7th of each chord falls to the 3rd of the next.']
    say: "Two five one."
    play: strum 2
    click: false
    expand: {kind: areaProg, key: G, chart: '| ii:m7 | V:7 | I:maj7 |', strings: [4, 3, 2, 1], form: E, bars: 0.5, now: '{chord}', sub: '{roman} · E-form area'}
    hold: 0.4
  - section: ii–V–I · D-form area
