# Video F1: fingerpicking foundations.
# Written by gen.py: change the loops there, not the steps here.
id: F1-fingerpicking-foundations
title: "Fingerpicking foundations"
rule: "p plays the bass; i m a play strings 3 2 1."
bpm: 84
captions: false

steps:
  - card: {title: "Fingerpicking foundations", lines: ["The thumb alone, the pinch, p-i-m-a up and back,", "block plucks and arpeggio patterns,", "each on C, then on Am."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Each pattern on C for two bars, even and slow", "2   The same pattern on Am", "3   Then the next pattern; tempo up only when it is even"]}
    hold: 7.4
  - card: null
    section: The drill
    key: C major
    now: "p i m a"
    sub: "p (thumb): strings 6-4 · i: 3 · m: 2 · a: 1"
    notes: ["Each finger owns a string: the hand stays still and the fingers do the work."]
    say: "Fingerpicking foundations. The thumb plays the bass, and the three fingers own the top three strings."
  - section: "Thumb"
    now: "The thumb alone"
    sub: "p on the root, every beat"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 - 5 - 5 - 5 -", grid: 2, repeat: 2}
    hold: 0.2
  - now: "Thumb, alternating"
    sub: "root, then the string above, then back"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 - 4 - 5 - 4 -", grid: 2, repeat: 2}
    hold: 0.2
  - section: "Pinch"
    now: "The pinch"
    sub: "p and a together"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: "Pinch: thumb and finger squeeze toward each other, at the same instant."
    play: {groove: "51 - 4 - 51 - 4 -", grid: 2, repeat: 2}
    hold: 0.2
  - section: "Arpeggios"
    now: "p i m a"
    sub: "up the chord"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 3 2 1 5 3 2 1", grid: 2, repeat: 2}
    hold: 0.2
  - now: "p i m a m i"
    sub: "up and back"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 3 2 1 2 3 5 3", grid: 2, repeat: 2}
    hold: 0.2
  - now: "p i m i a i m i"
    sub: "the classical arpeggio"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 3 2 3 1 3 2 3", grid: 2, repeat: 2}
    hold: 0.2
  - section: "Block plucks"
    now: "p + i m a"
    sub: "the fingers together, on the off-beats"
    show: {kind: grip, root: C, quality: maj, frets: [[6, 3], [5, 3], [4, 2], [3, 0], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 321 4 321 5 321 4 321", grid: 2, repeat: 2}
    hold: 0.2
  - now: "On Am"
    sub: "the same block pattern, root on string 5"
    show: {kind: grip, root: A, quality: min, frets: [[5, 0], [4, 2], [3, 2], [2, 1], [1, 0]]}
    notes: null
    play: {groove: "5 321 4 321 5 321 4 321", grid: 2, repeat: 2}
    hold: 0.2
  - section: null
    show: null
    band: null
    notes: null
    card:
      title: You've got it when
      lines: ["you can play every pattern evenly on C and Am,", "keep the thumb steady under the fingers,", "and switch patterns without stopping."]
    hold: 6
