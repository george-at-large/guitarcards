# Repertoire C2: Bach, Bourrée in E minor BWV 996, the A section. Transcribed from the public-domain Mutopia edition
# (Rudy Matela, after the 1921 Wolfenbüttel lute edition); the lute's low D (bar 7) is raised an octave for guitar.
id: c2-bach-bourree
title: 'Bach: Bourrée in E minor'
rule: Two independent voices, played together from the start.
bpm: 60
captions: false
