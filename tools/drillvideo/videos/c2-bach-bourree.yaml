    marks:
    - [1, 'Bar 1: i – iv – V – iv over a walking bass; D♯ over the B is E minor’s leading tone.']
    - [2, 'Bar 2: the top climbs B C♯ D♯ E (melodic minor rising), falls D C (natural minor falling).']
    - [3, 'Bars 3–4: contrary motion: the top falls B A G F♯ E while the bass climbs G A B.']
    - [7, 'Bars 7–8: IV – V – I in G, the relative major. The lute’s low D sounds an octave up.']
