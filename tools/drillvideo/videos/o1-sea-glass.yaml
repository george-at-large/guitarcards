    marks:
    - [1, 'Harmonics: touch over the fret wire. Fret 12 sounds an octave up, fret 7 an octave and a 5th.']
    - [3, 'Travis: the thumb alternates; Gmaj13♯11 is the Lydian IV; the G → A hammer-on is the folk sus4.']
    - [7, 'Bossa in A: ii9 – V13 – Imaj9, then F♯7♯9, V of B minor: its ♯9 (A) is the blue note.']
    - [11, 'Flamenco: rasgueado, the Andalusian cadence, a ligado run in F♯ Phrygian dominant (G is the ♭9).']
    - [15, 'Funk: constant 16ths, x = muted. E9 is Dorian’s bright IV; the bend takes the 9th up to the 3rd.']
    - [17, 'Jazz: E♭9 is the tritone sub for A7; into Dmaj9 every voice falls a half step. B7♯9♭13 is VI7alt.']
    - [21, 'Coda: parallel 6ths falling home, then D6/9 in harmonics.']
