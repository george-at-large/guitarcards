# Repertoire R2: Blind Blake, West Coast Blues (1926, public domain): the form and technique of the first section.
# Blake's approach (per the John M. tab at guitartabs.cc after John Jackson, and Grossman's teaching): key of C, a steady
# alternating thumb, the ragtime circle C – E7 – A7 – D7 – G7 – C on standard grips (pinky on 6.3 for C's alternate bass,
# E7 with the 3.0→3.1 hammer, "long A" barred at 2 with the pinky on 1.5, D7 with the thumb on 6.2, G7 with the thumb
# on 6.3). The treble lines are written for this course in his style, not transcribed: the on-screen note says so.
id: r2-west-coast-blues
title: 'Blind Blake: West Coast Blues'
rule: The thumb never stops; the fingers syncopate over it.
bpm: 92
captions: false
steps:
