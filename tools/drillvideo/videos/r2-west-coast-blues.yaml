    marks:
    - [1, 'Bars 1–2: pinky on 6.3 for C’s alternate bass. The fingers land on 1, the & of 2 and 4: ragtime’s 3 + 3 + 2.']
    - [2, 'Bar 2 ends on D, E7’s 7th, early: the anticipation on the & of 4 that drives every change.']
    - [3, 'Bars 3–4: hammer the open G to G♯, E7’s 3rd.']
    - [5, 'Bars 5–6: “long A”, barred at 2 with the pinky on fret 5; lift it to fret 3 for A7.']
    - [8, 'Bar 8: D7 with the thumb on 6.2; the F → F♯ hammer is the blue note bending into the chord.']
