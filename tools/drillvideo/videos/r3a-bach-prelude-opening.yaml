    marks:
    - [1, 'Bars 1–4: one line, three voices: the D pedal, a middle voice climbing A B C♯ D, a top voice leaning F♯ G G F♯.']
    - [3, 'Bar 3: A7 over the D pedal; its C♯ and G clash with the D, and resolve in bar 4.']
    - [5, 'Bars 5–7: vi, then E7/G♯, the V of V, tips the music towards A, the dominant.']
