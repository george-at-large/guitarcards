# Video S2: 16ths and advanced strumming.
# Written by gen.py: change the loops there, not the steps here.
id: S2-strumming-advanced
title: "Strumming: 16ths and advanced"
rule: "Sixteen slots a bar; the hand plays all of them."
bpm: 84
captions: false

steps:
  - card: {title: "Strumming: 16ths and advanced", lines: ["16th-note strumming from folk to funk,", "disco, samba, rumba with the golpe,", "la pompe and the tresillo."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Each pattern for two bars, the hand in 16ths throughout", "2   Then over G – C – D – Em", "3   Next pattern"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "16ths"
    sub: "the hand moves in 16ths: down on 1 e & a, up on e and a"
    notes: ["At 16ths, down strokes fall on the beat and the &, up strokes on the e and the a."]
    say: "Strumming in sixteenths, from folk to funk and beyond."
  - section: "16ths"
    now: "16th folk"
    sub: "the pop strum in 16ths: busy and bright"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "D-DU-UDU D-DU-UDU", grid: 4, repeat: 2}
    hold: 0.2
  - now: "Funk scratch"
    sub: "all muted 16ths, accents on 2 and 4"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "dudu dudu dudu dudu", grid: 4, repeat: 2, accents: [4, 12]}
    hold: 0.2
  - now: "The funk groove"
    sub: "chord stabs inside the scratch"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "Dudu dUdu Dudu dUdU", grid: 4, repeat: 2, accents: [0, 5, 8, 13]}
    hold: 0.2
  - now: "Disco 16ths"
    sub: "open on the & of every beat"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "duDu duDu duDu duDu", grid: 4, repeat: 2, accents: [2, 6, 10, 14]}
    hold: 0.2
  - section: "Latin"
    now: "Samba"
    sub: "accents off the beat, the surdo on 2"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "DuDU dUdU DuDU dUdU", grid: 4, repeat: 2, accents: [0, 3, 6, 9, 12, 15]}
    hold: 0.2
  - now: "Tresillo"
    sub: "3 + 3 + 2 eighths"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "D--D--D-", grid: 2, repeat: 2, accents: [0, 3, 6]}
    hold: 0.2
  - now: "Rumba with golpe"
    sub: "x = the golpe, a slap on the strings"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "D-x-DUx- D-x-DUx-", grid: 4, repeat: 2, accents: [0, 2, 6]}
    hold: 0.2
  - section: "Gypsy jazz"
    now: "La pompe"
    sub: "bass-ish on 1 and 3, short chop on 2 and 4"
    show: {kind: grip, root: G, quality: maj, frets: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]]}
    notes: null
    play: {groove: "D-u-D-u-", grid: 2, repeat: 2, accents: [2, 6]}
    hold: 0.2
  - section: null
    show: null
    band: null
    notes: null
    card:
      title: You've got it when
      lines: ["you can keep 16ths moving in the arm for a whole song,", "place stabs, scratches and accents anywhere in them,", "and play each groove over G – C – D – Em."]
    hold: 6
