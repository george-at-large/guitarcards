    hold: 9.2
  - card: null
    section: The drill
    key: Key of G
    now: "G major · G B D"
    sub: "strings 3-2-1, 4-3-2, 5-4-3, 6-5-4 · every inversion · bottom to top"
    notes: ["Each triad is named by its lowest note: 1, 3 or 5.", "Each set ends with all its triads on the neck at once."]
    say: "Every inversion of G major on each set of three strings, from the bottom of the neck to the top. Then each one morphed, one note at a time."
  - section: G · strings 3-2-1
    notes: ['The G-B pair of strings bends every shape that crosses it: learn them by the lowest note.']
    play: strum 2
    click: false
    expand: {kind: ladder, root: G, quality: maj, voicing: close, strings: [3, 2, 1], minFret: 0, maxFret: 17, dir: up, bars: 0.5, sub: '{bassNote} on string {bassString}, fret {bassFret}', map: true}
