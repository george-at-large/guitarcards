# Short series: Folk baroque in DADGAD. Written for the course (see the notes on screen).
id: tp4-dadgad-folk-baroque
title: "Folk baroque in DADGAD"
rule: "Hammer, pull, and let every open string ring."
bpm: 88
captions: false
page_neck: true

steps:
  - card: {title: "Folk baroque in DADGAD", lines: ["A study in the British folk-baroque style (Davy Graham, Bert Jansch):", "DADGAD, a driving thumb, slurred riffs on top."]}
    hold: 3

  - card: null
    section: "Folk baroque"
    key: "D minor · DADGAD"
    notes: ["Tune D A D G A D. Written for the course in the style; for the real thing, learn Jansch’s Blackwaterside by ear."]
    page:
      root: D
      repeat: 3
      harmony: ["Dm:i", "C:♭VII", "B♭:♭VI", "Am:v Dm:i"]
      voices: ["1.0:.5 1.3:.5 2.3:.5 1.0:.5 3.0:.5 3.2h:.5 2.0:.5 1.3:.5 | 1.5:.5 1.3p:.5 1.0:.5 2.3:.5 2.5:.5 2.3p:.5 2.0:.5 3.2:.5 | 2.1:.5 2.3h:.5 1.0:.5 1.3:.5 1.5:.5 1.3p:.5 2.3:.5 2.1:.5 | 2.0:.5 3.2:.5 3.0:.5 3.2h:.5 2.0:.5 1.0:1.5 |", "6.0:1 4.0:1 6.0:1 4.0:1 | 5.3:1 4.0:1 5.3:1 4.0:1 | 5.1:1 4.0:1 5.1:1 4.0:1 | 5.0:1 5.0:1 6.0:2 |"]
      marks: [[1, "The thumb on 6 and 4: the open D drone under everything."], [2, "Pull-offs (p) to open strings: let them ring into each other."], [4, "i – ♭VII – ♭VI – v – i: the Aeolian descent."]]

  - section: null
    key: null
    notes: null
    card:
      title: You've got it when
      lines: ["the slurs are as loud as the picked notes,", "and the open strings ring into each other."]
    hold: 3
