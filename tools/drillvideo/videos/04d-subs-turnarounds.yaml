# Video 4d: substitutions in turnarounds, plain then substituted.
# Written by gen.py: change the loops there, not the steps here.
id: 04d-subs-turnarounds
title: "Substitutions in turnarounds"
rule: "Plain first, then the substitute: hear what changes."
bpm: 96
captions: false

steps:
  - card: {title: "Substitutions in turnarounds", lines: ["I – vi – ii – V in drop 2, then each substitute", "swapped in: plain, then substituted."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   The plain turnaround, voice-led", "2   The same with the substitute", "3   Then mix them as you comp"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "Gmaj7 – Em7 – Am7 – D7"
    sub: "each pair: plain, then substituted"
    notes: ["Every turnaround is I – (something) – ii – V: the substitutes change the something and the dominants."]
    say: "Substitutions in the turnaround. Each one plain, then substituted."
  - section: "Secondary dominant · plain"
    notes: null
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "Secondary dominant · substituted"
    notes: ["E7 for Em7: the V of Am7, its G♯ leading up to A."]
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | VI:7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "♯i°7 passing · plain"
    notes: null
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "♯i°7 passing · substituted"
    notes: ["G♯°7 between Gmaj7 and Am7: the bass climbs G → G♯ → A (it is E7♭9 without its root)."]
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | #i:dim7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "iii for I · plain"
    notes: null
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "iii for I · substituted"
    notes: ["Bm7 for Gmaj7: three notes in common, a step further from home."]
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| iii:m7 | VI:7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "Tritone subs · plain"
    notes: null
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | vi:m7 | ii:m7 | V:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: "Tritone subs · substituted"
    notes: ["B♭7 for E7 and A♭7 for D7: the bass walks G → B♭ → A → A♭ → G."]
    play: strum 2
    click: false
    expand: {kind: prog, key: G, chart: "| I:maj7 | bIII:7 | ii:m7 | bII:7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: "{roman}"}
  - section: null
    show: null
    band: null
    notes: null
    card:
      title: You've got it when
      lines: ["you can swap any of the four into a turnaround from the same position,", "hear the new bass line,", "and choose one on the spot."]
    hold: 6
