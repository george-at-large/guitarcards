# Repertoire B1: Ernesto Nazareth, Odeon (tango brasileiro, 1909, public domain), the A section. Melody, bass line and
# harmony read from Luciano Gallet's arrangement (Gallet d. 1931; Musica Brasilis edition), transposed from C♯/B minor
# to E minor so the melody's lowest note is the open 6th string. Melody in the thumb, the off-beat chords in the fingers,
# as in the piano original (tune in the left hand, the right hand answering).
id: b1-odeon
title: 'Nazareth: Odeon'
rule: The thumb sings the tune; the fingers answer off the beat.
bpm: 72
captions: false
