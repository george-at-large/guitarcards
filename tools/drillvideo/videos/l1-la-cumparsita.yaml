# Repertoire L1: Matos Rodríguez, La Cumparsita (1916, public domain), the opening 16 bars. Melody from the ABC
# transcription by John Chambers (abcnotation.com); arranged with the melody in position VII, dropping to first position at bar 11 (checked against classtab and published A minor arrangements), and open-string bass
# on beats 1 and 3. The last bar is simplified to a held A.
id: l1-la-cumparsita
title: La Cumparsita
rule: Short, accented, on the beat; then the melody sighs over it.
bpm: 60
captions: false
steps:
- card:
    title: La Cumparsita
    lines: ['The opening of the most famous tango (1916):', 'the marcato pulse, the 3-3-2 rhythm, and a minor melody pulled by its dominant.']
  hold: 4.5
- card: null
  key: A minor
  section: The tango rhythms
  now: Marcato in 4
  sub: four short chords a bar, each one cut off
  show:
    kind: grip
    root: A
    quality: min
    frets:
    - [5, 0]
    - [4, 2]
    - [3, 2]
    - [2, 1]
    - [1, 0]
  notes: ['Marcato: every beat marked and short. Lift the left hand after each strum.']
  bpm: 72
  play:
    groove: D - D - D - D -
    grid: 2
    accents: [0, 4]
    repeat: 2
- now: 3-3-2
  sub: accents on 1, the & of 2, and 4 · the habanera pulse under tango
  show:
    kind: grip
    root: E
    quality: '7'
    frets:
    - [6, 0]
    - [5, 2]
    - [4, 0]
    - [3, 1]
    - [2, 0]
    - [1, 0]
  notes: ['3-3-2 divides 8 eighths unevenly: the same tresillo as son, samba and much of Latin music.']
  play:
    groove: D - - D - - D -
    grid: 2
    accents: [0, 3, 6]
    repeat: 2
- section: Latin American
  bpm: 84
  show: null
  notes: ['The opening 16 bars: staccato bass · legato melody', 'Staccato bass on 1 and 3, legato melody: tango lives in that contrast.']
  page:
    harmony: ['', 'E7:V7', 'E7:V7', 'Am:i', 'Am:i', 'E7:V7', 'E7:V7', 'Am:i', 'Am:i', 'Dm:iv', 'Dm:iv', 'Am:i', 'Am:i', 'E7:V7', 'E7:V7', 'Am:i E7:V7', 'Am:i']
    pickup: true
    root: A
    voices: ['3.9:.25 3.9:.25 | 3.9:1 1.10:1 1.7:1 2.9:1 | r:.5 3.9:.5 3.10:.5 3.9:.5 3.8:1 3.9:.5 3.9:.25 3.9:.25 | 3.9:1 1.12:1 1.8:1 2.10:1 | r:.5 3.9:.5 3.10:.5 3.9:.5 3.8:1 3.9:.5 3.9:.25 3.9:.25 | 3.9:1 1.10:1 1.7:1 2.9:1 | r:.5 3.9:.5 3.10:.5 3.9:.5 3.8:1 3.9:.5 3.9:.25 3.9:.25 | 3.9:1 1.12:1 1.8:1 2.10:1 | r:.5 3.9:.5 3.10:.5 3.9:.5 3.8:1 3.9:1 | 3.7:1 2.10:1 2.9:1 2.10:1 | r:.5 3.9:.5 3.10:.5 3.9:.5 3.10:1 2.9:1 | 1.0:1.5 2.3:.25 2.2:.25 2.1:2 | r:.5 2.4:.5 1.0:.5 2.3:.5 1.0:1 1.1:1 | 2.3:1.5 2.2:.25 2.1:.25 2.0:2 | r:.5 2.3:.5 2.1:.5 2.0:.5 3.2:1 3.1:1 | 3.2:1.5 1.1:.5 1.0:.5 2.3:.5 2.1:.5 2.0:.5 | 3.2:4', 'r:.5 | 6.0:2 6.0:2 | 6.0:2 6.0:2 | 5.0:2 5.0:2 | 5.0:2 5.0:2 | 6.0:2 6.0:2 | 6.0:2 6.0:2 | 5.0:2 5.0:2 | 5.0:2 5.0:2 | 4.0:2 4.0:2 | 4.0:2 4.0:2 | 5.0:2 5.0:2 | 5.0:2 5.0:2 | 6.0:2 6.0:2 | 6.0:2 6.0:2 | 5.0:2 6.0:2 | 5.0:4']
    marks:
    - [1, 'Bars 1–2: E7 spelled downward (E D B G♯), then E circled by its neighbours F and D♯.']
    - [3, 'Bars 3–4: V – i, the dominant asks and the tonic answers. D♯ and G♯ are leading tones.']
    - [9, 'Bars 9–10: Dm, iv. From bar 11 the hand drops to first position: the open E makes the shift free.']
    - [11, 'Bars 11–14: the chromatic lament E D C♯ C, then D C♯ C B: the sighing line of tango.']
    - [15, 'Bars 15–16: i – V7 – i, the full minor cadence.']
