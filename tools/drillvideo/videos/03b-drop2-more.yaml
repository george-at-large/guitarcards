    key: Key of G
    now: "Four more chords on G"
    sub: "G6 · Gm6 · Gm(maj7) · G7sus4 · strings 4-3-2-1, 5-4-3-2, 6-5-4-3"
    notes: ["Each voicing is named by its bass note.", "G6 has the same notes as Em7, and Gm6 the same as Em7♭5."]
    say: "Four more drop 2 chords on G, on each set of four strings, from the bottom of the neck to the top."
