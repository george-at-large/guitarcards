# Video 3b: drop 2, four more chords (plan v3).
# Written by gen.py: change the loops there, not the steps here.
id: 03b-drop2-more
title: "Drop 2: four more chords"
rule: "Call the bass degree before you play each voicing."
bpm: 80
captions: false

steps:
