    show: {kind: line, root: G, pitches: ["C4", "A#3", "B3"], strings: [4, 3, 2, 1], labels: ["4", "#2", "3"]}
    band: null
    notes: ['Approach from above and below, then land on the beat.']
    play: run 0.5
    hold: 0.3
  - section: Enclosures
    now: "Enclose D"
    sub: "E♭ above, C♯ below, then D: the 5th"
    show: {kind: line, root: G, pitches: ["Eb4", "C#4", "D4"], strings: [4, 3, 2, 1], labels: ["b6", "#4", "5"]}
