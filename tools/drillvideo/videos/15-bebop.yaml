    notes: ['Approach from above and below, then land on the beat.']
    play: run 0.5
    hold: 0.3
  - section: Enclosures
    now: "Enclose F♯"
    sub: "G above, E♯ below, then F♯: the 7th"
    show: {kind: line, root: G, pitches: ["G4", "E#4", "F#4"], strings: [4, 3, 2, 1], labels: ["1", "#6", "7"]}
