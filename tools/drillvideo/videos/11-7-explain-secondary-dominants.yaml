# Explainer: Secondary dominants: the chain.
# Written by gen.py: change the loops there, not the steps here.
id: 11-7-explain-secondary-dominants
title: "Secondary dominants: the chain"
rule: "Function first: what does each chord want to do?"
bpm: 84
captions: false

steps:
  - card: {title: "Secondary dominants: the chain", lines: ["B7 – E7 – A7 – D7 – Gmaj7:", "what each chord does,", "and the guide tones that lead it."]}
    hold: 4.5
  - card: {title: The drill, lines: ["1   Hear the progression and say each Roman numeral", "2   Play the guide tones: the 3rd and 7th of each chord", "3   Name each chord’s job from the table, then play it in another key"]}
    hold: 7.4
  - card: null
    section: The drill
    key: Key of G
    now: "B7 – E7 – A7 – D7 – Gmaj7"
    sub: "in G · drop 2, then the guide tones"
    notes: ["Each chord is the V7 of the next: the bridge of rhythm changes, Sweet Georgia Brown, ragtime."]
    say: "Secondary dominants: the chain."
  - section: The progression
    play: strum 4
    click: false
    expand: {kind: prog, key: G, chart: "| III:7 | VI:7 | II:7 | V:7 | I:maj7 | I:maj7 |", voicing: drop2, strings: [4, 3, 2, 1], startFret: 5, bars: 1, sub: '{roman}'}
  - section: Guide tones
    notes: ['The 3rd and 7th of each chord: the two notes that say what the chord is, moving by step.']
    play: strum 4
    click: false
    expand: {kind: loop, chart: "| III:7 | VI:7 | II:7 | V:7 | I:maj7 | I:maj7 |", keys: [G], voicing: close, strings: [3, 2], guide: true, startFret: 5, bars: 1, now: '{chord}', sub: '{roman}'}
  - section: What each chord does
    now: null
    sub: null
    show: null
    notes: null
    table:
      title: "B7 – E7 – A7 – D7 – Gmaj7"
      head: [Chord, Function, Why]
      widths: [0.18, 0.32, 0.5]
      rows: [["B7", "V of vi (III7)", "D♯ leads to E"], ["E7", "V of ii (VI7)", "G♯ leads to A"], ["A7", "V of V (II7)", "C♯ leads to D"], ["D7", "V7", "F♯ leads home to G"]]
    hold: 9
  - section: null
    table: null
    card:
      title: You've got it when
      lines: ['you can name each chord’s job as it sounds,', 'play the guide tones without the full chords,', 'and find the progression in another key.']
    hold: 5
